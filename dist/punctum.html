:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1f2a27;--mut:#5d6b66;--acc:#2f7d6d;--acc2:#b5573a;--gold:#c99a2e;--line:#ddd6c6;--soft:#e8f1ee;--warn:#fff1e0;--warnb:#e0a15a;--sh:0 1px 3px rgba(0,0,0,.08)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.top{display:flex;gap:.6rem;align-items:center;padding:.55rem .9rem;max-width:1100px;margin:auto;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.12em;color:var(--acc);font-size:1.15rem;white-space:nowrap;cursor:pointer}
.logo small{display:block;font-weight:400;letter-spacing:0;font-size:.68rem;color:var(--mut)}
.top input[type=search]{flex:1;min-width:150px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.95rem}
select,button.ib{padding:.45rem .55rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.9rem}
nav{display:flex;overflow-x:auto;gap:.25rem;padding:0 .7rem .5rem;max-width:1100px;margin:auto;scrollbar-width:thin}
nav a{white-space:nowrap;text-decoration:none;color:var(--mut);padding:.4rem .8rem;border-radius:999px;font-size:.9rem;border:1px solid transparent}
nav a.on{background:var(--acc);color:#fff}
nav a:hover:not(.on){border-color:var(--line)}
main{max-width:1100px;margin:auto;padding:1rem .9rem 2rem}
h1{font-size:1.7rem;margin:.2rem 0 .6rem}h2{font-size:1.3rem;margin:1.4rem 0 .5rem;color:var(--acc)}h3{font-size:1.05rem;margin:1rem 0 .3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;box-shadow:var(--sh)}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.hero{background:linear-gradient(135deg,var(--acc),#1f5a4e);color:#fff;border-radius:18px;padding:1.4rem 1.2rem}
.hero h1{color:#fff;margin:0 0 .3rem;font-size:1.9rem;letter-spacing:.06em}.hero p{margin:.3rem 0;opacity:.95}
.warn{background:var(--warn);border:1px solid var(--warnb);border-radius:12px;padding:.7rem .9rem;margin:.8rem 0;font-size:.93rem}
.mut{color:var(--mut);font-size:.9rem}
.badge{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.78rem;font-weight:700;color:#fff;margin-right:.35rem}
.tag{display:inline-block;padding:.1rem .5rem;border-radius:8px;font-size:.78rem;background:var(--soft);color:var(--ink);margin:.1rem .15rem .1rem 0}
.pt{position:relative}.pt h3{margin:.1rem 0}.pt .star{position:absolute;right:.6rem;top:.5rem;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--gold)}
.pt p{margin:.25rem 0;font-size:.93rem}.pt .w{color:var(--acc2);font-size:.88rem}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}.bar input{flex:1;min-width:140px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button.b{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.55rem .95rem;font-size:.95rem;cursor:pointer}
button.b.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}button.b:disabled{opacity:.5}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.1rem .9rem;margin:.5rem 0}
details summary{cursor:pointer;padding:.65rem 0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin:.5rem 0}th,td{border-bottom:1px solid var(--line);padding:.45rem .5rem;text-align:left;vertical-align:top}th{color:var(--acc)}
.tw{overflow-x:auto}
ul{padding-left:1.2rem}li{margin:.2rem 0}
.clock{display:flex;flex-wrap:wrap;gap:.35rem}.clock span{padding:.3rem .55rem;border-radius:8px;border:1px solid var(--line);font-size:.82rem;background:var(--card)}.clock span.now{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:.35rem 0;padding:.65rem .8rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:.98rem;cursor:pointer}
.opt.ok{background:#2f7d6d;color:#fff;border-color:#2f7d6d}.opt.no{background:#b5573a;color:#fff;border-color:#b5573a}
.modal{position:fixed;inset:0;background:rgba(10,18,16,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal .box{background:var(--card);border-radius:20px;max-width:520px;width:100%;padding:1.3rem;text-align:center;max-height:96vh;overflow:auto}
.breath{width:130px;height:130px;margin:.8rem auto;border-radius:50%;background:radial-gradient(circle,var(--acc),#1f5a4e);animation:br 8s ease-in-out infinite;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:700}
@keyframes br{0%,100%{transform:scale(.7);opacity:.7}50%{transform:scale(1.05);opacity:1}}
@media(prefers-reduced-motion:reduce){.breath{animation:none}html{scroll-behavior:auto}}
footer{max-width:1100px;margin:0 auto;padding:1.2rem .9rem 2.2rem;border-top:1px solid var(--line);color:var(--mut);font-size:.85rem;text-align:center}
footer a{display:inline-block;margin:.4rem .3rem 0;padding:.4rem .9rem;border-radius:999px;background:var(--gold);color:#201a05;text-decoration:none;font-weight:700}
svg text{font-family:inherit}
.elp{cursor:pointer}

.skip{position:absolute;left:-999px;top:0;background:var(--acc);color:#fff;padding:.5rem 1rem;z-index:99}.skip:focus{left:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#main:focus{outline:none}
@media print{header,nav,footer,.bar,.skip,.ib,#modal{display:none!important}body{background:#fff!important;color:#000!important}details{display:block}details>*{display:block!important}a{color:#000;text-decoration:none}.card,.warn{break-inside:avoid;border:1px solid #999}}
@media(forced-colors:active){.badge{border:1px solid}}
</style>

const VX=`acu-cl¦Acupunctură corporală clasică (MTC)¦ace¦2¦2¦m¦n¦China; texte de acupunctură din Huangdi Neijing (compilat în straturi, datare disputată, între perioada Statelor Combatante și dinastia Han); sistematizare modernă în China după 1950¦Ace filiforme sterile înțeapă puncte alese după diagnosticul MTC (puncte locale + la distanță + după sindrom). Tradițional se reglează fluxul de Qi; explicația modernă invocă modularea nervoasă a durerii și a funcțiilor vegetative.¦Anamneză și diagnostic prin cele patru metode (observație, auscultare/olfacție, interogare, palpare: puls și limbă) // Alegerea a 4–12 puncte (locale, distale, după sindrom) // Dezinfecția pielii și a mâinilor; ace sterile de unică folosință, uneori cu tub-ghid // Inserție rapidă la adâncimea potrivită (de la câțiva mm la câțiva cm) // Căutarea senzației De Qi (greutate, căldură, amorțeală ușoară) // Stimulare manuală (rotire, ridicare–împingere) pentru tonifiere sau dispersare // Retenție 15–30 min, cu pacientul în repaus // Scoaterea acelor, numărarea lor, eliminarea în container pentru obiecte ascuțite¦Ace filiforme 0,16–0,30 mm și 13–75 mm lungime; tampoane cu alcool; container pentru ascuțite¦Cură tipică de 6–12 ședințe, 1–2 pe săptămână, apoi întreținere¦Puncte locale + distale (LI4, ST36, SP6, GB34, LR3 etc.)¦Durere cronică (lombară, cervicală, genunchi), cefalee, migrenă, greață postoperatorie, unele tulburări funcționale¦Dovezi de calitate scăzută până la moderată pentru durere cronică musculoscheletală (lombară, cervicală, umăr), migrenă și cefalee de tensiune (profilaxie); pentru osteoartrita de genunchi, efectul față de sham este mic și adesea sub pragul de relevanță clinică (Cochrane); pentru greață postoperatorie dovezile sunt limitate. Diferența față de acupunctura sham este de regulă mică, ceea ce arată că o parte din efect este contextual. Ghidurile se contrazic: NICE (NG59) nu recomandă acupunctura pentru lombalgie, ACP (2017) o include printre opțiunile nefarmacologice.¦Doar personal calificat. Riscuri rare: pneumotorax, infecții, leziuni de nervi, leșin. Precauție cu anticoagulante/coagulopatii, sarcină, imunosupresie, implanturi.¦Medici cu competență în acupunctură sau acupuncturiști autorizați (reglementarea diferă de la țară la țară)
ea¦Electroacupunctură¦ace¦2¦2¦l¦n¦China, aprox. 1958 (în contextul analgeziei chirurgicale prin acupunctură); răspândită global¦Perechi de ace sunt conectate la un stimulator care trimite curent slab pulsatil. Studiile experimentale sugerează că frecvențele joase (aprox. 2–4 Hz) și înalte (aprox. 100 Hz) mobilizează sisteme opioide endogene diferite; modul alternant (dens–dispers, de ex. 2/100 Hz) le combină.¦Ace inserate ca la acupunctura clasică // Fixarea clemelor pe perechi de ace (de regulă aceeași regiune sau meridian) // Pornirea aparatului la intensitate zero, creștere treptată până la contracție musculară vizibilă, dar confortabilă // Alegerea frecvenței (2 Hz, 100 Hz sau 2/100 Hz alternant) // Stimulare 10–30 min // Reducerea intensității la zero înainte de a desprinde clemele și a scoate acele¦Stimulator cu mai multe canale, cabluri cu cleme, ace sterile¦10–30 min/ședință, 1–3 ședințe pe săptămână¦Puncte din zona dureroasă și puncte distale pereche (ex. ST36–GB34)¦Durere musculo-scheletică, nevralgii, recuperare (adjuvant), analgezie perioperatorie¦Limitate; unele sinteze arată beneficii (de ex. osteoartrită de genunchi, greață postoperatorie), dar calitatea studiilor este variabilă, iar rezultatele față de sham sunt neuniforme.¦Contraindicată cu stimulator cardiac sau alt implant electric și în epilepsie/antecedente de convulsii; nu se trece curent peste inimă/torace, la cap, pe regiunea gâtului sau transversal prin linia mediană; precauție în boli cardiace, la coagulopatii, la piele infectată și la alergie la metale; se evită în sarcină.¦Medici și acupuncturiști formați în electroterapie
ac-cald¦Acupunctură cu ac cald (Wen Zhen)¦ace¦2¦2¦w¦n¦China, tradițională¦Combină înțeparea cu căldura: pe mânerul acului se arde un con sau o bucată de moxă, iar căldura se transmite prin ac în adâncime. Se folosește tradițional pentru „frig” și durere articulară.¦Inserția acului la adâncimea dorită // Verificarea stabilității acului // Plasarea unei bucăți de țigară de moxă (1–2 cm) pe mâner // Aprinderea; protejarea pielii cu un carton sau o bucată de tifon // Arderea completă, 5–15 min // Înlăturarea cenușii în recipient, scoaterea acului¦Ace cu mâner metalic, moxă, carton de protecție, recipient pentru cenușă¦1 ședință, 1–3 ori pe săptămână¦Articulații (genunchi, șold), lombar, abdomen inferior¦Durere articulară „rece”, artroză, dureri lombare¦Slabe–limitate; puține studii bune.¦Risc de arsură prin cădere de jar; nu se folosește pe pielea lezată, la pacienți care nu simt bine căldura (neuropatie) sau în febră mare.¦Practicieni formați în MTC
fire¦Fire needling (Huo Zhen)¦ace¦2¦3¦w¦n¦China, textele clasice; folosit în dermatologie și durere¦Un ac gros se încălzește la roșu în flacără și se înțeapă foarte rapid și superficial în punct sau în leziune. Tradițional se spune că „scoate” frigul și umezeala.¦Selectarea zonei și marcarea punctului // Dezinfecția pielii // Încălzirea acului la roșu într-o lampă cu alcool // Înțepare rapidă, de obicei 1–3 mm, scoatere imediată // Presiune ușoară și pansament dacă este nevoie¦Ace speciale din oțel/aliaj, lampă cu spirt¦Câteva ședințe, la 3–7 zile¦Zone locale cu durere, plăci cutanate, noduli¦Tradițional: durere, afecțiuni cutanate cronice, verucă¦Slabe; studii mici și de calitate scăzută.¦Procedură cu risc crescut: arsuri, cicatrici, infecții. Doar specialiști.¦Medici/practicieni foarte bine instruiți
dry¦Dry needling (înțepare uscată miofascială)¦ace¦2¦2¦l¦n¦Medicina occidentală: Janet Travell (primele injecții în puncte trigger publicate în 1942; termenul „dry needling” în manualul din 1983), Karel Lewit (1979: efectul provine din ac, nu din substanța injectată), Chan Gunn (IMS, model bazat pe radiculopatie)¦Acul se introduce în puncte trigger miofasciale, pe baza anatomiei și a palpării, nu a meridianelor. Scopul este reducerea durerii; răspunsul de contracție locală (twitch) este considerat util de unii autori, dar mecanismul nu este stabilit.¦Evaluarea musculaturii și localizarea benzii încordate cu durere reproductibilă // Dezinfecție, inserție cu ac fin // Mișcări rapide de intrare–ieșire (variantă descrisă în literatură ca „fast-in, fast-out”) sau retenție 5–15 min // Obținerea răspunsului de contracție locală // Întinderi blânde și mișcare activă după procedură¦Ace sterile fine, mănuși, tampoane¦1–6 ședințe, 1/săptămână¦Trapez, infraspinos, gluteu mic, gambă, paravertebrali¦Dureri miofasciale, tendinopatii, cefalee cervicogenă¦Limitate: posibilă ameliorare a durerii pe termen scurt (de ex. lombalgie cronică, studii de calitate metodologică scăzută); efectele pe termen lung sunt neclare, iar unele sinteze nu arată avantaj față de placebo.¦Dureri post-procedură (câteva zile), sângerare/hematom, leșin; rar pneumotorax (zona toracică) sau infecții transmise prin sânge. Precauție la coagulopatii și anticoagulante; doar personal instruit.¦Kinetoterapeuți, medici și alți clinicieni instruiți (autorizarea diferă pe țări)
intrad¦Ace intradermice (press tacks) și ace pentru ureche¦ace¦1¦2¦l¦p¦Ace intradermice dezvoltate în Japonia (de ex. mărcile Pyonex/Seirin); auriculoterapia modernă a fost sistematizată de Paul Nogier (Franța, 1957), deși puncte auriculare apar și în textele chineze clasice¦Ace foarte scurte (0,3–1,5 mm) fixate cu plasture pentru 2–7 zile, pentru stimulare prelungită prin apăsarea ocazională a pacientului.¦Alegerea punctului // Dezinfecția pielii // Aplicarea acului cu penseta sterilă sau aplicatorul // Fixarea cu plasturele // Instruirea pacientului să apese ușor de 3–5 ori pe zi // Scoaterea după 2–7 zile sau la prima iritație¦Ace/pioneze sterile, pensetă, aplicator, plasturi¦2–7 zile per aplicare¦Ureche (Shenmen, simpatic), puncte ale mâinii/piciorului¦Durere acută, stres, insomnie, dependențe (adjuvant)¦Limitate și de calitate scăzută; hărțile punctelor auriculare nu sunt susținute de dovezi solide, iar o parte din efect poate fi contextual.¦Risc de infecție locală și iritație cutanată; se scot la semne de roșeață, durere sau secreție; nu pentru diabet cu piele fragilă.¦Practicieni formați; pacientul poate apăsa singur

acuto¦Acupotomie (Xiao Zhen Dao — „ac-bisturiu”)¦ace¦2¦3¦w¦n¦China, Zhu Hanzhang (1976); inspirată de „cele nouă ace” din textele clasice¦Ac cu vârf plat/lamă mică pentru a secționa aderențe de țesut conjunctiv sau a „elibera” zone tensionate, în loc de simpla înțepare.¦Evaluarea clinică și imagistică, alegerea zonei // Dezinfecție, anestezie locală uneori // Inserția acului-bisturiu pe traseul planificat // Mișcări scurte de secționare // Compresie și pansament¦Ac-bisturiu steril, anestezic local¦Câteva ședințe, la 1–2 săptămâni¦Aderențe cervicale, lombare, tendinoase¦Tendinite, durere cronică, periartrită scapulo-humerală¦Slabe–limitate; puține studii independente.¦Procedură invazivă cu risc de lezare nervoasă/vasculară; doar medici instruiți.¦Medici cu pregătire specifică
sang¦Sângerare terapeutică (Dian Ci / puncte Jing-puț)¦ace¦2¦3¦w¦n¦China, tradițională (atribuită textelor clasice); practici similare în multe culturi¦Cu o lanțetă se face o înțepătură superficială într-un punct (adesea la vârful degetelor sau al urechii) pentru a elibera o picătură sau câteva picături de sânge, tradițional pentru „căldură” și febră.¦Dezinfecția zonei // Înțeparea punctului cu lanțeta sterilă // Strângerea ușoară pentru 2–5 picături // Presiune cu tampon steril până la oprirea sângerării // Eliminarea lanțetei în container¦Lanțete sterile, tampoane, mănuși¦1–2 ședințe în episoade acute¦Vârfurile degetelor (EX-UE11), PC9, LU11, vârful urechii¦Febră, faringită, cefalee, intoxicații termice (uz tradițional)¦Slabe; sinteze (de ex. pentru cefalee primară, 17 studii) au certitudine foarte scăzută și risc mare de bias; fără studii solide.¦Risc de infecție și transmitere de patogeni prin sânge; doar cu materiale sterile de unică folosință. Fără coagulopatii/anticoagulante.¦Practicieni autorizați

acupresura¦Acupresură (presopunctură)¦pres¦0¦1¦l¦d¦China, foarte veche; parte din Tuina; popularizată global în sec. XX¦Presiune manuală fermă dar confortabilă pe aceleași puncte ca la acupunctură, fără ace. Efectul propus: stimulare mecanică a nervilor și țesutului conjunctiv, relaxare, modularea durerii.¦Poziție stabilă, relaxată; mâini curate // Localizarea punctului (cun, repere osoase, sensibilitate locală) // Presiune treptată, 3–5 s, cu pulpa degetului mare sau arătătorului // Menținerea presiunii fixe sau cu cercuri mici 30–90 s // Respirație lentă (inspir 4 s, expir 6 s) // Eliberare lentă; repetă pe partea opusă // 1–3 ori pe zi¦Degete, cot, bile de lemn, minge de tenis, capete rotunjite de lemn¦30–90 s/punct, 3–6 puncte/sesiune, 1–3 sesiuni/zi¦PC6, ST36, LI4, GB20, SP6, HT7, GV20 etc.¦Greață (P6), cefalee de tensiune, stres, insomnie, dureri menstruale ușoare, oboseală, dureri musculare¦Pentru greață postoperatorie, stimularea PC6 (inclusiv acupresiunea) are dovezi de calitate scăzută față de sham și de calitate moderată de echivalență cu antiemeticele (Cochrane 2015); pentru greața din chimioterapie o meta-analiză din 2023 arată beneficii, dar studiile sunt puține și eterogene; dovezi limitate pentru oboseală, anxietate și durere.¦În general sigură. Fără presiune pe răni, vene varicoase severe, tumori, fracturi; punctele ⚠ se evită în sarcină. Oprește la durere ascuțită sau amețeală.¦Oricine, cu instruire de bază; terapeuți de masaj/acupresori
shiatsu¦Shiatsu (Namikoshi și Zen Shiatsu Masunaga)¦pres¦0¦1¦w¦p¦Japonia; Tokujiro Namikoshi (1905–2000), care și-a fondat școala în anii 1940 și a obținut recunoașterea shiatsu ca terapie distinctă; Shizuto Masunaga (Zen Shiatsu, a doua jumătate a sec. XX)¦Presiune cu degetele mari, palme, coate, genunchi pe corp îmbrăcat, plus întinderi. Stilul Namikoshi se prezintă ca fiind bazat pe anatomia și fiziologia occidentală; Zen Shiatsu (Masunaga) lucrează cu meridiane extinse și evaluarea abdomenului (hara).¦Interviu scurt și observație a posturii // (Masunaga) evaluarea hara și a pulsului // Poziționare comodă pe saltea (futon) // Presiune perpendiculară, lentă, cu greutatea corpului, 3–10 s pe punct // Mobilizări și întinderi pasive // Încheiere cu relaxare și respirație¦Saltea, haine largi; fără uleiuri¦30–60 min, 1/săptămână sau 2/săptămână, apoi lunar¦Spate, gât, șolduri, abdomen, picioare¦Tensiune musculară, stres, oboseală, dureri cervicale/lombare ușoare¦Foarte limitate; nu este demonstrată eficacitatea pentru vreo afecțiune anume, deși poate favoriza relaxarea.¦Nu în febră, tromboză, osteoporoză severă, fracturi recente; atenție în sarcină (zone-cheie). Au fost raportate rar cazuri grave (tromboză, embolie).¦Terapeuți shiatsu autorizați/formați
tuina¦Tuina (Tui Na) — masaj terapeutic chinez¦pres¦0¦2¦l¦n¦China, parte a MTC; spital și învățământ universitar¦Un sistem medical de manevre manuale pe meridiane, puncte și articulații. Manevrele de bază includ împingerea (Tui), apucarea (Na), apăsarea (An), frecarea circulară (Mo), rularea (Gun), frământarea (Rou), frecarea rapidă (Ca) și scuturarea (Dou); listele diferă după școală.¦Diagnostic MTC // Alegerea manevrelor după sindrom și zonă // Încălzirea țesuturilor cu manevre ușoare // Manevre specifice (rulare, împingere, apăsare, frământare) // Mobilizarea articulațiilor (tracțiuni, rotații) numai de către practicieni instruiți // Încheiere cu manevre de calmare¦Mâinile practicantului; uneori uleiuri sau unguente cu plante¦20–40 min, 1–3/săptămână¦Gât, umeri, spate, șold, genunchi; mână și brațe la copii¦Cervicalgie, lombalgie, tensiune musculară, dureri de umăr, tulburări funcționale ale copilului (tuina pediatrică)¦Limitate; meta-analize mici indică ameliorarea durerii musculoscheletale, dar studiile sunt în mare parte mici și de calitate scăzută.¦Manevrele articulare sunt riscante fără instruire; atenție la fracturi sau risc de fracturi, osteoporoză, tromboză/inflamație venoasă, răni deschise, spondilită anchilozantă și hernii de disc acute.¦Terapeuți de tuina formați (în China, medici)
anma¦Anma (Amma) japonez¦pres¦0¦1¦w¦n¦China → Japonia (perioada Nara, sec. VIII); sistem distinct din sec. XIV (Akashi Kan’ichi, 1320); din perioada Edo asociat cu nevăzătorii (Sugiyama Waichi, 1614–1694)¦Masaj tradițional pe linii, cu frământare și presiune blândă; precursor al shiatsului. În Japonia a fost tradițional o profesie a persoanelor nevăzătoare.¦Pacientul stă așezat sau întins, îmbrăcat // Frecări ușoare pentru încălzire // Frământare și presiuni pe mușchi // Stretching ușor // Presiune scurtă pe puncte sensibile¦Mâini; scaun sau pat¦20–45 min¦Umeri, ceafă, spate, picioare¦Relaxare, tensiune musculară¦Foarte limitate.¦Siguranță comparabilă cu masajul clasic.¦Terapeuți de masaj
jsj¦Jin Shin Jyutsu și Jin Shin Do¦pres¦0¦1¦w¦p¦Jin Shin Jyutsu: Japonia (Jiro Murai, 1886–1960), adusă în SUA de Mary Burmeister din anii 1950; Jin Shin Do: SUA, Iona Marsaa Teeguarden (anii 1970, carte în 1978), derivată din Jin Shin Jyutsu, dar diferită¦Jin Shin Jyutsu: atingere blândă, menținută, pe 26 „încuietori de siguranță a energiei” (Safety Energy Locks), uneori cu respirație. Jin Shin Do: presiune fermă, directă și menținută pe puncte de acupunctură, combinată cu lucru asupra tensiunii emoționale (influența lui Wilhelm Reich).¦Pacientul stă îmbrăcat, întins // Practicantul ține mâinile pe două puncte simultan (JSJ) // Menține 1–5 min, urmărind „pulsul” local // Jin Shin Do: presiune fermă, menținută, de regulă cu două mâini (un punct local și unul distal), cu respirație și atenție la zonele tensionate // Încheiere cu relaxare¦Mâinile; salteaua sau patul¦45–60 min¦Mâini, umeri, spate, abdomen¦Relaxare, stres, tensiune; auto-aplicare pentru mâini și degete (JSJ)¦Foarte limitate; efecte probabil de relaxare.¦Siguranță bună; nu înlocuiește tratamentul medical.¦Practicieni certificați de școli private
thai¦Nuad Thai (masaj tradițional thailandez)¦pres¦0¦2¦l¦n¦Thailanda, tradiția Nuad Boran; înscris în 2019 pe Lista reprezentativă a patrimoniului cultural imaterial al umanității (UNESCO)¦Presiune cu palmele, degetele mari, coatele, genunchii și picioarele pe zece linii energetice (Sen Sib), plus întinderi pasive asemănătoare yoga, pe corp îmbrăcat.¦Salut (wai) și interviu scurt // Presiune pe linii de la picioare spre șolduri, apoi spate, brațe, gât // Stretching și mobilizare pasivă (yoga-like) // Presiune cu palmele pe puncte // Încheiere cu relaxare¦Saltea tare, haine largi, uneori comprese cu plante¦60–120 min¦Picioare, spate, șolduri, umeri¦Durere lombară, rigiditate, stres¦Limitate; studii mici sugerează ameliorarea temporară a durerii și relaxare, dar afirmațiile practicienilor depășesc adesea ce a fost demonstrat clinic.¦Fără întinderi forțate; atenție în osteoporoză, hernie de disc acută, sarcină, tromboză.¦Terapeuți Nuad Thai formați (în Thailanda, licențiați)
marma¦Marma (Ayurveda)¦pres¦0¦2¦w¦p¦India; Sushruta Samhita (text ayurvedic clasic, datare disputată), Kalaripayattu în Kerala¦107 puncte vitale (marma) unde se întâlnesc mușchi, vase, nervi, oase și articulații. În textele clasice sunt în primul rând zone vulnerabile (chirurgie, traumă); masajul cu ulei de plante prin presiune circulară sau menținută, pentru echilibrarea celor trei doșa (vata, pitta, kapha), este o aplicație tradițională și modernă fără studii clinice solide.¦Evaluarea constituției (prakriti) // Ungere ușoară cu ulei medicinal // Presiune circulară sau menținută pe marma cu degetul mare // Mișcări lente, uneori cu respirație // Încheiere cu relaxare¦Uleiuri ayurvedice, mâini¦20–40 min¦Marma de pe picior (Kshipra), mână (Talahridaya), cap și gât¦Relaxare, durere musculară, stres (uz tradițional)¦Foarte limitate.¦Unele marma sunt zone vulnerabile (gât, abdomen, cap); presiune blândă; precauție în sarcină.¦Practicieni ayurvedici formați
trigger¦Compresie ischemică a punctelor trigger¦pres¦0¦1¦l¦d¦Medicina occidentală: Janet Travell (publicații din 1942) și David Simons (manualele Travell–Simons, începând din 1983)¦Presiune susținută și progresivă pe o bandă musculară încordată, cu durere locală sau iradiată, până când sensibilitatea scade. Mecanismul nu este stabilit (se discută despre scăderea sensibilității locale și relaxare reflexă).¦Localizarea punctului trigger prin palpare // Presiune lentă până la „durere suportabilă” (6–7 din 10) // Menținere 30–90 s sau până când durerea scade cu 50% // Respirație lentă, relaxare musculară // Întindere ușoară a mușchiului după aceea // Repetare 2–3 ori¦Degete, cot, minge de tenis, Theracane, bile de masaj¦30–90 s/punct, 1–2 ori/zi¦Trapez superior, infraspinos, gluteu mijlociu, gambă¦Tensiune cronică, dureri miofasciale, cefalee de tensiune¦Limitate; o meta-analiză din 2022 arată creșterea pragului de durere la presiune, dar nu și scăderea durerii raportate de pacient; studii mici.¦Evită presiunea pe artere, nervi, zone inflamate, tumori; oprește la furnicături sau amorțeală.¦Kinetoterapeuți, terapeuți de masaj; auto-aplicare
acufacial¦Acupresură facială cosmetică și masaj cu jad¦pres¦0¦1¦w¦d¦Tradiții asiatice; Kobido (Japonia) și masaj cu role din jad/cuarț în trend modern¦Presiune ușoară și mișcări pe puncte ale feței (ST2, LI20, GB14, GV24) pentru relaxare musculară și circulație locală; se folosește frecvent cu rolă din jad sau cuarț.¦Fața curată, ulei sau ser // Presiune blândă 5–10 s pe fiecare punct // Mișcări ascendente și spre exterior, fără tragere de piele // Pe frunte, obraji și maxilar // Respirație lentă¦Degete, rolă de jad/cuarț, gua sha facial¦5–10 min/zi¦ST2, ST6, ST7, LI20, GB14, EX-HN5, BL2¦Relaxare facială, tensiune de maxilar, cefalee de tensiune¦Foarte limitate; nu există dovezi solide pentru efecte antirid sau de „lifting”; relaxarea subiectivă este plauzibilă, dar nedemonstrată prin studii de calitate.¦Fără presiune pe acnee inflamată, rozacee, piele iritată; fără presiune pe globul ocular.¦Cosmeticieni instruiți sau auto-aplicare
moxa-d¦Moxibustie directă (con pe piele)¦cald¦1¦3¦l¦n¦China, antică; ajunsă în Japonia (okyu) în epoca veche (aprox. sec. VI–VIII, datare orientativă)¦Un con mic de pelin (Artemisia) se arde direct pe punct. În varianta cu cicatrice, arsura este deliberată; în varianta fără cicatrice, conul se scoate înainte de a se arde pielea.¦Alegerea punctului și marcarea // Aplicarea unui strat subțire de pastă sau ulei // Așezarea conului (de mărimea unui bob de orez) // Aprinderea cu bețișor de tămâie // Scoaterea conului când pacientul simte căldură intensă // Repetarea 3–7 conuri // Curățarea zonei, pansament¦Moxă fină (Artemisia argyi), bețișor de tămâie, recipient pentru cenușă¦1–3 ședințe pe săptămână¦ST36, CV4, CV6, GV4, BL23¦Slăbiciune, frig, dureri articulare reci, digestie lentă (tradițional)¦Limitate; calitate scăzută.¦Risc de arsuri, cicatrici, infecții; fum iritant. Nu se aplică în febră mare, pe piele lezată sau pe abdomen în sarcină.¦Practicieni formați
moxa-i¦Moxibustie indirectă (ghimbir, usturoi, sare, cutie)¦cald¦1¦2¦l¦p¦China antică; descrisă în texte clasice¦Între moxă și piele se interpune un strat izolator: felie de ghimbir, usturoi sau sare în ombilic (CV8), sau o cutie/bol cu moxă așezat pe piele. Căldura este mai blândă și mai uniformă.¦Alegerea zonei // Pregătirea feliei (ghimbir 2–3 mm cu găuri mici) sau a stratului de sare // Plasarea conului de moxă pe izolator // Aprinderea // Înlocuirea conului când se consumă (3–7 repetări) // Verificarea pielii // Sau: așezarea cutiei de moxă pe abdomen/spate cu un prosop sub ea¦Ghimbir proaspăt, usturoi, sare, cutie de moxă, prosop¦15–30 min¦CV8 (ombilic), CV4, CV6, ST36, BL23, lombar¦Frig, balonare, dureri abdominale „reci”, dureri lombare, oboseală¦Limitate; unele studii pentru dureri articulare și digestie.¦Risc de arsuri minore; ventilează. Nu se aplică la febră mare, piele lezată, la persoane cu sensibilitate redusă a pielii.¦Practicieni formați sau auto-aplicare cu dispozitive sigure
moxa-s¦Țigară de moxă (moxă ținută deasupra pielii)¦cald¦1¦2¦l¦p¦China și Japonia¦Un baton de pelin presat se aprinde și se ține la 2–3 cm de piele. Se folosesc trei tehnici: ciocănirea de vrabie (mișcări scurte, în sus și în jos), cercul (rotire deasupra zonei) și încălzirea fixă.¦Aprinderea batonului // Menținerea la 2–3 cm de punct // Una dintre tehnici // Verificarea căldurii cu degetul liber // Oprire când pielea devine ușor roșie (5–10 min/punct) // Stingerea batonului în recipient cu nisip sau tub sigilat¦Baton de moxă (fără fum sau clasic), bol cu nisip, recipient de stingere¦5–15 min/punct, zilnic sau la câteva zile¦BL67 (prezentație pelviană — doar sub îndrumare medicală), ST36, CV4, CV6, BL23¦Frig, dureri articulare, slăbiciune; BL67 în sarcină sub îndrumare¦Limitate pentru majoritatea indicațiilor; pentru prezentația pelviană, o sinteză Cochrane arată mai puține prezentații non-cefalice la naștere cu moxibustie plus îngrijire uzuală (certitudine moderată), fără diferență clară la rata cezarienelor.¦Ventilație bună; risc de arsuri; fum iritant la astmatici; fără somn cu baton aprins; în sarcină doar sub supraveghere medicală.¦Practicieni formați sau auto-aplicare atentă
compresa¦Comprese calde cu plante (Luk Pra Kob)¦cald¦0¦1¦l¦p¦Thailanda, medicina tradițională; similar în Ayurveda și China¦Un săculeț cu ierburi (plai, turmeric, lemongrass, camfor) se încălzește la abur și se aplică pe corp, combinând căldura cu uleiurile volatile ale plantelor.¦Încălzirea compresei la abur 5–10 min // Testarea temperaturii pe încheietură // Aplicarea pe zonă cu presiune blândă // Mișcări de ștampilare și rulare // Reîncălzirea la nevoie¦Săculeți cu plante, oală cu abur¦15–30 min¦Spate, umăr, gât, picioare¦Rigiditate, dureri musculare, relaxare¦Limitate; în principal studii mici.¦Atenție la arsuri; nu pe piele lezată; alergii la plante.¦Terapeuți Nuad Thai sau acasă
vent-u¦Ventuze uscate (staționare, glisante, flash)¦vid¦0¦2¦l¦p¦Atestat în Egiptul antic (Papirusul Ebers, aprox. 1550 î.Hr.), la Hipocrate, în lumea islamică și în China (Ge Hong, aprox. 300 d.Hr.); popular în Europa în sec. XIV–XVII, cu persistență ulterioară¦Ventuze din sticlă, silicon sau plastic creează vid pe piele, ridicând țesutul și mărind fluxul sanguin local. Tipuri: staționar (5–15 min), glisant (ventuza se mișcă pe uleiul aplicat), flash (aplicare și scoatere repetate).¦Piele curată, fără rănire // Ungere cu ulei (pentru glisat) // Aplicarea ventuzei (pompă, flacără sau silicon) // Staționar 5–15 min sau glisare lentă // Eliberarea vidului apăsând pielea lângă ventuză // Curățarea zonei, hidratare¦Ventuze din sticlă/silicon, pompă, ulei¦5–15 min, 1/săptămână¦Spate (lângă coloană), umăr, coapsă, gambă¦Tensiune musculară, dureri cervicale/lombare¦Limitate; calitatea studiilor este scăzută și mecanismul nu este clar stabilit; unele studii pentru dureri cervicale și lombare.¦Vânătăi circulare (câteva zile până la 1–2 săptămâni), uneori vezicule sau cicatrice; arsuri la ventuzele cu flacără; infecții cutanate rare; nu pe piele lezată, la coagulopatii, anticoagulante, sarcină (abdomen/lombar).¦Terapeuți formați; auto-aplicare cu ventuze din silicon
hijama¦Ventuze umede (Hijama / Hijamah)¦vid¦2¦3¦w¦n¦Practică veche; în lumea islamică (hijama, parte a medicinei profetice), recomandată și de medici precum Ibn Sina; ventuzarea apare și în Egiptul antic și în China¦Se aplică ventuza uscat, apoi se fac mici incizii superficiale și se reaplică vidul pentru a extrage mici cantități de sânge, în scopul „purificării”.¦Dezinfecție, ventuze aplicate 3–5 min // Scoaterea ventuzelor // Incizii superficiale cu lanțetă sterilă // Reaplicarea ventuzelor 3–5 min // Scoatere, curățare, pansament // Eliminarea materialelor în containere speciale¦Ventuze sterile, lanțete de unică folosință, mănuși, dezinfectante¦Fără protocol standardizat; frecvența variază după tradiție și practicant¦Spate, între omoplați, zona C7¦Durere, cefalee, hipertensiune (uz tradițional)¦Slabe; eficacitatea nu este demonstrată (lipsesc studii mari, de calitate); unele studii mici pentru durere, de calitate scăzută.¦Risc de infecții bacteriene și de infecții transmise prin sânge (în special hepatita B și C) dacă materialele nu sunt sterile și de unică folosință sau deșeurile nu sunt tratate ca deșeuri medicale; anemie; fără coagulopatii/anticoagulante.¦Practicieni autorizați cu igienă strictă
gua¦Gua Sha (răzuire terapeutică)¦vid¦0¦1¦l¦d¦China; echivalente: Cao Gio (Vietnam), Kerokan (Indonezia), coining (Occident)¦Pielea unsă cu ulei se răzuiește cu un instrument neted (jad, corn, oțel, ceramică, monedă) până apar peteșii roșii (sha). Tradițional se consideră că eliberează stagnarea și „căldura” din țesut.¦Ungere cu ulei // Răzuire unidirecțională, cu unghi ~45°, 10–30 mișcări pe zonă // Presiune moderată, 3–5 min/zonă // Apariția peteșiilor roșii (sha), care dispar de obicei în câteva zile // Curățarea uleiului // Evitarea frigului și a dușului fierbinte imediat după¦Instrument neted (jad, oțel, corn), ulei de masaj¦Ședință 10–20 min, la 5–7 zile¦Gât, umeri, spate (de-a lungul coloanei), picioare¦Tensiune musculară, dureri cervicale, răceli (tradițional)¦Limitate; o sinteză sistematică (6 studii, urmărire 7–21 zile) sugerează efecte pe termen scurt asupra durerii musculoscheletale, mai ales vertebrale; studii mici.¦Peteșii/echimoze temporare; nu pe piele lezată, cu coagulopatii, anticoagulante, infecții, vene varicoase; instrumentul se curăță între persoane (risc teoretic de transmitere de patogeni din sânge).¦Terapeuți MTC; auto-aplicare ușoară
plum¦Ciocănel Mei Hua / Qi Xing („floare de prun” / „șapte stele”)¦vid¦1¦2¦w¦p¦China, tradițional¦Un ciocănel cu 5–7 ace scurte se aplică percutant pe piele, ritmic, cu intensitate ușoară, medie sau puternică, pentru a stimula zona. Se spune că dispersează stagnarea și stimulează circulația.¦Dezinfecția pielii și a instrumentului // Ciocănire ușoară cu încheietura mâinii, 70–100 lovituri/min // Intensitate adaptată zonei // Parcurgerea zonei de-a lungul meridianului // Curățarea pielii, eliminarea instrumentului sau sterilizare¦Ciocănel cu 5–7 ace, dezinfectant¦5–15 min, 1–3/săptămână¦Scalp, ceafă, spate (linia BL), zone dermatologice¦Insomnie, cefalee, alopecie areata, dermatoze (uz tradițional)¦Slabe; studii mici.¦Poate provoca sângerare ușoară; risc de infecție dacă instrumentul nu este steril; fără piele lezată.¦Practicieni formați
laser¦Laserpunctură (acupunctură cu laser de nivel scăzut)¦tehno¦0¦1¦l¦n¦Sec. XX (aprox. din anii 1970); răspândit în Europa și Asia¦Un laser de nivel scăzut (în studii de obicei aprox. 630–1064 nm, de la câțiva mW la sute de mW, de regulă clasa 3B) iradiază punctul fără a străpunge pielea. Se propun efecte fotochimice și neuromodulatoare. Atractiv pentru copii și pentru cei care se tem de ace.¦Alegerea punctului // Echipament cu protecție pentru ochi // Plasarea sondei perpendicular pe piele // Iradiere conform dozei alese (durata depinde de putere; de obicei zeci de secunde/punct) // Repetare pe 4–8 puncte // Curățarea sondei între pacienți¦Laser terapeutic cu sondă, ochelari de protecție¦8–15 ședințe, 2–3/săptămână¦Puncte de acupunctură, articulații, zone dureroase¦Durere musculo-scheletică, tendinopatii, copii (fără ace), dureri ale ATM¦Limitate; o sinteză din 2025 raportează reducerea durerii cu certitudine scăzută–moderată, dar cu eterogenitate foarte mare, eșantioane mici, risc de bias și bias de publicare; parametrii (lungime de undă, putere, doză) sunt raportați inconsecvent.¦Protecția ochilor obligatorie (nu priviți direct în fascicul; risc de leziune a retinei); nu pe tumori, pe abdomen în sarcină, pe glanda tiroidă; precauție la fotosensibilizare.¦Clinicieni cu aparat autorizat
teas¦TENS / TEAS (stimulare electrică transcutanată a punctelor)¦tehno¦0¦1¦l¦p¦TENS: anii 1960–70 (după teoria controlului porții durerii, 1965); TEAS: adaptare la puncte de acupunctură, cercetată mai ales în China¦Electrozi de suprafață trimit curent slab pe piele, în zonele durerii sau pe puncte de acupunctură (TEAS). Mecanisme propuse: controlul porții durerii și eliberarea de peptide opioide endogene.¦Piele curată, fără răni // Electrozi lipiți pe punct sau pe zonă // Alegerea frecvenței (de ex. 2 Hz, 100 Hz sau alternant 2/100 Hz, modul folosit în majoritatea studiilor TEAS) // Creșterea intensității până la furnicătură confortabilă // 20–30 min // Oprirea aparatului înainte de scoaterea electrozilor¦Aparat TENS, electrozi autoadezivi¦20–30 min, 1–3 ori/zi¦Zonă dureroasă, puncte locale, PC6, ST36, LI4¦Durere cronică, dureri postoperatorii, greață¦Limitate; pentru TENS în durerea cronică, o prezentare generală Cochrane arată certitudine foarte scăzută; pentru TEAS în greață și vărsături postoperatorii, sinteze recente raportează beneficii ca adjuvant la antiemetice, dar studiile sunt eterogene, în mare parte din China, cu orbire dificilă.¦Contraindicat cu stimulator cardiac, în sarcină (abdomen), epilepsie; nu pe gât anterior, ochi, piele lezată.¦Fizioterapeuți, medici; aparat de uz personal
band¦Brățări electrice și mecanice pentru greață (P6)¦tehno¦0¦1¦l¦d¦Anii 1980–90¦Stimulează punctul PC6 la încheietură cu un buton care apasă mecanic (Sea-Band) sau cu impulsuri electrice (ReliefBand). Folosit pentru rău de mișcare și greață.¦Găsirea PC6 (2 cun deasupra pliului încheieturii) // Poziționarea butonului pe punct // Verificarea presiunii fără a întrerupe circulația // Purtare cu 15–30 min înainte de călătorie sau tratament // Reglarea intensității (modelele electrice)¦Brățară elastică cu buton sau dispozitiv electric¦Purtare continuă în episod¦PC6 (ambele încheieturi)¦Rău de mișcare, greață postoperatorie, greață de sarcină (cu medic)¦Cochrane 2015 (PONV): dovezi de calitate scăzută că stimularea P6 e mai bună decât placebo și calitate moderată că nu diferă de antiemetice; chimioterapie: meta-analize mici, calitate variabilă; sarcină: rezultate mixte și limitate.¦Foarte sigură; nu strânge prea tare; dispozitivele electrice nu se folosesc cu stimulator cardiac.¦Pacientul singur
magnet¦Magnetopunctură¦tehno¦0¦1¦x¦d¦Sec. XX; popular în Rusia și Asia¦Magneți mici se aplică pe puncte cu plasture. Se atribuie un efect asupra circulației și durerii.¦Alegerea punctelor // Curățarea pielii // Aplicarea magnetului cu plasture // Păstrare 1–3 zile // Îndepărtare la iritație¦Magneți mici cu plasture¦1–3 zile per aplicare¦Puncte pe ureche, mână, picior¦Durere, relaxare (uz comercial)¦Foarte slabe; studii controlate nu arată un efect specific.¦Nu pe stimulator cardiac; poate irita pielea.¦Nu este necesar practicant; de obicei auto-aplicare
led¦Lumină colorată / cromopunctură (LED)¦tehno¦0¦1¦w¦n¦Sec. XX; influență din cromoterapie¦Lumină LED sau laser colorată pe puncte, cu ipoteza că lungimi de undă diferite au efecte diferite.¦Alegerea punctelor // Sonda LED la 0–2 cm de piele // Iradiere 30–120 s // Schimbarea culorii după indicație // Igiena sondei¦Dispozitiv LED cu sondă¦Câteva minute/ședință¦Puncte de acupunctură¦Relaxare, durere ușoară (uz comercial)¦Foarte slabe.¦Protecția ochilor; fără fotosensibilizare.¦Practicieni cu dispozitiv
shock¦Ultrasunete și unde de șoc pe puncte (ESWT)¦tehno¦0¦2¦l¦n¦Medicina modernă; aplicată pe puncte de acupunctură în ultimele două decenii¦Unde acustice sau mecanice focalizate pe puncte sau pe zone de tendon pentru stimulare mecanică profundă. Ultrasunetele pot fi aplicate pe puncte ca alternativă fără ace.¦Evaluare clinică // Aplicare de gel // Parcurgerea punctului cu aplicatorul // Intensitate adaptată // 5–10 min // Curățare¦Aparat ESWT/ultrasunete terapeutic¦1/săptămână, 3–5 ședințe¦Tendoane, puncte trigger, puncte locale¦Tendinopatii, talalgie, dureri musculare¦Variabile: folosit pentru tendinopatii cronice (ex. fasciopatie plantară, tendinopatie achileană) după eșecul altor măsuri; pe puncte de acupunctură dovezi foarte limitate.¦Contraindicat sau cu precauție: sarcină, stimulator cardiac, tratament anticoagulant, antecedente de cancer, injecție recentă cu steroizi în zonă, tumori, tromboză locală; posibile durere, învinețire, rar leziuni de țesut moale.¦Fizioterapeuți, medici

aur¦Auriculoterapie (ureche)¦micro¦1¦2¦l¦p¦Tradițional: urechea apare în textele medicale chineze vechi; sistemul modern: Paul Nogier (Lyon, observații din 1950, hartă a „fătului inversat” 1956–57); nomenclatura auriculară standardizată internațional în 1990¦Pavilionul urechii este considerat un microsistem care reflectă corpul (silueta unui făt inversat, cu capul la lob). Se stimulează puncte cu ace mici, semințe (Vaccaria), magneți, laser sau electro.¦Inspecția urechii și identificarea zonelor sensibile // Dezinfecția urechii // Alegerea a 3–6 puncte (Shenmen, simpatic, organ, punct Zero etc.) // Aplicarea semințelor cu plasture sau a acelor mici // Pacientul apasă 20–30 s de 3–4 ori pe zi // Scoatere după 3–7 zile sau la iritație¦Semințe Vaccaria, ace mici, pensetă, plasturi, sondă de detecție¦Cure de 5–10 ședințe, aplicare 3–7 zile¦Shenmen, Simpatic, Punctul Zero, Rinichi, Ficat, Plămân, Stomac¦Durere acută, anxietate, insomnie, dependențe (adjuvant)¦Limitate–moderate pentru durere acută; calitatea variază și hărțile diferă între școli.¦Risc de infecții ale cartilajului (pericondrită) la ace; piele iritată; nu în infecții ale urechii.¦Medici și acupuncturiști formați; semințe cu auto-apăsare

  const sh=(a,b,rr)=>{const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d;return[a[0]+ux*rr,a[1]+uy*rr,b[0]-ux*rr,b[1]-uy*rr]};
  let s='';
  for(let i=0;i<5;i++){const l=sh(pos[i],pos[(i+2)%5],27);s+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ak)"/>`}
  for(let i=0;i<5;i++){const l=sh(pos[i],pos[(i+1)%5],27);s+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#ah)"/>`}
  for(let i=0;i<5;i++){const sel=i===selEl.i;s+=`<g class="elp" onclick="selectEl(${i})"><circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="${sel?27:23}" fill="${EL[i].c}" stroke="${sel?'#fff':'none'}" stroke-width="3"/><text x="${pos[i][0]}" y="${pos[i][1]+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${EL[i].n}</text></g>`}
  return s;
}

const SES={on:false,pts:[],i:0,sec:60,left:60,paused:false,timer:null,beep:true,title:''};
let AC=null;
function beep(f){if(!SES.beep)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||660;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();setTimeout(()=>o.stop(),180)}catch(e){}}
function startSes(i){
  const pr=PROT[i];SES.title=pr.t;SES.pts=pr.p.map(c=>PT.find(x=>x.c===c)).filter(Boolean);SES.i=0;SES.left=SES.sec;SES.on=true;SES.paused=false;
  clearInterval(SES.timer);SES.timer=setInterval(tick,1000);beep(880);drawSes();
}
function tick(){
  if(SES.paused)return;SES.left--;
  if(SES.left<=0){beep(660);if(SES.i<SES.pts.length-1){SES.i++;SES.left=SES.sec}else{endSes(true);return}}
  drawSes();
}
function endSes(done){clearInterval(SES.timer);SES.on=false;if(done){$('#modal').innerHTML=`<div class="modal"><div class="box"><h2>✔ Sesiune încheiată</h2><p>Stai încă 1–2 minute, respiră lent. Bea apă dacă dorești.</p><button class="b" onclick="$('#modal').innerHTML=''">OK</button></div></div>`;beep(990)}else $('#modal').innerHTML=''}
function sesNext(d){SES.i=Math.max(0,Math.min(SES.pts.length-1,SES.i+d));SES.left=SES.sec;drawSes()}
function sesPause(){SES.paused=!SES.paused;drawSes()}
function sesTime(v){SES.sec=+v;SES.left=SES.sec;drawSes()}
function drawSes(){
  if(!SES.on)return;const p=SES.pts[SES.i];
  $('#modal').innerHTML=`<div class="modal"><div class="box">
   <p class="mut">${esc(SES.title)} · ${SES.i+1}/${SES.pts.length}</p>
   <h2 style="margin:.2rem 0"><span class="badge" style="background:${MCOL[p.m]}">${esc(p.c)}</span>${esc(p.p)}</h2>
   <p style="margin:.3rem 0"><b>Localizare:</b> ${esc(p.l)}</p>
   ${p.w?`<p class="w" style="color:var(--acc2)">${esc(p.w)}</p>`:''}
   <div class="breath">${SES.left}</div>
   <p class="mut">Presiune fermă dar confortabilă · inspiră 4 s · expiră 6 s · ambele părți unde e cazul</p>
   <div class="bar" style="justify-content:center">
    <button class="b alt" onclick="sesNext(-1)" ${SES.i===0?'disabled':''}>◀</button>
    <button class="b" onclick="sesPause()">${SES.paused?'▶':'❚❚'}</button>
    <button class="b alt" onclick="sesNext(1)" ${SES.i===SES.pts.length-1?'disabled':''}>▶</button>
    <button class="b alt" onclick="endSes(false)">✕</button></div>
   <div class="bar" style="justify-content:center"><select onchange="sesTime(this.value)">${[30,45,60,90,120].map(s=>`<option value="${s}" ${SES.sec===s?'selected':''}>${s} s / punct</option>`).join('')}</select>
   <label class="mut" style="align-self:center"><input type="checkbox" ${SES.beep?'checked':''} onchange="SES.beep=this.checked"> sunet</label></div>
  </div></div>`;
}

const QZ={q:[],i:0,sc:0,ans:false};
function sh(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function genQ(){
  const out=[];
  for(const q of sh(QM).slice(0,6))out.push({t:q[0],a:q[1],o:sh([q[1],...q[2]])});
  for(let k=0;k<2;k++){const p=sh(PT.filter(x=>x.p&&x.c!=='EX'))[0];const w=sh(PT.filter(x=>x.p!==p.p)).slice(0,3).map(x=>x.p);out.push({t:`Care este numele pinyin al punctului ${p.c}?`,a:p.p,o:sh([p.p,...w])})}
  for(let k=0;k<1;k++){const m=sh(MER.filter(x=>x.t!=='—'))[0];const w=sh(MER.filter(x=>x.t!=='—'&&x.t!==m.t)).slice(0,3).map(x=>x.t);out.push({t:`În ce interval orar este maximul meridianului ${m.n}?`,a:m.t,o:sh([m.t,...w])})}
  for(let k=0;k<1;k++){const m=sh(MER.filter(x=>x.el!=='Extra'))[0];const w=['Lemn','Foc','Pământ','Metal','Apă'].filter(x=>x!==m.el);out.push({t:`Cărui element aparține meridianul ${m.n}?`,a:m.el,o:sh([m.el,...sh(w).slice(0,3)])})}
  return sh(out);
}
function vQuiz(){
  if(!QZ.q.length){QZ.q=genQ();QZ.i=0;QZ.sc=0;QZ.ans=false}
  if(QZ.i>=QZ.q.length){
    if(QZ.sc>S.best){S.best=QZ.sc;save()}
    return `<h1>Quiz</h1><div class="card"><h2>Rezultat: ${QZ.sc} / ${QZ.q.length}</h2><p>Cel mai bun scor: ${S.best}</p><button class="b" onclick="QZ.q=[];render()">Din nou</button></div>`;
  }
  const q=QZ.q[QZ.i];
  return `<h1>Quiz</h1><p class="mut">Întrebarea ${QZ.i+1} din ${QZ.q.length} · scor ${QZ.sc} · record ${S.best}</p>
  <div class="card"><h3>${esc(q.t)}</h3><div id="opts">${q.o.map((o,i)=>`<button class="opt" onclick="ansQ(${i})">${esc(o)}</button>`).join('')}</div>
  <div id="qres"></div></div>`;
}
function ansQ(i){
  if(QZ.ans)return;QZ.ans=true;const q=QZ.q[QZ.i];const btn=document.querySelectorAll('.opt');
  btn.forEach((b,j)=>{if(q.o[j]===q.a)b.classList.add('ok');else if(j===i)b.classList.add('no')});
  if(q.o[i]===q.a)QZ.sc++;
  $('#qres').innerHTML=`<button class="b" onclick="QZ.i++;QZ.ans=false;render()">${QZ.i<QZ.q.length-1?'Următoarea →':'Rezultat'}</button>`;
}
