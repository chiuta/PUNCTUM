u este? Cine a fost comparat cu cine? Câți participanți? Cât de mare a fost diferența, nu doar dacă a fost „semnificativă”? Cine a finanțat? Notează ce nu știi. Nu schimba tratamentul pe baza unui singur titlu.", "puncte": [], "variante": ["acu-cl"], "intrebari": [{"q": "Care este rolul randomizării?", "corect": "Distribuie participanții la întâmplare pentru a reduce diferențele sistematice dintre grupuri", "gresite": ["Garantează că tratamentul funcționează", "Asigură că toți pacienții primesc același tratament", "Elimină necesitatea unui grup de control"], "explicatie": "Randomizarea echilibrează, în medie, caracteristicile grupurilor, dar nu garantează eficacitatea."}, {"q": "De ce este dificilă interpretarea acupuncturii sham?", "corect": "Pentru că sham-ul poate avea și el un efect propriu, nu doar placebo", "gresite": ["Pentru că nu poate fi folosit în studii", "Pentru că este întotdeauna identic cu acupunctura reală", "Pentru că se aplică doar copiilor"], "explicatie": "Înțeparea superficială sau atingerea pielii pot stimula receptori, deci sham-ul nu este perfect inert."}, {"q": "Ce arată mărimea efectului?", "corect": "Cât de mare este diferența dintre grupuri, nu doar dacă ea este statistic semnificativă", "gresite": ["Numărul de participanți", "Dacă studiul a fost publicat", "Dacă tratamentul este tradițional"], "explicatie": "Un efect semnificativ statistic poate fi mic și irelevant clinic; mărimea efectului ajută la evaluarea importanței."}]}, {"id": "L6-2", "titlu": "Ce spun sintezele și ghidurile", "minute": 10, "text": ["Pentru a nu depinde de un singur studiu, comunitatea științifică folosește sinteze sistematice și ghiduri clinice. Nu uita: datele de mai jos sunt orientative și pot fi depășite; verifică întotdeauna ultimele versiuni.", "Hartă a dovezilor (2022): Allen și colab. au publicat în JAMA Network Open o sinteză a sintezelor, privind acupunctura pentru afecțiuni la adulți. Din multe zeci de afecțiuni, doar o parte au concluzii cu certitudine înaltă sau moderată; unele dintre acestea sunt pentru beneficiu (de exemplu migrenă, cefalee de tip tensional, durere musculoscheletală cronică, fibromialgie), iar altele sunt pentru lipsa beneficiului. Dovezile pentru superioritate față de alte tratamente active sunt rare.", "Durere cronică: sinteza lui Vickers și colab. (2018) a găsit un efect modest față de sham și mai mare față de lipsa tratamentului. Ghidurile se contrazic: American College of Physicians (2017) include acupunctura printre opțiunile nefarmacologice în lombalgie, pe baza unor dovezi de calitate scăzută, în timp ce ghidul NICE NG59 (2016) recomanda să nu se ofere acupunctura în lombalgie. O revizie a ghidurilor din 2025 (Ho și colab., BMC Complement Medicine and Therapies), privind durerea musculoscheletală cronică, a găsit 17 ghiduri și 35 de recomandări, în mare parte slabe sau condiționate, cu o minoritate împotrivă. Mesajul: nu există consens.", "Migrenă și cefalee: acupunctura este menționată în unele ghiduri ca opțiune pentru profilaxie; ghidul britanic NICE pentru cefalee (CG150) sugerează, din câte știm, considerarea unui curs de acupunctură pentru profilaxia migrenei și a cefaleei de tip tensional. Verifică versiunea curentă. În 2025 a apărut un protocol Cochrane pentru profilaxia migrenei episodice cu acupunctură; el nu are încă rezultate.", "Greață: sinteza Cochrane (Lee, Chan și Fan, 2015) pe 59 de studii și 7667 de participanți a găsit pentru stimularea PC6 în greața postoperatorie dovezi de calitate scăzută de superioritate față de sham și dovezi moderate de efect similar cu antiemeticele. O meta-analiză din 2023 (Xiao și colab., Supportive Care in Cancer) privind acupresura PC6 în greața din chimioterapie a găsit o reducere a greții, dar cu studii puține și de calitate mixtă. Poziția OMS: strategia globală pentru medicina tradițională 2025–2034 este un cadru general, nu o recomandare clinică pentru acupunctură. Concluzie prudentă: există dovezi pentru ameliorări modeste în anumite dureri și în greață, dar calitatea este adesea scăzută și ghidurile diferă."], "cheie": ["Hartă a dovezilor JAMA Netw Open 2022: puține concluzii cu certitudine înaltă; dovezi rare pentru superioritate față de tratamente active.", "Ghidurile diferă: ACP 2017 include acupunctura în lombalgie, NICE NG59 recomanda să nu fie oferită.", "Revizia din 2025 a ghidurilor pentru durere musculoscheletală: recomandări mai ales slabe sau condiționate.", "Greață: Cochrane 2015 arată dovezi de calitate scăzută până la moderată pentru PC6 în greața postoperatorie.", "Protocolul Cochrane 2025 pentru migrenă nu are încă rezultate."], "practica": "Alege o afecțiune (de exemplu lombalgia) și caută ultimul ghid clinic național sau o sinteză Cochrane. Notează: ce recomandă, cât de puternică este recomandarea, cât de sigure sunt dovezile și data. Compară cu o a doua sursă și vezi dacă se contrazic.", "puncte": ["PC6"], "variante": ["acu-cl", "acupresura", "band"], "intrebari": [{"q": "Ce arată în general harta dovezilor JAMA Netw Open 2022 despre acupunctură?", "corect": "Puține concluzii cu certitudine înaltă; dovezi rare pentru superioritate față de alte tratamente active", "gresite": ["Certitudine înaltă pentru aproape toate afecțiunile", "Lipsa totală de studii", "Superioritate clară față de toate medicamentele"], "explicatie": "Din multe afecțiuni, doar o minoritate au certitudine înaltă; majoritatea comparațiilor sunt vs. sham sau lipsa tratamentului."}, {"q": "Ce exemplu ilustrează dezacordul dintre ghiduri?", "corect": "ACP (2017) include acupunctura în lombalgie, iar NICE NG59 (2016) recomanda să nu fie oferită", "gresite": ["Toate ghidurile recomandă la fel pentru toate durerile", "Niciun ghid nu menționează acupunctura", "Ghidurile OMS interzic acupunctura"], "explicatie": "Aceleași dovezi limitate au fost interpretate diferit, ceea ce arată că decizia depinde de judecata ghidurilor."}, {"q": "Ce este protocolul Cochrane din 2025 privind migrena?", "corect": "Un plan al revizuirii, fără rezultate încă", "gresite": ["O sinteză finală care confirmă eficacitatea", "O interdicție a acupuncturii", "Un ghid oficial al OMS"], "explicatie": "Un protocol descrie metoda de lucru; nu poate fi citat ca dovadă de eficacitate."}]}, {"id": "L6-3", "titlu": "Reglementare, formare, igiena acelor, consimțământ", "minute": 9, "text": ["Când alegi un practicant, siguranța depinde mai mult de formare și igienă decât de școala de acupunctură. Regulile diferă de la țară la țară, iar în Europa nu există o reglementare armonizată a acupuncturii; unele țări o rezervă profesiilor medicale.", "În România, practicile complementare sunt vizate de Legea 118/2007. Potrivit unor surse, acupunctura este practicată de medici, medici stomatologi sau farmaciști cu competență atestată, dar normele de aplicare au fost mult timp absente, iar în 2025 instanța supremă a obligat Ministerul Sănătății să le emită. Nu putem garanta aici situația la zi: verifică legislația în vigoare și întreabă practicantul ce calificare are.", "Formare: Organizația Mondială a Sănătății a publicat în 2021 „WHO benchmarks for the training of acupuncture”, un cadru pentru nivelurile de pregătire pe categorii de furnizori. Un practicant bun poate explica studiile sale, legitimația profesională, asigurarea de răspundere și experiența cu afecțiunea ta. Întreabă dacă este medic sau dacă lucrează în echipă cu un medic.", "Igiena acelor: acele trebuie să fie sterile și de unică folosință, deschise în fața ta, și aruncate într-un container pentru obiecte ascuțite. Pielea se dezinfectează, iar mâinile se spală sau se folosesc mănuși. Infecțiile, inclusiv cele transmise prin sânge, sunt rare dacă regulile sunt respectate, dar pot fi grave. Alte riscuri rare: pneumotorax, lezarea unui nerv, leșin. Nu accepta ace reutilizate, ventuze nesterilizate sau cameră murdară.", "Consimțământ informat: practicantul trebuie să-ți spună ce urmează să facă, riscurile, alternativele, ce se știe și nu se știe despre eficacitate, costul și numărul probabil de ședințe. Ai dreptul să refuzi sau să oprești oricând. Spune ce medicamente iei (mai ales anticoagulante), dacă ești însărcinată, ai stimulator cardiac sau tulburări de coagulare. Semne de alarmă: promisiunea de vindecare, sfaturi de a opri medicamentele, preț foarte mare pentru pachete lungi, presiune de a continua, lipsa unei evaluări și a unui plan clar."], "cheie": ["În Europa nu există reglementare armonizată; în România, cadrul este Legea 118/2007, cu norme de aplicare întârziate.", "Verifică calificarea, asigurarea de răspundere și colaborarea cu medicul.", "Ace sterile, de unică folosință, deschise în fața ta, într-un container pentru ascuțite.", "Consimțământul informat include riscuri, alternative, limite ale dovezilor și dreptul de a opri.", "Semne de alarmă: promisiuni de vindecare, sfaturi de a opri tratamentul medical, presiune comercială."], "practica": "Fă-ți o listă de verificare înainte de prima ședință: calificarea practicantului, igiena (ace sterile și unică folosință), riscuri și costuri explicate, ce medicamente trebuie să raportezi. Pune cel puțin trei întrebări la telefon sau prin mesaj și notează răspunsurile.", "puncte": [], "variante": ["acu-cl", "dry"], "intrebari": [{"q": "Ce caracteristici au acele folosite în siguranță?", "corect": "Sterile, de unică folosință, deschise în fața pacientului", "gresite": ["Reutilizabile după clătire cu apă", "Dezinfectate cu alcool între pacienți", "Păstrate într-un recipient comun"], "explicatie": "Acele de unică folosință elimină riscul de transmitere încrucișată; refolosirea este inacceptabilă."}, {"q": "Ce trebuie să cuprindă consimțământul informat?", "corect": "Ce se face, riscurile, alternativele, limitele dovezilor și dreptul de a refuza sau opri", "gresite": ["Doar semnătura pe o foaie cu tarife", "Garanția unui rezultat", "Interdicția de a pune întrebări"], "explicatie": "Consimțământul informat înseamnă înțelegere reală, nu o formalitate."}, {"q": "Care este un semn de alarmă la un practicant?", "corect": "Promite vindecare și te sfătuiește să oprești medicamentele", "gresite": ["Explică riscurile", "Îți cere lista medicamentelor", "Folosește ace sterile"], "explicatie": "Promisiunile de vindecare și sfaturile de a opri tratamentul indică practică iresponsabilă."}]}, {"id": "L6-4", "titlu": "Semne de pseudoștiință: EAV, kinesiologie, promisiuni de vindecare", "minute": 9, "text": ["Nu tot ce se leagă de puncte este la fel de bine fundamentat. Acupunctura clasică are studii, cu rezultate mixte; alte practici au aspect științific, dar lipsesc dovezile. A recunoaște diferența este o competență.", "EAV (electroacupunctura după Voll) și bioresonanța pretind că măsoară conductanța electrică a pielii în puncte și că pot depista alergii, infecții sau dezechilibre ale organelor. Studiile controlate nu au arătat că aceste măsurători distinge fiabil persoanele cu și fără alergii sau alte afecțiuni; aparatul dă valori care se pot influența prin presiunea electrodului și umiditatea pielii. Dispozitivele acestea pot duce la diagnostice false sau la cheltuieli inutile. Ryodoraku, o metodă japoneză de măsurare a conductanței, ridică întrebări similare despre fiabilitate.", "Kinesiologia aplicată (testul muscular) susține că slăbiciunea unui mușchi arată o alergie sau un deficit. Testele în studii cu dublu orb nu au confirmat acuratețea metodei: rezultatul depinde de așteptările examinatorului, nu de substanța testată.", "Semne generale de pseudoștiință: promisiuni de vindecare pentru boli multiple (cancer, autism, diabet); un singur mecanism pentru toate bolile; limbaj tehnic vag („frecvențe”, „energii cuantice”); dovezi doar prin mărturii; teorii care nu pot fi infirmate; suspiciune față de medicina oficială; aparate scumpe cu rezultate spectaculoase; presiunea să cumperi produse suplimentare.", "Cum rămâi sceptic dar deschis: pune două întrebări. Ce s-ar putea întâmpla dacă ar fi greșit? Ce observație ar schimba părerea mea? Pentru o terapie nouă, cere un studiu randomizat, controlat, publicat și replicat. Acceptă că unele practici tradiționale pot aduce confort chiar dacă teoria lor nu este validată. Evită ironia față de oameni; criticile vizează afirmațiile, nu pe cei care le caută ajutor. Reținere: nu confunda „nu s-a demonstrat” cu „s-a demonstrat că nu funcționează”. Mențiunile din lecțiile precedente (de exemplu PC6 pentru greață) arată cum arată o poziție nuanțată: dovezi limitate, dar suficiente pentru o încercare prudentă, fără promisiuni."], "cheie": ["EAV și bioresonanța nu au fost validate ca metode de diagnostic.", "Kinesiologia aplicată nu a trecut testele în dublu orb.", "Semne de alarmă: vindecare pentru multe boli, jargon vag, mărturii în loc de studii, aparate scumpe.", "„Nu s-a demonstrat” nu este același lucru cu „s-a demonstrat că nu funcționează”.", "Scepticismul sănătos cere dovezi, rămâne deschis la date noi și respectă oamenii."], "practica": "Alege o reclamă la un aparat sau o terapie și bifează semnele de alarmă: promite vindecare pentru boli diferite? Se bazează pe mărturii? Are studii randomizate publicate? Notează ce ai verifica. Nu cumpăra și nu opri un tratament pe baza reclamei.", "puncte": [], "variante": ["eav", "kin", "ryo"], "intrebari": [{"q": "Ce pretinde EAV (electroacupunctura după Voll)?", "corect": "Că măsurarea conductanței pielii în puncte poate depista afecțiuni ale organelor", "gresite": ["Că ace sterile tratează toate bolile", "Că presiunea manuală înlocuiește medicamentele", "Că ventuzele detectează alergii"], "explicatie": "Studiile controlate nu au arătat că aceste măsurători sunt fiabile ca diagnostic."}, {"q": "Ce au arătat testele în dublu orb ale kinesiologiei aplicate?", "corect": "Metoda nu a depășit întâmplarea, iar rezultatul depindea de așteptările examinatorului", "gresite": ["O acuratețe de peste 90%", "Detectează fiabil orice alergie", "Este mai exactă decât analizele de sânge"], "explicatie": "Fără știința examinatorului despre substanță, testul muscular nu a distins corect."}, {"q": "Care este o atitudine sceptică, dar deschisă?", "corect": "Ceri dovezi bune și rămâi dispus să-ți schimbi părerea dacă apar date noi", "gresite": ["Respingi orice terapie tradițională fără să o analizezi", "Accepți orice cu mărturii convingătoare", "Consideri că „nu s-a demonstrat” înseamnă „s-a demonstrat că nu funcționează”"], "explicatie": "Scepticismul sănătos nu respinge din reflex și nu acceptă fără dovezi; ține cont de nivelul datelor."}]}]}];

function crShuffle(arr,seed){const a=arr.slice();let s=seed||1;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function vCourse(){
  if(!COURSE.length)return `<h1>${esc(cu('title'))}</h1>${disc()}<p class="mut">${esc(cu('empty'))}</p>`;
  if(CR.lvl&&CR.les){const lv=COURSE.find(x=>x.id===CR.lvl);const le=lv&&(lv.lectii||[]).find(x=>x.id===CR.les);if(le)return crLesson(lv,le)}
  if(CR.lvl){const lv=COURSE.find(x=>x.id===CR.lvl);if(lv)return crLevel(lv)}
  const all=allLessons();const dn=all.filter(x=>cst().done[x.le.id]).length;const pct=all.length?Math.round(100*dn/all.length):0;
  return `<h1>${esc(cu('title'))}</h1>${disc()}<p>${esc(cu('intro'))}</p>
  <div class="card"><b>${esc(cu('overall'))}:</b> ${dn} / ${all.length} (${pct}%)${crBar(pct)}</div>
  <div class="grid" style="margin-top:.8rem">${COURSE.map((l,i)=>{const p=lvlProg(l);return `<div class="card"><h3>${i+1}. ${esc(l.titlu)}</h3><p class="mut">${esc(l.descriere||'')}</p><p class="mut">${p.n} ${esc(cu('lessons'))} · ${p.d} ${esc(cu('done'))}</p>${crBar(p.p)}<p><button class="b" onclick="CR.lvl='${esc(l.id)}';CR.les=null;render();window.scrollTo(0,0)">${p.d?(p.d>=p.n?esc(cu('review')):esc(cu('cont'))):esc(cu('start'))}</button></p></div>`}).join('')}</div>
  <p><button class="b alt" onclick="if(confirm(cu('confirmReset'))){S.course={done:{},ans:{}};save();render()}">${esc(cu('reset'))}</button></p>`;
}
function crLevel(lv){
  const p=lvlProg(lv);
  return `<h1>${esc(lv.titlu)}</h1><p><button class="b alt" onclick="CR.lvl=null;CR.les=null;render()">${esc(cu('back'))}</button></p>
  <p class="mut">${esc(lv.descriere||'')}</p><div class="card">${esc(cu('prog'))}: ${p.d} / ${p.n}${crBar(p.p)}</div>
  ${(lv.lectii||[]).map((x,i)=>`<div class="card" style="margin:.5rem 0"><h3>${i+1}. ${esc(x.titlu)} ${cst().done[x.id]?'<span class="badge" style="background:#2f7d6d">✓</span>':''}</h3><p class="mut">${x.minute||5} ${esc(cu('min'))}</p><button class="b" onclick="CR.les='${esc(x.id)}';render();window.scrollTo(0,0)">${cst().done[x.id]?esc(cu('review')):esc(cu('start'))}</button></div>`).join('')}`;
}
function crLesson(lv,le){
  const list=lv.lectii||[];const i=list.findIndex(x=>x.id===le.id);const done=!!cst().done[le.id];
  const pts=(le.puncte||[]).filter(c=>PT.some(p=>p.c===c));const vs=(le.variante||[]).map(id=>VAR.find(v=>v.id===id)).filter(Boolean);
  return `<h1>${esc(le.titlu)}</h1>
  <p><button class="b alt" onclick="CR.les=null;render()">${esc(cu('backLvl'))}</button> <span class="mut">${esc(lv.titlu)} · ${i+1}/${list.length} · ${le.minute||5} ${esc(cu('min'))}</span></p>
  <div class="card">${(le.text||[]).map(t=>`<p>${esc(t)}</p>`).join('')}</div>
  ${(le.cheie||[]).length?`<h2>${esc(cu('key'))}</h2><ul>${le.cheie.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
  ${le.practica?`<div class="warn" style="background:var(--soft);border-color:var(--acc)"><b>${esc(cu('practice'))}:</b> ${esc(le.practica)}</div>`:''}
  ${pts.length?`<p><b>${esc(cu('points'))}:</b> ${pts.map(c=>`<span class="tag">${ptLink(c)}</span>`).join('')}</p>`:''}
  ${vs.length?`<p><b>${esc(cu('vars'))}:</b> ${vs.map(v=>`<span class="tag"><a href="#tech" onclick="goVar('${esc(v.id)}');return false">${esc(v.n)}</a></span>`).join('')}</p>`:''}
  ${(le.intrebari||[]).length?`<h2>${esc(cu('check'))}</h2>${le.intrebari.map((q,qi)=>crQuestion(le,q,qi)).join('')}`:''}
  <p>${done?`<button class="b alt" onclick="cst().done['${esc(le.id)}']=false;save();render()">${esc(cu('undo'))}</button>`:`<button class="b" onclick="cst().done['${esc(le.id)}']=true;save();render()">${esc(cu('markDone'))}</button>`}</p>
  <div class="bar">${i>0?`<button class="b alt" onclick="CR.les='${esc(list[i-1].id)}';render();window.scrollTo(0,0)">${esc(cu('prev'))}</button>`:''}${i<list.length-1?`<button class="b" onclick="CR.les='${esc(list[i+1].id)}';render();window.scrollTo(0,0)">${esc(cu('next'))}</button>`:''}</div>`;
}
function crQuestion(le,q,qi){
  const key=le.id+':'+qi;const a=cst().ans[key];
  const opts=crShuffle([q.corect,...(q.gresite||[])],qi*7+le.id.length*13+3);
  return `<div class="card" style="margin:.5rem 0"><p><b>${esc(q.q)}</b></p>${opts.map(o=>{let c='';if(a!==undefined){if(o===q.corect)c=' ok';else if(a===o)c=' no'}return `<button class="opt${c}" ${a!==undefined?'disabled':''} onclick="crAnswer('${esc(key)}',${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`}).join('')}
  ${a!==undefined?`<p class="mut"><b>${a===q.corect?esc(cu('correct')):esc(cu('wrong'))}.</b> ${esc(q.explicatie||'')}</p>`:''}</div>`;
}
function crAnswer(key,o){cst().ans[key]=o;save();render()}

}

function vProgress(){
  const s=sst();const keys=Object.keys(s.by);
  if(!s.n)return `<p class="mut">${esc(su('noStats'))}</p>`;
  const rows=keys.map(k=>({k,ok:s.by[k][0],n:s.by[k][1],p:Math.round(100*s.by[k][0]/s.by[k][1])})).sort((a,b)=>a.p-b.p);
  return `<div class="card"><b>${s.ok} / ${s.n}</b> ${esc(su('answered'))} · ${esc(su('acc'))} ${Math.round(100*s.ok/s.n)}%</div>
  <h3>${esc(su('weak'))}</h3><div class="tw"><table>${rows.map(r=>`<tr><td>${esc(suc(r.k))}</td><td style="width:50%"><div style="height:8px;border-radius:6px;background:var(--soft);overflow:hidden"><div style="height:100%;width:${r.p}%;background:${r.p<60?'var(--acc2)':'var(--acc)'}"></div></div></td><td>${r.p}% (${r.ok}/${r.n})</td></tr>`).join('')}</table></div>
  <p><button class="b alt" onclick="if(confirm(su('confirmReset'))){S.study={by:{},fc:{},n:0,ok:0};save();SQ.fc.built=null;render()}">${esc(su('resetStats'))}</button></p>`;
}
function vStudy(){
  const tab=SQ.tab;
  const tabs=`<div class="bar"><button class="b ${tab==='quiz'?'':'alt'}" onclick="SQ.tab='quiz';render()">${esc(su('tabQuiz'))}</button><button class="b ${tab==='cards'?'':'alt'}" onclick="SQ.tab='cards';SQ.fc.built=null;render()">${esc(su('tabCards'))}</button><button class="b ${tab==='prog'?'':'alt'}" onclick="SQ.tab='prog';render()">${esc(su('tabProg'))}</button></div>`;
  let body='';
  if(tab==='cards')body=vCards();
  else if(tab==='prog')body=vProgress();
  else if(SQ.run)body=vQuizRun();
  else{
    const cats=[...new Set(qPool().map(x=>x.cat))];
    body=`<p class="mut">${qPool().length} ${esc(su('bank'))}</p>
    <div class="card"><div class="bar">
     <label class="mut">${esc(su('cat'))}: <select onchange="SQ.cat=this.value">${'<option value="">'+esc(su('all'))+'</option>'+cats.map(c=>`<option value="${esc(c)}" ${SQ.cat===c?'selected':''}>${esc(suc(c))}</option>`).join('')}</select></label>
     <label class="mut">${esc(su('lvl'))}: <select onchange="SQ.lvl=+this.value"><option value="0">${esc(su('anyLvl'))}</option>${[1,2,3].map(l=>`<option value="${l}" ${SQ.lvl===l?'selected':''}>${l}</option>`).join('')}</select></label>
     <label class="mut">${esc(su('n'))}: <select onchange="SQ.n=this.value">${[10,20,30,'all'].map(n=>`<option value="${n}" ${String(SQ.n)===String(n)?'selected':''}>${n==='all'?esc(su('all')):n}</option>`).join('')}</select></label>
     <label class="mut">${esc(su('mode'))}: <select onchange="SQ.mode=this.value"><option value="practice" ${SQ.mode==='practice'?'selected':''}>${esc(su('practice'))}</option><option value="exam" ${SQ.mode==='exam'?'selected':''}>${esc(su('exam'))}</option></select></label>
    </div><button class="b" onclick="qBegin()">${esc(su('start'))}</button> <span class="mut">${esc(su('best'))}: ${S.best||0}</span></div>`;
  }
  return `<h1>${esc(su('title'))}</h1>${tabs}${body}`;
}
regView('quiz',vStudy,{},{nonav:true});

/* ================= traducere la rulare a textului afișat (sursă: română) ================= */
const I18N_CACHE={};
function i18nDict(l){
  if(l==='ro')return null;if(I18N_CACHE[l])return I18N_CACHE[l];
  const el=document.getElementById('i18n-'+l);if(!el)return null;
  try{I18N_CACHE[l]=JSON.parse(el.textContent)}catch(e){I18N_CACHE[l]={}}
  return I18N_CACHE[l];
}
const trNorm=s=>s.replace(/\s+/g,' ').trim();
function trNode(root){
  const d=i18nDict(S.lang);if(!d||!root)return;
  if(root.nodeType===3){trText(root,d);return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const t=n.parentNode&&n.parentNode.nodeName;return(t==='SCRIPT'||t==='STYLE')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  const list=[];while(w.nextNode())list.push(w.currentNode);list.forEach(n=>trText(n,d));
  const attrs=['placeholder','title','aria-label','alt'];
  const els=[root,...root.querySelectorAll('[placeholder],[title],[aria-label],[alt]')];
  els.forEach(e=>attrs.forEach(a=>{if(e.getAttribute&&e.hasAttribute(a)){const v=e.getAttribute(a);const t=d[trNorm(v)];if(t&&t!==v)e.setAttribute(a,t)}}));
}
function trText(n,d){
  const raw=n.data;const k=trNorm(raw);if(!k)return;const t=d[k];
  if(t!==undefined&&t!==k)n.data=raw.match(/^\s*/)[0]+t+raw.match(/\s*$/)[0];
}
function trWatch(){
  if(window.__trObs)return;
  const obs=new MutationObserver(ms=>{if(S.lang==='ro')return;ms.forEach(m=>m.addedNodes.forEach(n=>trNode(n)))});
  obs.observe(document.body,{childList:true,subtree:true});window.__trObs=obs;
}
function trAll(){trNode(document.body)}
