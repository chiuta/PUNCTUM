i spatele corpului; Yin cu odihna, răcoarea, interiorul, partea inferioară și fața. Niciunul nu există fără celălalt, iar sănătatea este văzută ca echilibru dinamic, nu ca un punct fix. Este un limbaj de relații, folosit pentru a descrie tipare: un om „cu frig” și oboseală se descrie diferit de unul „cu căldură” și agitație.", "Substanțele fundamentale sunt, în afară de Qi: Xue (sânge, înțeles și funcțional, nu doar hematologic), Jin Ye (lichidele corpului), Jing (esența, legată de dezvoltare și reproducere) și Shen (spiritul, legat de conștiință și viață mentală). Ele se influențează reciproc: se spune, de pildă, că „Qi-ul conduce sângele”. Sunt categorii pentru a gândi corpul ca sistem de procese, nu liste de produse biochimice.", "Ce spune știința modernă? Nu există dovezi că Qi-ul sau meridianele ar fi structuri anatomice identificate. Unele ipoteze propun explicații parțiale pentru efectele acupuncturii: eliberarea de endorfine și alte substanțe implicate în controlul durerii, modularea semnalelor nervoase în măduva spinării și creier, influențe asupra țesutului conjunctiv local, reacții ale sistemului nervos vegetativ. Sunt ipoteze în cercetare, nu concluzii închise.", "O abordare matură ține ambele planuri deschise. Cadrul tradițional rămâne un limbaj coerent, util pentru a înțelege cursul și cum gândesc practicienii. Explicațiile moderne ne spun ce se poate susține astăzi. Pentru tine, ca cursant, regula practică este simplă: folosește conceptele ca hartă conceptuală, nu ca diagnostic medical."], "cheie": ["Qi este un concept explicativ tradițional, nu o entitate măsurată de fizică sau biologie.", "Yin–Yang descrie relații complementare și tipare, nu două substanțe.", "Substanțele fundamentale sunt Qi, Xue, Jin Ye, Jing și Shen.", "Meridianele și Qi-ul nu sunt structuri anatomice identificate; explicațiile moderne invocă mecanisme nervoase și neurochimice.", "Folosește MTC ca limbaj și hartă, nu ca diagnostic."], "practica": "Alege o zi obișnuită și descrie-o în două coloane: „limbaj MTC” (de exemplu, „energie Yang scăzută seara”) și „limbaj obișnuit” („sunt obosit după masă”). Observă cum se traduc reciproc cele două. Este un exercițiu de gândire, nu de autodiagnostic.", "puncte": [], "variante": ["mtc", "qigong", "5el"], "intrebari": [{"q": "Cum este corect să descriem Qi-ul într-un curs introductiv?", "corect": "Ca un concept explicativ al MTC, nu ca o substanță demonstrată științific.", "gresite": ["Ca un tip de electricitate măsurată în nervi.", "Ca un fluid demonstrat anatomic în vase speciale.", "Ca un alt nume pentru sânge."], "explicatie": "Qi este o categorie a modelului tradițional. Nu a fost identificat ca entitate fizică distinctă."}, {"q": "Ce descrie în esență perechea Yin–Yang?", "corect": "Relații complementare și tipare dinamice de echilibru.", "gresite": ["Două organe care trebuie tratate separat.", "Doar diferența dintre zi și noapte.", "Un diagnostic de laborator."], "explicatie": "Yin–Yang este un limbaj al relațiilor: activitate și odihnă, cald și rece, exterior și interior, într-un echilibru dinamic."}, {"q": "Ce explicații moderne se propun, cu prudență, pentru unele efecte ale acupuncturii?", "corect": "Modularea semnalelor nervoase ale durerii și eliberarea de substanțe precum endorfinele.", "gresite": ["Deblocarea unor canale anatomice vizibile la disecție.", "Eliminarea toxinelor prin ace.", "Schimbarea grupei sanguine."], "explicatie": "Ipotezele moderne se referă la nervi, creier și neurochimie, și sunt încă în cercetare. Nu s-au găsit canale anatomice distincte."}]}, {"id": "L1-4", "titlu": "Siguranță, etică și limitele autotratamentului", "minute": 9, "text": ["Prima regulă a oricărei practici de sănătate este să nu faci rău. Acupunctura cu ace trebuie făcută numai de persoane calificate, cu ace sterile de unică folosință. Riscurile serioase sunt rare, dar reale: infecții, leziuni de nervi sau vase, pneumotorax la înțepături incorecte pe torace sau spate, leșin. Din acest motiv, în acest curs nu înveți să folosești ace și nu ți se cere să încerci nimic de acest fel acasă.", "Acupresura și majoritatea tehnicilor ușoare sunt mai sigure, dar nu sunt lipsite de precauții. Presiunea excesivă poate produce vânătăi sau durere, mai ales la persoane care iau anticoagulante sau au tulburări de coagulare. Pielea lezată, inflamată, cu erupții sau cu infecție nu se masează. Anumite puncte sunt evitate în sarcină de tradiție (de exemplu LI4 și SP6), iar în caz de sarcină se cere sfatul medicului. Căldura (moxa) are riscul suplimentar de arsuri și de fum iritant.", "Limita cea mai importantă este diagnosticul. Autotratamentul cu puncte poate calma un disconfort, dar nu înlocuiește evaluarea medicală. Un simptom nou, intens sau persistent poate fi semnul unei probleme care cere tratament specific. Nu amâna consultul din cauza unei metode „naturale” și nu renunța la tratamentul prescris fără acordul medicului.", "Mergi urgent la medic (sau sună la 112) pentru: durere în piept sau dificultăți de respirație, slăbiciune bruscă a unei părți a corpului, cefalee violentă, „cea mai gravă din viața ta”, febră mare cu redoare a ceafei, sângerări neexplicate, scădere în greutate fără motiv, durere abdominală severă, simptome în sarcină sau la copii mici. Menționează întotdeauna medicului ce metode complementare folosești.", "Etica se aplică și celui care predă sau recomandă: fără promisiuni de vindecare, fără a ridica așteptări nerealiste, cu spunerea clară a ce este susținut de dovezi și ce nu. Atenție la mesajele care promit leacuri pentru boli grave. Un practicant responsabil explică limitele, respectă decizia pacientului și îl îndrumă către medic atunci când este nevoie."], "cheie": ["Acele se folosesc numai de personal calificat, cu material steril de unică folosință.", "Acupresura este mai sigură, dar are precauții: anticoagulante, piele lezată, sarcină.", "Autotratamentul nu înlocuiește diagnosticul medical.", "Semnele de alarmă (durere în piept, deficit neurologic brusc, febră cu redoare de ceafă etc.) cer ajutor medical imediat.", "Etic înseamnă să nu promiți vindecări și să spui deschis ce este și ce nu este susținut de dovezi."], "practica": "Scrie o „fișă de siguranță personală” de o jumătate de pagină: ce medicamente iei, ce afecțiuni ai, cui ai cere sfatul medical și ce simptome ar fi pentru tine motiv de consult urgent. Păstrează-o la îndemână. Nu include nicio tehnică de tratament în acest exercițiu.", "puncte": [], "variante": ["acupresura", "acu-cl"], "intrebari": [{"q": "Care este atitudinea corectă față de acele de acupunctură în acest curs?", "corect": "Se folosesc doar de personal calificat; cursantul nu le încearcă acasă.", "gresite": ["Pot fi folosite acasă, dacă sunt sterilizate cu alcool.", "Sunt la fel de sigure ca acupresura în orice situație.", "Se pot refolosi dacă sunt spălate."], "explicatie": "Riscurile (infecții, leziuni, pneumotorax) cer pregătire și material steril de unică folosință."}, {"q": "Când este mai potrivit să mergi la medic decât să încerci autotratament?", "corect": "La simptome noi, intense, persistente sau la semne de alarmă precum durerea în piept.", "gresite": ["Doar dacă metoda complementară nu a funcționat o lună.", "Niciodată, dacă simptomele par trecătoare.", "Doar dacă ți-o cere un prieten."], "explicatie": "Semnele de alarmă nu trebuie amânate. Metodele complementare nu înlocuiesc evaluarea medicală."}, {"q": "Ce face un practicant responsabil în privința promisiunilor?", "corect": "Evită promisiunile de vindecare și explică ce este și ce nu este susținut de dovezi.", "gresite": ["Promite rezultate rapide pentru a motiva pacientul.", "Cere pacientului să oprească medicația.", "Evită să discute despre limite."], "explicatie": "Etica profesională cere transparență, respectarea deciziei pacientului și îndrumare către medic la nevoie."}]}]}, {"id": "L2", "titlu": "Teoria MTC", "descriere": "Principalele cadre de gândire ale medicinei tradiționale chineze: cele cinci elemente, organele Zang-Fu, cauzele bolii, cele opt principii și diagnosticul. Vei învăța să le citești ca limbaj, cu limitele lor.", "lectii": [{"id": "L2-1", "titlu": "Cele cinci elemente și ciclurile Sheng și Ke", "minute": 9, "text": ["Teoria celor cinci elemente (Wu Xing) descrie cinci categorii dinamice: Lemn, Foc, Pământ, Metal și Apă. Cuvântul „element” induce ușor în eroare: în chineză, xing înseamnă mai degrabă „mișcare” sau „fază”. Fiecare element desemnează un tipar de transformare, nu o substanță fizică. Lemnul se asociază cu creșterea și expansiunea, Focul cu maximul de activitate, Pământul cu transformarea și echilibrul, Metalul cu contracția și clarificarea, Apa cu repausul și conservarea.", "Tradiția leagă fiecare element de un set de corespondențe: organe (Zang-Fu), anotimpuri, culori, gusturi, emoții, țesuturi. De exemplu, Lemnul se asociază cu Ficatul și Vezica biliară, primăvara, culoarea verde și iritabilitatea; Apa cu Rinichiul și Vezica urinară, iarna și teama. Aceste corespondențe sunt un sistem de analogii, util ca mijloc de memorare și de orientare conceptuală. Nu sunt legi demonstrate ale fiziologiei.", "Ciclul Sheng (generare, „mamă–copil”) spune că Lemnul alimentează Focul, Focul produce Pământul (cenușa), Pământul poartă Metalul (minereul), Metalul condensează Apa, iar Apa hrănește Lemnul. Ciclul Ke (control) spune că Lemnul controlează Pământul, Pământul controlează Apa, Apa controlează Focul, Focul controlează Metalul, iar Metalul controlează Lemnul. Cele două cicluri formează o rețea de reglaj: fiecare element este susținut de unul și temperat de altul.", "Când ciclurile se dezechilibrează, tradiția descrie relații patologice: supra-acțiune (un element îl copleșește pe cel controlat) sau contra-acțiune (controlul se întoarce). Un exemplu didactic: stresul emoțional, asociat cu „Lemnul”, ar „agresa” digestia, asociată cu „Pământul”. Este o metaforă clinică plauzibilă ca limbaj, deși dovezile moderne nu susțin ciclurile ca mecanisme biologice.", "În practică, unele școli folosesc cele cinci elemente intens (de exemplu, în acupunctura stilului „cinci elemente”), altele le folosesc doar ca fundal. Pentru tine, ele sunt un instrument de gândire: te ajută să vezi relații, nu să formulezi diagnostice."], "cheie": ["Wu Xing înseamnă „cinci faze/mișcări”, nu cinci substanțe.", "Corespondențele (organe, anotimpuri, emoții) sunt un sistem de analogii tradițional.", "Ciclul Sheng generează: Lemn–Foc–Pământ–Metal–Apă–Lemn.", "Ciclul Ke controlează: Lemn–Pământ–Apă–Foc–Metal–Lemn.", "Dovezile moderne nu susțin ciclurile ca mecanisme biologice; au valoare ca limbaj conceptual."], "practica": "Desenează un pentagon cu cele cinci elemente. Trasează cu un creion de culoare albastră ciclul Sheng (pe circumferință) și cu unul roșu ciclul Ke (în stea, pe diagonale). Apoi rostește cu voce tare cele două cicluri, fără să te uiți. Este un exercițiu de memorie.", "puncte": [], "variante": ["5el", "mtc"], "intrebari": [{"q": "Ce înseamnă mai exact termenul Wu Xing?", "corect": "Cinci faze sau mișcări de transformare", "gresite": ["Cinci organe de bază", "Cinci tipuri de ace", "Cinci meridiane principale"], "explicatie": "Xing sugerează mișcare și fază. Elementele sunt tipare dinamice, nu substanțe."}, {"q": "Care este succesiunea corectă a ciclului Sheng (generare)?", "corect": "Lemn → Foc → Pământ → Metal → Apă → Lemn", "gresite": ["Lemn → Pământ → Apă → Foc → Metal → Lemn", "Foc → Apă → Lemn → Metal → Pământ → Foc", "Metal → Lemn → Pământ → Apă → Foc → Metal"], "explicatie": "Prima variantă greșită este ciclul Ke (control). Succesiunea Sheng urmărește generarea: lemnul alimentează focul, focul produce pământ etc."}, {"q": "Cum este corect să tratăm corespondențele dintre elemente, organe și emoții?", "corect": "Ca un sistem de analogii tradițional, util conceptual, dar nu ca legi fiziologice demonstrate.", "gresite": ["Ca dovezi științifice de laborator.", "Ca diagnostice medicale precise.", "Ca rețete de tratament obligatorii."], "explicatie": "Corespondențele sunt analogii utile de memorare și orientare, fără confirmare ca mecanisme biologice."}]}, {"id": "L2-2", "titlu": "Organele Zang-Fu ca sisteme funcționale", "minute": 9, "text": ["Zang-Fu este numele tradițional pentru „organele” interne în MTC. Zang sunt organele „pline” sau yin (Ficat, Inimă, Splină, Plămân, Rinichi, plus Pericard), considerate depozite ale substanțelor vitale. Fu sunt organele „goale” sau yang (Vezică biliară, Intestin subțire, Stomac, Intestin gros, Vezică urinară și Triplul Încălzitor), care primesc, transformă și elimină. Prin convenție, scriem numele cu majusculă pentru a nu le confunda cu organele anatomice.", "Diferența esențială: Zang-Fu sunt sisteme funcționale, nu organe anatomice în sens occidental. „Splina” din MTC se leagă de digestie, transformarea alimentelor și menținerea lichidelor, mai degrabă decât de organul limfoid pe care îl cunoaștem în anatomie. „Rinichiul” cuprinde aspecte de creștere, reproducere, oase și apă. De aceea, afirmația „Splina e slabă” în MTC nu înseamnă că organul este bolnav într-o analiză medicală.", "Fiecare sistem funcțional este descris printr-un tablou: funcții principale, țesutul pe care îl „controlează”, deschiderea spre exterior (de exemplu, Ficatul se deschide în ochi, Rinichiul în urechi), emoția asociată și cuplul yin–yang. Plămânul, de exemplu, „guvernează respirația și Qi-ul”, are legătură cu pielea și cu apărarea. Inima „guvernează sângele” și adăpostește Shen. Ficatul „asigură fluxul lin al Qi-ului”.", "Aceste descrieri au fost construite din observație clinică și din analogie, într-un context istoric în care disecția era limitată. Unele corespondențe au sens clinic ca metafore (de pildă, legătura dintre stres și tulburările digestive), altele nu au suport în fiziologia modernă. Cercetarea nu a confirmat că aceste „sisteme” corespund unor entități biologice distincte.", "De ce le studiem totuși? Pentru că ghidează logica alegerii punctelor în tradiție, iar meridianele poartă numele organelor. Când vezi „Meridianul Stomacului”, gândește-te la o rețea de puncte pe traseul tradițional, nu la un canal care ar duce la stomacul anatomic. Această distincție te ferește de două erori: de a respinge totul fără să înțelegi și de a lua totul literal."], "cheie": ["Zang sunt organele „pline” (yin), Fu sunt organele „goale” (yang).", "Zang-Fu sunt sisteme funcționale, nu organe anatomice ca în medicina occidentală.", "Fiecare sistem are funcții, țesut, deschidere, emoție și cuplu yin–yang asociate.", "Corespondențele provin din observație și analogie; nu au confirmare ca entități biologice distincte.", "Cunoașterea lor ajută la citirea logicii punctelor, nu la autodiagnostic."], "practica": "Alege două sisteme (de exemplu, Plămân și Rinichi). Pentru fiecare, scrie într-un tabel: funcția tradițională, țesutul, emoția asociată și ce ar spune anatomia modernă despre organul cu același nume. Observă unde se suprapun și unde diferă.", "puncte": [], "variante": ["mtc", "5el"], "intrebari": [{"q": "Care este corect despre „Splina” în MTC?", "corect": "Este un sistem funcțional legat de digestie și lichide, nu doar organul anatomic.", "gresite": ["Este exact organul limfoid din anatomie.", "Este un mușchi al coapsei.", "Este un meridian fără legătură cu digestia."], "explicatie": "Zang-Fu se referă la funcții ale sistemului, nu la organe anatomice în sens strict."}, {"q": "Care dintre acestea este un organ Zang (yin)?", "corect": "Inima", "gresite": ["Stomacul", "Intestinul gros", "Vezica urinară"], "explicatie": "Zang: Ficat, Inimă, Splină, Plămân, Rinichi (și Pericard). Stomacul, Intestinul gros și Vezica urinară sunt Fu (yang)."}, {"q": "De ce nu este potrivit să tragi concluzii medicale din afirmația „Rinichiul e slab” în MTC?", "corect": "Pentru că termenul desemnează un sistem funcțional tradițional, nu o boală a rinichiului anatomic.", "gresite": ["Pentru că rinichii nu apar în MTC.", "Pentru că MTC nu vorbește despre organe.", "Pentru că afirmația înseamnă mereu insuficiență renală."], "explicatie": "Într-un limbaj conceptual diferit, același cuvânt acoperă alte funcții. Evaluarea medicală se face cu metode medicale."}]}, {"id": "L2-3", "titlu": "Cauzele bolii și cele opt principii (Ba Gang)", "minute": 9, "text": ["MTC împarte tradițional cauzele bolii în trei mari categorii. Cauzele externe sunt șase influențe climatice numite „energii perverse”: Vântul, Frigul, Căldura de vară, Umezeala, Uscăciunea și Focul. Cauzele interne sunt cele șapte emoții (bucurie, mânie, griji, gândire excesivă, tristețe, teamă, spaimă) atunci când sunt excesive sau prelungite. A treia categorie, cauzele neutre, cuprinde alimentația dezordonată, surmenajul, lipsa mișcării, excesele, traumele și epuizarea.", "Dincolo de metafora climatică, ideea este că factorii de mediu, emoționali și de stil de viață influențează sănătatea. Medicina modernă confirmă parțial: stresul cronic, somnul insuficient, alimentația dezechilibrată și sedentarismul contribuie la boli. Dar nu susține o legătură specifică „Vânt–cefalee” sau „Umezeală–articulații” în sensul literal MTC.", "Cele opt principii (Ba Gang) sunt un cadru pentru a clasifica tabloul unui pacient în patru perechi de opuse: Yin–Yang (categoria generală), Exterior–Interior (adâncimea bolii), Frig–Căldură (natura procesului) și Plin (exces)–Gol (deficit), care descrie raportul dintre forța factorului patogen și rezistența organismului. De exemplu, o durere care se agravează la frig și se ameliorează la căldură ar fi interpretată ca tipar „Frig”; o agitație cu sete și față roșie ca tipar „Căldură”.", "Pe baza acestor perechi, tradiția alege principiul de tratament: a încălzi ce este rece, a răcori ce este fierbinte, a tonifia ce este în deficit, a disipa ce este în exces. Aici apare legătura cu tehnicile: moxibustia pentru tipare de frig, ventuzele sau sângerarea punctuală pentru excese (în tradiție), tonifierea prin stimulare blândă pentru deficit.", "Un avertisment important: Ba Gang este o grilă de lectură, nu un diagnostic medical. Aceeași senzație („îmi este frig”) poate avea cauze medicale foarte diferite, de la anemie la boli tiroidiene. De aceea, grila folosită de un amator este doar un exercițiu de înțelegere. Diagnosticul real aparține medicului, iar un practicant MTC responsabil lucrează în paralel cu el."], "cheie": ["Cauzele tradiționale sunt externe (6 energii), interne (7 emoții) și neutre (stil de viață, traume, surmenaj).", "Stresul, somnul și stilul de viață influențează într-adevăr sănătatea; legăturile literale „Vânt–cefalee” nu sunt dovedite.", "Ba Gang: Yin–Yang, Exterior–Interior, Frig–Căldură, Plin–Gol.", "Principiile ghidează tradițional alegerea tehnicii (de exemplu moxa pentru frig).", "Grila nu este un diagnostic medical și nu înlocuiește evaluarea unui medic."], "practica": "Alege o senzație banală de zi cu zi (de exemplu, mâini reci). Notează cum ai descrie-o în fiecare dintre cele patru perechi Ba Gang, apoi scrie trei explicații medicale posibile, pe care le-ar putea verifica un medic. Observă ce nu poate spune grila singură.", "puncte": [], "variante": ["mtc", "moxa-d"], "intrebari": [{"q": "Care dintre acestea NU este una dintre cele patru perechi ale Ba Gang?", "corect": "Sus–Jos", "gresite": ["Yin–Yang", "Frig–Căldură", "Plin–Gol"], "explicatie": "Cele patru perechi sunt Yin–Yang, Exterior–Interior, Frig–Căldură și Plin–Gol."}, {"q": "Ce reprezintă cauzele interne ale bolii în MTC?", "corect": "Cele șapte emoții, atunci când sunt excesive sau prelungite.", "gresite": ["Cele șase energii climatice.", "Doar infecțiile cu microbi.", "Doar factorii ereditari."], "explicatie": "Cauzele externe sunt climatice; cele interne sunt emoțiile; cele neutre cuprind stilul de viață, traumele și epuizarea."}, {"q": "Cum trebuie folosit Ba Gang de un cursant amator?", "corect": "Ca o grilă de înțelegere, nu ca diagnostic medical.", "gresite": ["Ca metodă sigură de a diagnostica boli grave.", "Ca motiv de a opri medicația.", "Ca înlocuitor pentru analize."], "explicatie": "Același simptom poate avea cauze medicale diferite; doar medicul poate stabili diagnosticul."}]}, {"id": "L2-4", "titlu": "Cele patru metode de diagnostic: ce pot și ce nu pot face amatorii", "minute": 9, "text": ["Diagnosticul în MTC se bazează pe patru metode (Si Zhen), folosite împreună. Observația (Wang) urmărește aspectul general, culoarea feței, starea spiritului, postura și mai ales limba: culoarea, forma, stratul de depunere. Auscultarea și olfacția (Wen) înseamnă ascultarea vocii, a respirației și a tusei, precum și observarea mirosurilor. Interogarea (Wen, cu alt ton în chineză) este un interviu detaliat: durere, frig sau căldură, transpirație, apetit, somn, scaun, urină, ciclu menstrual, emoții. Palparea (Qie) include luarea pulsului la încheietura mâinii și palparea zonelor dureroase sau a punctelor.", "Puls și limbă sunt cele mai cunoscute: tradiția descrie numeroase tipuri de puls (rapid, lent, filiform, tensionat) și aspecte ale limbii legate de tipare. Studiile moderne arată că fiabilitatea între examinatori este în general limitată și că aceste semne nu au fost validate ca teste diagnostice independente. Ele pot fi totuși un mod structurat de a observa pacientul.", "Ce poate face un amator în siguranță? Poate învăța să observe cu atenție: culoarea și starea limbii pentru a-și urmări obiceiurile (de exemplu, după mese sau în perioade de stres), ritmul propriu al respirației, tiparele de somn și apetit, locurile unde simte tensiune la palpare ușoară. Poate ține un jurnal al simptomelor, util inclusiv pentru medic. Acestea sunt exerciții de conștientizare, nu diagnostic.", "Ce NU poate face? Nu poate stabili boli, nu poate exclude afecțiuni grave pe baza pulsului sau a limbii și nu poate decide singur să oprească sau să înlocuiască un tratament. Nu poate interpreta pulsul altcuiva pentru a-i „spune ce are”. Un limb încărcat sau un puls „tensionat” nu confirmă și nu infirmă nicio boală. Cine pretinde asta depășește ce poate sprijini dovada.", "În practica profesionistă, cele patru metode se completează cu medicina convențională: analize, imagistică, examen clinic. Un practicant responsabil îți va cere rezultate medicale și te va trimite la medic dacă observă semne de alarmă. Ca cursant, rămâi la rolul de observator atent, nu de diagnostician."], "cheie": ["Cele patru metode sunt observația, auscultarea/olfacția, interogarea și palparea.", "Pulsul și limba sunt centrale în MTC, dar fiabilitatea lor ca test independent este limitată.", "Amatorul poate observa, nota și ține un jurnal; asta este conștientizare, nu diagnostic.", "Amatorul nu poate stabili boli, nu poate exclude afecțiuni grave și nu poate decide oprirea unui tratament.", "Un practicant responsabil lucrează împreună cu medicul și cere rezultate medicale."], "practica": "Timp de trei zile, notează seara într-un caiet: calitatea somnului, apetitul, nivelul de energie și un cuvânt despre stare. În ziua a patra, recitește notițele și caută tipare. Nu interpreta limba sau pulsul altcuiva. Dacă observi ceva care te îngrijorează, discută cu medicul.", "puncte": [], "variante": ["mtc", "acu-cl"], "intrebari": [{"q": "Care sunt cele patru metode de diagnostic din MTC?", "corect": "Observația, auscultarea/olfacția, interogarea și palparea", "gresite": ["Radiografia, analiza sângelui, ecografia și RMN", "Observația, tratamentul, prescrierea și controlul", "Meditația, respirația, mișcarea și dieta"], "explicatie": "Si Zhen este un set de patru metode clinice care se folosesc împreună."}, {"q": "Ce afirmație este corectă despre puls și limbă?", "corect": "Au valoare tradițională, dar nu au fost validate ca teste diagnostice independente și fiabile.", "gresite": ["Pot exclude orice boală gravă.", "Înlocuiesc analizele medicale.", "Sunt dovedite științific pentru toate afecțiunile."], "explicatie": "Fiabilitatea între examinatori este limitată, iar semnele nu sunt dovezi de boală sau de sănătate."}, {"q": "Ce poate face în siguranță un amator?", "corect": "Să observe și să noteze tipare proprii (somn, apetit, energie) într-un jurnal.", "gresite": ["Să interpreteze pulsul unui prieten pentru a-i spune ce boală are.", "Să decidă oprirea medicației pe baza limbii.", "Să excludă o boală gravă prin palpare."], "explicatie": "Observația personală este conștientizare. Diagnosticul și deciziile terapeutice aparțin personalului calificat."}]}]}, {"id": "L3", "titlu": "Meridiane și puncte", "descriere": "Harta tradițională: meridianele principale, măsurarea cu cun, tipurile speciale de puncte și zece puncte esențiale. Accentul cade pe localizare corectă și pe precauții.", "lectii": [{"id": "L3-1", "titlu": "Meridianele principale, cuplările yin–yang și ceasul meridianelor", "minute": 9, "text": ["Meridianele (jingluo) sunt, în tradiția MTC, canale prin care circulă Qi-ul. Cele douăsprezece meridiane principale poartă numele organelor Zang-Fu: Plămân (LU), Intestin gros (LI), Stomac (ST), Splină (SP), Inimă (HT), Intestin subțire (SI), Vezică urinară (BL), Rinichi (KI), Pericard (PC), Triplu Încălzitor (TE), Vezică biliară (GB) și Ficat (LR). La ele se adaugă două vase mediane importante: Du Mai (GV, pe linia spatelui) și Ren Mai (CV, pe fața anterioară a trunchiului). Codurile sunt cele ale OMS, pe care le vei folosi mereu.", "Meridianele yin ale mâinii (LU, PC, HT) urcă pe fața internă a brațului; cele yang ale mâinii (LI, TE, SI) pe fața externă. Meridianele yin ale piciorului (SP, LR, KI) merg pe fața internă a membrului inferior; cele yang (ST, GB, BL) pe fața externă, anterioară, laterală sau posterioară. Fiecare meridian yin este cuplat cu unul yang, ca „pereche” relaționată: LU–LI, ST–SP, HT–SI, BL–KI, PC–TE, GB–LR. Cuplările apar și în logica punctelor Luo și Yuan, pe care le vei întâlni în lecția 3.", "Tradiția descrie și un „ceas al meridianelor”: Qi-ul ar atinge un maxim în fiecare meridian, pe rând, la intervale de două ore. Succesiunea este LU 3–5, LI 5–7, ST 7–9, SP 9–11, HT 11–13, SI 13–15, BL 15–17, KI 17–19, PC 19–21, TE 21–23, GB 23–1, LR 1–3. Unii practicieni o folosesc pentru a alege momentul tratamentului.", "Rezerva științifică este clară: meridianele nu au fost identificate ca structuri anatomice distincte. Studiile care căutau canale vizibile prin imagistică sau trasori au dat rezultate inconsistente și neconfirmate. Ceasul meridianelor nu are suport experimental ca fenomen fiziologic; ritmurile circadiene reale există, dar urmează alte tipare. Cu alte cuvinte, ceasul este un instrument mnemonic și o convenție culturală, nu un fapt biologic.", "De ce le învățăm? Pentru că maparea punctelor pe meridiane este limbajul comun al acupuncturii, iar harta ajută la memorare și la comunicare. Poți folosi meridianele ca hartă a localizării punctelor fără a crede în canale fizice. Distingerea dintre „așa spune tradiția” și „așa arată dovezile” rămâne regula de aur."], "cheie": ["Există 12 meridiane principale (numite după organe) și două vase mediane, GV și CV.", "Meridianele yin și yang sunt cuplate: LU–LI, ST–SP, HT–SI, BL–KI, PC–TE, GB–LR.", "Ceasul meridianelor împarte ziua în intervale de două ore, începând cu LU la 3–5.", "Meridianele nu sunt structuri anatomice identificate; ceasul nu are suport experimental ca fenomen fiziologic.", "Harta meridianelor rămâne utilă ca limbaj comun de localizare."], "practica": "Fă o fișă cu cele 12 meridiane în ordinea ceasului, cu intervalele orare. Pe verso, scrie cele șase cuplări yin–yang. Încearcă să le recitești de memorie în trei zile consecutive. Este un exercițiu de memorare, nu un orar de tratament.", "puncte": ["LU7", "LI4", "ST36", "SP6", "HT7", "BL40"], "variante": ["mtc", "acu-cl"], "intrebari": [{"q": "Care este cuplarea yin–yang corectă?", "corect": "Pericard (PC) – Triplu Încălzitor (TE)", "gresite": ["Plămân (LU) – Stomac (ST)", "Inimă (HT) – Vezică biliară (GB)", "Rinichi (KI) – Intestin gros (LI)"], "explicatie": "Cuplările sunt LU–LI, ST–SP, HT–SI, BL–KI, PC–TE, GB–LR."}, {"q": "Ce meridian este activ, în ceasul tradițional, între orele 3 și 5?", "corect": "Plămânul (LU)", "gresite": ["Ficatul (LR)", "Stomacul (ST)", "Rinichiul (KI)"], "explicatie": "Ciclul începe cu LU la 3–5 și continuă cu LI la 5–7 și așa mai departe; Ficatul este la 1–3."}, {"q": "Ce se poate spune corect despre existența meridianelor?", "corect": "Nu au fost identificate ca structuri anatomice distincte, dar harta lor rămâne utilă ca limbaj de localizare.", "gresite": ["Au fost vizualizate clar în toate studiile.", "Sunt identice cu vasele limfatice.", "Sunt identice cu nervii periferici."], "explicatie": "Cercetările de imagistică nu au confirmat canale anatomice distincte. Harta rămâne un sistem de referință tradițional."}]}, {"id": "L3-2", "titlu": "Cun și găsirea punctelor", "minute": 9, "text": ["Cun-ul (în engleză „body inch”) este unitatea de măsură folosită pentru localizarea punctelor. Nu este o lungime fixă în centimetri, ci o proporție relativă la corpul persoanei: de aceea aceeași localizare funcționează la un copil și la un adult. Această idee simplă rezolvă o problemă importantă: oamenii au proporții diferite, iar un număr în centimetri ar fi inexact.", "Există două moduri practice de a măsura. Primul folosește degetele persoanei însăși: lățimea articulației interfalangiene a policelui reprezintă aproximativ 1 cun; lățimea celor patru degete lipite, măsurată la nivelul încheieturii mijlocii a degetului mijlociu, reprezintă aproximativ 3 cun. Al doilea mod folosește proporții anatomice standard: linia părului față–ceafă are cam 12 cun; distanța dintre mameloane 8 cun; de la apendicele xifoid la ombilic 8 cun; de la ombilic la marginea superioară a simfizei pubiene 5 cun; de la pliul încheieturii la pliul cotului 12 cun; de la pliul popliteu la maleola externă 16 cun.", "Pe lângă cun, punctele se găsesc folosind repere anatomice: proeminențe osoase (maleolă, stiloidă radială), pliuri cutanate (pliul încheieturii), tendoane care se văd la mișcare, depresiuni palpabile. Mulți dintre punctele clasice se simt ca mici adâncituri sau zone ușor sensibile. Sensibilitatea la presiune este un indiciu, dar nu un criteriu sigur: multe zone sunt sensibile fără legătură cu vreun punct clasic.", "Studiile arată că precizia localizării variază între practicieni, iar diferențe de câțiva milimetri sunt frecvente. Cercetătorii au arătat și că în multe cazuri efectele măsurate nu depind strict de un punct exact, ci de zona și de stimul. Acest lucru este un motiv de umilință metodologică, nu un motiv de neglijență: la un curs, ne străduim să localizăm corect, dar nu pretindem exactitate de milimetru.", "Câteva sfaturi practice: lucrează cu pielea curată și cu mâinile calde; măsoară pe persoana respectivă, nu pe tine, dacă lucrezi cu altcineva; verifică mereu partea opusă a corpului ca să compari; și amintește-ți că dacă localizarea te îngrijorează sau presiunea doare mai mult decât un disconfort ușor, te oprești. În aplicație, fiecare punct are descrierea sa după standardele OMS."], "cheie": ["Cun este o unitate proporțională la corpul fiecărei persoane, nu o lungime fixă.", "Pentru 1 cun folosești lățimea articulației policelui; pentru 3 cun, patru degete lipite.", "Proporțiile standard: 12 cun între linia părului față–ceafă, 8 cun între mameloane, 12 cun de la pliul încheieturii la pliul cotului.", "Reperele anatomice (oase, pliuri, tendoane) sunt esențiale; sensibilitatea singură nu este un criteriu sigur.", "Precizia localizării variază între practicieni; nu pretinde exactitate de milimetru."], "practica": "Măsoară-ți cu degetele 1 cun (lățimea policelui la articulație) și 3 cun (patru degete). Apoi găsește pe antebrațul tău, cu un creion de dermatograf sau cu degetul, un punct aflat la 2 cun deasupra pliului încheieturii, pe fața internă, între cele două tendoane vizibile când strângi pumnul. Apasă ușor, fără durere. Este reperul pentru PC6.", "puncte": ["PC6", "LI4", "ST36"], "variante": ["acupresura", "acu-cl"], "intrebari": [{"q": "De ce se folosește cun și nu centimetri?", "corect": "Pentru că proporțiile corpului diferă de la o persoană la alta.", "gresite": ["Pentru că centimetrul nu există în MTC.", "Pentru că cun-ul este o lungime fixă mai precisă.", "Pentru că punctele nu pot fi măsurate."], "explicatie": "Cun-ul este proporțional cu corpul persoanei, deci o localizare rămâne valabilă la corpuri de dimensiuni diferite."}, {"q": "Cât reprezintă, aproximativ, lățimea celor patru degete lipite, măsurată la încheietura mijlocie a mijlociului?", "corect": "3 cun", "gresite": ["1 cun", "5 cun", "12 cun"], "explicatie": "Un deget (articulația policelui) are cam 1 cun, iar patru degete lipite cam 3 cun."}, {"q": "Ce afirmație despre sensibilitatea la presiune este corectă?", "corect": "Poate fi un indiciu, dar nu este un criteriu sigur pentru a identifica un punct clasic.", "gresite": ["Dacă doare, este întotdeauna punctul corect.", "Dacă nu doare deloc, punctul nu există.", "Durerea intensă este scopul presiunii."], "explicatie": "Multe zone sunt sensibile fără legătură cu puncte clasice. Presiunea trebuie să rămână confortabilă."}]}, {"id": "L3-3", "titlu": "Tipuri speciale de puncte", "minute": 10, "text": ["Nu toate punctele sunt egale în tradiție. Unele au roluri speciale, iar cunoașterea lor ajută la citirea protocoalelor. Punctele Yuan (sursă) sunt considerate locuri unde se concentrează Qi-ul originar al organului; pe meridianele yin coincid de obicei cu punctul Shu (de exemplu LU9, HT7, KI3), iar pe cele yang au loc separat (LI4, ST42, GB40). Punctele Luo (de legătură) fac punte între meridianul yin și cel yang cuplat; exemple: LU7, PC6, ST40.", "Punctele Xi (de fisură) sunt locuri în care Qi-ul și sângele se „adună” în profunzime și sunt folosite tradițional pentru stări acute sau dureroase ale organului respectiv (de exemplu LU6, PC4, ST34). Punctele Mu (alarmă, frontale) sunt pe trunchiul anterior și se spune că reflectă starea organului: LU1 pentru Plămân, CV12 pentru Stomac, LR14 pentru Ficat, CV14 pentru Inimă. Punctele Shu dorsale (de transport) sunt pe linia interioară a meridianului Vezicii urinare, pe spate, în dreptul fiecărui organ: BL13 (Plămân), BL15 (Inimă), BL18 (Ficat), BL20 (Splină), BL23 (Rinichi). Perechea Mu–Shu se folosește tradițional împreună.", "Punctele He mare (He-Sea) sunt situate de obicei lângă cot sau genunchi și, în tradiție, influențează organele Fu: ST36 (Stomac), GB34 (Vezică biliară), BL40 (Vezică urinară), LI11 (Intestin gros). Punctele Hui (de reuniune) sunt opt locuri care „adună” anumite țesuturi sau substanțe: CV12 pentru organele Fu, CV17 pentru Qi, BL17 pentru sânge, GB34 pentru tendoane și mușchi, BL11 pentru oase, GB39 pentru măduvă, LU9 pentru vase și LR13 pentru organele Zang.", "Cele opt puncte-cheie ale celor opt vase extraordinare (puncte de deschidere) sunt: SP4 (Chong Mai), PC6 (Yin Wei Mai), SI3 (Du Mai), BL62 (Yang Qiao Mai), GB41 (Dai Mai), TE5 (Yang Wei Mai), LU7 (Ren Mai) și KI6 (Yin Qiao Mai). Ele se folosesc în perechi, de exemplu SP4 cu PC6 sau LU7 cu KI6.", "Un cuvânt despre dovezi: aceste categorii sunt construcții ale tradiției clinice. Nu există teste moderne care să arate că un punct Yuan sau Hui ar avea efecte distincte în sensul descris. Ele sunt un sistem de organizare a cunoștințelor, util ca limbaj profesional și pentru memorare. Dacă sunt citite ca fapte biologice, ele devin mai mult decât pot susține dovezile."], "cheie": ["Yuan = punct sursă; Luo = punct de legătură între meridianul yin și cel yang cuplat; Xi = punct de fisură, folosit tradițional pentru stări acute.", "Mu = alarmă anterior; Shu dorsal = transport, pe linia interioară BL; He mare (ST36, GB34, BL40) = tradițional legate de organele Fu.", "Cele opt puncte Hui adună țesuturi sau substanțe (de exemplu BL11 pentru oase, GB34 pentru tendoane).", "Cele opt puncte-cheie ale vaselor extraordinare: SP4, PC6, SI3, BL62, GB41, TE5, LU7, KI6.", "Aceste categorii sunt sisteme tradiționale de organizare, fără validare ca efecte biologice distincte."], "practica": "Pe o fișă, scrie cele opt perechi de puncte de deschidere (SP4–PC6, SI3–BL62, TE5–GB41, LU7–KI6) și, lângă fiecare punct, numele meridianului pe care se află. Memorează-le două câte două. Este un exercițiu de vocabular profesional.", "puncte": ["LU7", "PC6", "SP4", "LI4", "ST36", "GB34", "BL40", "KI3"], "variante": ["acu-cl", "mtc"], "intrebari": [{"q": "Ce tip de punct este LU7?", "corect": "Punct Luo și punct de deschidere al vasului Ren Mai", "gresite": ["Punct Mu al Plămânului", "Punct Shu dorsal al Plămânului", "Punct Hui al oaselor"], "explicatie": "LU7 este Luo al meridianului Plămânului și punct-cheie pentru Ren Mai. Punctul Mu al Plămânului este LU1."}, {"q": "Unde se găsesc, în general, punctele Shu dorsale?", "corect": "Pe linia interioară a meridianului Vezicii urinare, pe spate", "gresite": ["Pe fața internă a brațului", "Pe vârful degetelor", "Pe fața anterioară a trunchiului"], "explicatie": "Punctele Shu dorsale (de exemplu BL13, BL15, BL18, BL20, BL23) sunt pe spate. Cele de pe fața anterioară sunt punctele Mu."}, {"q": "Cum trebuie privite categoriile de puncte speciale?", "corect": "Ca sisteme tradiționale de organizare, fără validare modernă ca efecte biologice distincte.", "gresite": ["Ca fapte demonstrate de studii randomizate.", "Ca reguli obligatorii de siguranță.", "Ca dovezi că meridianele există anatomic."], "explicatie": "Sunt categorii ale tradiției clinice. Utilitatea lor este conceptuală și profesională."}]}, {"id": "L3-4", "titlu": "Zece puncte esențiale: localizare, utilizări, precauții", "minute": 12, "text": ["Iată zece puncte frecvent întâlnite, cu localizarea simplificată. LI4 (Hegu) se află pe dosul mâinii, la jumătatea celui de-al doilea os metacarpian, pe partea dinspre police. În tradiție, se folosește pentru cap, față și durere în general; precauție în sarcină. PC6 (Neiguan) se află pe fața internă a antebrațului, la 2 cun deasupra pliului încheieturii, între tendoane; este cel mai studiat punct pentru greață, cu dovezi moderate pentru greața postoperatorie. ST36 (Zusanli) este la 3 cun sub ST35, la un lat de deget lateral de creasta tibiei; se folosește tradițional pentru digestie și oboseală.", "SP6 (Sanyinjiao) este la 3 cun deasupra vârfului maleolei interne, pe marginea posterioară a tibiei; tradiția îl leagă de funcții ginecologice și digestive; se evită în sarcină. LR3 (Taichong) este pe dosul piciorului, în depresiunea dintre oasele metatarsiene I și II, spre degete; este asociat tradițional cu stresul și tensiunea. GB20 (Fengchi) se află în depresiunea de la baza craniului, între mușchii sternocleidomastoidian și trapez; se folosește pentru tensiune cervicală și cefalee, cu presiune blândă.", "GV20 (Baihui) este pe linia mediană a capului, la 5 cun deasupra liniei frontale a părului; se folosește tradițional pentru claritate mentală și amețeală. HT7 (Shenmen) se află în pliul încheieturii, pe partea ulnară, lângă tendonul flexorului ulnar al carpului; este asociat tradițional cu agitația și somnul. LU7 (Lieque) este la 1,5 cun deasupra pliului încheieturii, deasupra apofizei stiloide a radiusului; se folosește tradițional pentru ceafă și răceli. KI3 (Taixi) este în depresiunea dintre maleola internă și tendonul lui Ahile, la nivelul vârfului maleolei; tradițional este legat de energia de fond și de lombe.", "Ce susține cercetarea? Dovezile sunt cele mai consistente pentru PC6 și greață (postoperatorie, în sarcină, în chimioterapie); pentru ST36, LI4 sau GB20 rezultatele sunt mixte și depind de afecțiune. Un punct nu este un buton cu efect garantat. Studiile cu acupunctură simulată arată că o parte din efect este contextuală.", "Precauții generale: presiune ușoară până la moderată, fără durere ascuțită, 30–60 de secunde, nu mai mult de câteva minute; nu pe piele lezată, inflamată sau cu varice; atenție în sarcină (LI4, SP6, uneori și GB21, în tradiție), la anticoagulante și la boli cronice. Nu folosi punctele pentru a amâna consultul la simptome noi. Dacă apar amețeli, greață sau durere crescândă, oprește-te."], "cheie": ["LI4 (dosul mâinii), PC6 (2 cun deasupra pliului încheieturii), ST36 (3 cun sub ST35), SP6 (3 cun deasupra maleolei interne) sunt repere de localizare esențiale.", "LR3, GB20, GV20, HT7, LU7 și KI3 completează setul de zece.", "Cele mai consistente dovezi vizează PC6 și greața; pentru celelalte puncte rezultatele sunt mixte.", "LI4 și SP6 se evită în sarcină în tradiție; atenție la anticoagulante.", "Presiune blândă, fără durere ascuțită; oprește-te la amețeli, greață sau durere crescândă."], "practica": "Alege un singur punct din listă, de exemplu PC6. Localizează-l pe antebrațul tău cu ajutorul lui cun (2 cun deasupra pliului încheieturii, între tendoane). Apasă ușor, în mișcări circulare mici, timp de 30–60 de secunde, respirând calm. Oprește-te dacă simți durere ascuțită. Nu repeta mai mult de câteva ori pe zi și nu folosi exercițiul în loc de ajutor medical.", "puncte": ["LI4", "PC6", "ST36", "SP6", "LR3", "GB20", "GV20", "HT7", "LU7", "KI3"], "variante": ["acupresura", "acu-cl"], "intrebari": [{"q": "Unde se află PC6 (Neiguan)?", "corect": "Pe fața internă a antebrațului, la 2 cun deasupra pliului încheieturii, între tendoane", "gresite": ["Pe dosul mâinii, între degetul mare și arătător", "Pe fața externă a gambei, sub genunchi", "La baza craniului, între mușchii cervicali"], "explicatie": "PC6 este pe fața palmară a antebrațului, între tendoanele palmarului lung și flexorului radial al carpului. Celelalte localizări aparțin altor puncte (LI4, ST36, GB20)."}, {"q": "Pentru ce afecțiune sunt dovezile cele mai consistente în cazul unui punct din această listă?", "corect": "Greața (postoperatorie, în sarcină, în chimioterapie), cu PC6", "gresite": ["Insomnia, cu HT7, în toate cazurile", "Oboseala cronică, cu ST36, în toate cazurile", "Depresia severă, cu GV20"], "explicatie": "Pentru PC6 și greață există dovezi moderate. Pentru celelalte puncte și afecțiuni rezultatele sunt mixte sau limitate."}, {"q": "Ce punct trebuie evitat în sarcină, conform precauțiilor tradiționale?", "corect": "SP6 (și LI4)", "gresite": ["HT7", "LU7", "GV20"], "explicatie": "În tradiție, LI4 și SP6 se evită în sarcină. Orice utilizare în sarcină se discută cu medicul."}]}]}, {"id": "L4", "titlu": "Acupresură practică", "descriere": "Învață să aplici presiunea corect și în siguranță, să urmezi protocoale simple pentru disconfortul de zi cu zi și să alegi între mâini, obiecte și masaj. Accentul cade pe autoîngrijire blândă, nu pe tratarea bolilor.", "lectii": [{"id": "L4-1", "titlu": "Tehnica de bază: presiune, durată, respirație, poziții", "minute": 8, "text": ["Acupresura se bazează pe un gest simplu: presezi un punct cu degetul mare, cu index sau cu articulația degetului, fără să zgârii pielea și fără să tremuri. Presiunea corectă este fermă, dar confortabilă. Pe o scală de la 0 la 10, țintește 4–6: simți o „durere plăcută”, o senzație de greutate sau de căldură, nu o durere ascuțită. Dacă îți încleștezi maxilarul sau îți ții respirația, apeși prea tare.", "Procedura are patru pași. Mai întâi găsește punctul: caută o mică adâncitură sau o zonă ușor mai sensibilă, în jurul locului indicat de hartă. Apoi apasă perpendicular pe piele, crescând presiunea lent, în 3–5 secunde. Menține 30–90 de secunde, fie static, fie cu mici mișcări circulare de 1–2 mm. La final eliberează la fel de lent cum ai intrat. Poți repeta de 2–3 ori pe punct, alternând părțile corpului.", "Respirația face jumătate din tehnică. Inspiră pe nas câteva secunde, iar pe expirație lungă mărește ușor presiunea; la următoarea expirație menține-o. O respirație calmă scade tensiunea musculară și face senzația mai ușor de suportat. În tradiția MTC, expirația lentă ajută „Qi-ul să circule”; în explicația modernă, respirația lentă activează sistemul parasimpatic, iar atenția la senzație poate modifica percepția durerii.", "Poziția contează: stai așezat sau întins, cu spatele sprijinit și mușchii din zona tratată relaxați. Pentru puncte de la mână sau antebraț, sprijină cotul pe o masă. Pentru picior, așază glezna pe genunchiul opus. Nu lucra într-o poziție în care trebuie să menții efort pentru a ajunge la punct, pentru că tensiunea ta anulează relaxarea.", "Reguli de prudență: evită pielea lezată, inflamată sau cu erupții, varicele vizibile, zonele cu vânătăi recente și zonele operate. Nu apăsa puternic pe abdomen după masă sau în sarcină fără sfatul medicului; unele puncte (de exemplu LI4, SP6) sunt evitate în sarcină în tradiție. Oprește-te dacă apar amețeli, amorțeli persistente sau durere crescândă. Acupresura este o îngrijire de confort și nu înlocuiește evaluarea medicală pentru simptome noi, intense sau persistente."], "cheie": ["Intensitate țintă 4–6 din 10: fermă, dar confortabilă, fără durere ascuțită.", "Presiune lentă în 3–5 secunde, menținere 30–90 de secunde, eliberare lentă.", "Expirația lungă și relaxarea mușchilor fac tehnica mai eficientă și mai sigură.", "Evită pielea lezată, zonele operate și apăsarea intensă în sarcină.", "Rațiunea MTC (Qi) și cea modernă (răspuns nervos, relaxare) sunt explicații diferite, nu dovezi una pentru alta."], "practica": "Așază-te comod, sprijină antebrațul pe o masă și caută LI4 în mușchiul dintre police și index. Apasă la intensitate 4–5 din 10 timp de 45 de secunde, respirând lent (inspir 4 secunde, expir 6). Eliberează lent și repetă pe cealaltă mână. Dacă ești însărcinată, omite exercițiul.", "puncte": ["LI4", "PC6", "ST36"], "variante": ["acupresura", "doin"], "intrebari": [{"q": "Ce intensitate a presiunii este recomandată la acupresura de bază?", "corect": "Fermă, dar confortabilă, în jur de 4–6 din 10", "gresite": ["Cât mai puternică, până apare durere ascuțită", "Doar o atingere foarte ușoară, fără presiune", "Variabilă, crescând până la limita suportabilității"], "explicatie": "Scopul este o senzație de „durere plăcută”. Durerea ascuțită duce la tensionare musculară și poate irita țesuturile."}, {"q": "Cum se apasă și se eliberează un punct?", "corect": "Lent, perpendicular pe piele, cu menținere de 30–90 de secunde și eliberare lentă", "gresite": ["Brusc, cu lovituri scurte repetate", "Cu unghia, prin zgâriere ușoară", "Cât mai scurt, sub 5 secunde, pentru a nu irita"], "explicatie": "Creșterea și scăderea graduală a presiunii sunt mai confortabile și reduc riscul de vânătăi."}, {"q": "De ce se asociază presiunea cu expirația lentă?", "corect": "Pentru că respirația calmă favorizează relaxarea musculară și tolerarea senzației", "gresite": ["Pentru că expirația este singura fază în care punctul „se deschide” anatomic", "Pentru că aerul expirat încălzește punctul", "Pentru că fără ea acupresura nu are niciun efect posibil"], "explicatie": "Respirația lentă scade tensiunea și activează răspunsul parasimpatic; MTC o descrie în termeni de Qi, dar beneficiul practic este de relaxare."}]}, {"id": "L4-2", "titlu": "Protocoale pentru greață, cefalee de tensiune, insomnie și stres", "minute": 9, "text": ["Un protocol de acupresură este o succesiune scurtă de puncte, aleasă după un scop. În PUNCTUM găsești patru protocoale de bază. Ele sunt propuneri de confort, nu tratamente medicale: dacă simptomul este puternic, nou sau nu trece, cere sfat medical.", "Greață și rău de mișcare: punctul central este PC6 (Neiguan), pe față interioară a antebrațului, la trei lățimi de deget deasupra pliului încheieturii, între cele două tendoane. În MTC, PC6 „calmează stomacul și pieptul”. Pentru stimularea PC6 în greața de după operație, o sinteză Cochrane (Lee, Chan și Fan, 2015) a găsit dovezi de calitate scăzută că este mai bună decât placebo și dovezi moderate că nu diferă de medicamentele antiemetice. Se adaugă uneori ST36 și CV12 pentru digestie. Apasă PC6 un minut pe fiecare braț, cu respirație lentă.", "Cefalee de tensiune: tensiunea din ceafă și umeri întreține adesea durerea. Începe cu GB20, în adânciturile de la baza craniului, apăsând cu degetele mari și lăsând capul să se sprijine ușor înapoi. Continuă cu LI4 și cu tâmplele (EX-HN5), apoi cu zona dintre sprâncene (EX-HN3), prin atingeri mici și lente. Rațiunea MTC: GB20 „eliberează vântul” din cap; rațiunea modernă: relaxarea mușchilor suboccipitali și distragerea atenției de la durere.", "Insomnie și agitație seara: fă sesiunea cu 30–60 de minute înainte de culcare, în semiîntuneric. HT7, în pliul încheieturii, pe partea mică a degetului mic, este punctul „calmului minții” în MTC; adaugă KI1, în talpă, și SP6, deasupra gleznei (evită SP6 în sarcină). Cercetările despre acupresură pentru somn există, dar sunt mici și de calitate variabilă; igiena somnului rămâne baza.", "Stres și anxietate: GV20 în creștetul capului, EX-HN3, PC6, HT7 și LR3 între primele două degete de la picior. Combină cu respirația 4 secunde inspir, 6 secunde expir. Efectul probabil este de relaxare și de atenție îndreptată spre corp, ceea ce este valoros, dar nu înlocuiește psihoterapia sau tratamentul în anxietate persistentă. Regula practică: alege un singur protocol, aplică-l 5–10 minute și notează ce ai simțit. Dacă greața este intensă sau însoțită de febră, durere abdominală puternică sau vărsături repetate, ori dacă o cefalee este bruscă și neobișnuit de severă, mergi la medic."], "cheie": ["PC6 este punctul cu cele mai multe studii pentru greață, dar dovezile sunt de calitate limitată.", "Cefaleea de tensiune: GB20, LI4 și tâmplele, cu accent pe relaxarea cefei.", "Insomnie: sesiune scurtă seara, HT7, KI1 și SP6, împreună cu igiena somnului.", "Stres: GV20, EX-HN3, PC6, HT7, LR3 și respirație 4–6.", "Semnele de alarmă (cefalee bruscă severă, vărsături repetate, febră) cer consult medical, nu acupresură."], "practica": "Seara, cu 30 de minute înainte de culcare, apasă HT7 (pliul încheieturii, partea dinspre degetul mic) 45 de secunde pe fiecare mână, apoi masează blând talpa în zona KI1. Respiră 4 secunde inspir, 6 expir. Oprește-te dacă apare disconfort.", "puncte": ["PC6", "ST36", "CV12", "GB20", "LI4", "EX-HN5", "EX-HN3", "HT7", "KI1", "SP6", "GV20", "LR3"], "variante": ["acupresura", "band"], "intrebari": [{"q": "Ce punct este cel mai studiat pentru greață?", "corect": "PC6 (Neiguan), pe antebraț", "gresite": ["GB20, la baza craniului", "KI1, în talpă", "GV20, în creștet"], "explicatie": "PC6 este punctul pentru care există cele mai multe studii, inclusiv sinteze Cochrane, deși calitatea dovezilor rămâne în general limitată."}, {"q": "Ce a arătat sinteza Cochrane 2015 (Lee și colab.) despre PC6 în greața postoperatorie?", "corect": "Dovezi de calitate scăzută de superioritate față de sham și dovezi moderate de efect similar cu antiemeticele", "gresite": ["Dovezi de calitate înaltă că PC6 este superior medicamentelor", "Dovezi clare că PC6 nu are niciun efect", "Concluzii valabile și pentru greața din sarcină"], "explicatie": "Sinteza a vizat greața postoperatorie și nu a stabilit superioritatea față de medicamente; nu se aplică automat altor situații."}, {"q": "Care este o situație în care nu folosești un protocol de acupresură, ci mergi la medic?", "corect": "Cefalee bruscă, neobișnuit de severă", "gresite": ["Tensiune ușoară în ceafă după muncă la birou", "Dificultate ușoară de a adormi într-o seară", "Oboseală după o zi stresantă"], "explicatie": "O cefalee instalată brusc și foarte intens poate indica o problemă gravă și necesită evaluare medicală."}]}, {"id": "L4-3", "titlu": "Auto-îngrijire pentru spate, gât, umeri și ochi la ecran", "minute": 9, "text": ["Munca la calculator înseamnă ore în aceeași poziție: capul înainte, umerii ridicați, privirea fixă. Autoacupresura nu corectează postura, dar poate reduce tensiunea musculară și poate fi o pauză utilă între perioade de lucru. Ea funcționează cel mai bine împreună cu mișcarea, hidratarea și pauzele regulate.", "Gât și umeri: începe cu GB20, la baza craniului, apoi coboară spre GB21, pe mijlocul mușchiului trapez, deasupra umărului. Apasă GB21 cu degetele opuse, cu brațul relaxat. În MTC, GB21 „coboară Qi-ul” și relaxează umerii; modern, este o zonă de tensiune frecventă a trapezului. Adaugă BL10, lateral de coloană, la nivelul cefei, și TE14 dacă ai disconfort pe umăr. Menține fiecare punct un minut, cu respirație lentă.", "Spate: partea inferioară a spatelui se tratează mai ușor cu un ajutor sau cu un obiect (vezi lecția următoare), dar poți ajunge la BL23, de o parte și de alta a coloanei lombare, cu pumnii strânși, sprijinindu-ți spatele de scaun. Un punct distal util este BL40, la mijlocul pliului genunchiului, și BL60, lângă gleznă. Pentru muncă prelungită, ridică-te la fiecare 45–60 de minute și mișcă-ți umerii. Dacă durerea coboară în picior, apare slăbiciune sau amorțeală sau durerea durează săptămâni, cere consult.", "Ochii la ecran: oboseala vizuală include uscăciune, tensiune în jurul ochilor și cefalee ușoară. Puncte tradiționale: BL2, la capătul interior al sprâncenei, ST2, sub ochi, pe marginea osului, și GB14, deasupra sprâncenei. Apasă blând, doar cu vârful degetului, fără a atinge globul ocular. În școlile din China există o serie de exerciții oculare; dovezile pentru acupresura oculară sunt limitate și mici, deci tratează-o ca pe o pauză de relaxare. Regula 20-20-20 (la fiecare 20 de minute, privește 20 de secunde la 6 metri) are suport mai bun.", "Nu aplica presiune pe ochi dacă porți lentile de contact, ai glaucom, ai suferit o operație oculară recentă sau ai o infecție oculară. Presiunea se exercită doar pe osul din jurul ochiului. Dacă apar tulburări de vedere, durere oculară sau cefalee intensă, consultă medicul oftalmolog."], "cheie": ["Autoacupresura completează, dar nu înlocuiește postura bună, pauzele și mișcarea.", "GB20, GB21 și BL10 sunt punctele cheie pentru gât și umeri.", "BL23, BL40 și BL60 sunt folosite în autoîngrijirea spatelui; durerea cu iradiere în picior cere consult.", "Pentru ochi se apasă doar pe osul din jurul orbitei, niciodată pe globul ocular.", "Regula 20-20-20 are dovezi mai bune decât acupresura oculară."], "practica": "Stai pe scaun cu umerii relaxați. Apasă GB20 cu degetele mari, 45 de secunde, lăsând capul ușor înapoi. Apoi apasă GB21 pe fiecare parte, cu mâna opusă, 45 de secunde, respirând lent. Încheie privind pe fereastră la distanță 20 de secunde.", "puncte": ["GB20", "GB21", "BL10", "BL23", "BL40", "BL60", "BL2", "ST2", "GB14"], "variante": ["acupresura", "doin", "acuyoga"], "intrebari": [{"q": "Unde se aplică presiunea în jurul ochilor?", "corect": "Pe osul orbitei, nu pe globul ocular", "gresite": ["Direct pe globul ocular, cu forță mică", "Pe pleoape, cu masaj circular", "Pe cornee, cu un deget curat"], "explicatie": "Globul ocular nu se apasă niciodată; punctele BL2, ST2 și GB14 se află pe marginea osoasă."}, {"q": "Care dintre acestea este un semn pentru care ceri consult în loc de autoîngrijire?", "corect": "Durere de spate care coboară în picior cu slăbiciune sau amorțeală", "gresite": ["Rigiditate ușoară în ceafă după o zi la birou", "Oboseală musculară după o plimbare lungă", "Tensiune în umeri la sfârșit de săptămână"], "explicatie": "Iradierea cu deficit neurologic poate indica compresie nervoasă și trebuie evaluată medical."}, {"q": "Ce măsură pentru oboseala ochilor are, în general, dovezi mai bune decât acupresura oculară?", "corect": "Pauze regulate de privire la distanță (regula 20-20-20)", "gresite": ["Presiunea puternică pe BL2", "Închiderea ochilor timp de o oră", "Aplicarea de căldură pe pleoape timp de o oră"], "explicatie": "Pauzele de focalizare la distanță sunt o recomandare standard; acupresura oculară are dovezi limitate."}]}, {"id": "L4-4", "titlu": "Autoacupresură cu obiecte; comparație cu masajul și când nu", "minute": 8, "text": ["Unele zone, mai ales spatele între omoplați și bazinul, sunt greu de ajuns cu degetele. Aici ajută obiectele: o minge de tenis sau lacrosse, o rolă de spumă, un covoraș cu proeminențe sau un băț cu vârf rotunjit. Principiul este același ca la degete: presiune lentă, fermă, dar suportabilă, cu respirație calmă.", "Mingea: așază-te cu spatele pe un perete sau pe podea și plasează mingea lângă coloană (nu pe coloană), la nivelul punctelor BL13–BL17 sau BL23. Lasă greutatea corpului să facă presiunea, menține 30–60 de secunde și apoi mută ușor. Pentru fese, mingea pe punctul GB30 este un clasic. Rola de spumă este mai bună pentru mușchi mari (coapse, spate lombar) prin rulare lentă, dar nu rula direct pe regiunea lombară joasă dacă te doare.", "Covorașul cu proeminențe sau cu vârfuri: se stă 5–10 minute, începând cu o durată scurtă. Cercetările pe acest tip de dispozitive arată mai ales efecte de relaxare și de distragere, nu un mecanism special. Dacă apar vânătăi, roșeață persistentă sau durere ascuțită, reduci timpul sau renunți.", "Comparație cu masajul: acupresura aplică presiune locală, statică sau lentă, pe puncte cu sens tradițional; masajul lucrează pe grupuri de mușchi cu mișcări de alunecare, frământare și fricțiune. În practică, granița este neclară, iar studiile moderne arată că ambele reduc tensiunea și durerea cronică musculoscheletală într-o măsură modestă. Alegerea ține de preferință, accesibilitate și toleranță. Un masaj profesionist adaptează presiunea și poate depista probleme pe care autoîngrijirea nu le vede.", "Când nu: evită obiectele și presiunea intensă dacă ai osteoporoză severă, trombembolism sau tromboflebită, tulburări de coagulare sau anticoagulante (risc de hematom), infecții de piele, tumori neevaluate, febră, sarcină (zone abdominale și lombare, plus unele puncte), diabet cu neuropatie (sensibilitate redusă, risc de leziuni) sau durere inexplicabilă ori nocturnă. Nu folosi acest tip de autoîngrijire pe o zonă cu traumatism recent. În caz de dubii, cere sfatul medicului."], "cheie": ["Mingea, rola și covorașul permit presiune în zone greu accesibile, cu greutatea corpului.", "Plasează mingea lângă coloană, niciodată direct pe coloană sau pe regiunea lombară dureroasă.", "Efectul principal documentat este relaxarea; nu există un mecanism special al obiectelor.", "Masajul și acupresura se suprapun; alegerea ține de preferință și toleranță.", "Contraindicații: anticoagulante, tulburări de coagulare, osteoporoză severă, infecții cutanate, neuropatie diabetică."], "practica": "Stai cu spatele sprijinit de un perete și o minge de tenis între omoplat și coloană, în zona BL13. Lasă greutatea corpului pe minge 30 de secunde, respirând lent, apoi mută-te 2 cm. Fă maximum 3 minute pe o parte și oprește-te dacă ai furnicături sau durere ascuțită.", "puncte": ["BL13", "BL15", "BL17", "BL23", "GB30", "ST36"], "variante": ["mats", "trigger", "acupresura"], "intrebari": [{"q": "Unde se plasează mingea la autoacupresura spatelui?", "corect": "Lângă coloană, nu pe coloană", "gresite": ["Direct pe vertebre, pentru presiune maximă", "Pe coloana lombară dureroasă", "Pe ceafă, rulând forțat"], "explicatie": "Presiunea se aplică pe mușchii paravertebrali, nu pe oase, pentru a evita iritarea sau leziunile."}, {"q": "Care este o contraindicație importantă pentru presiune intensă cu obiecte?", "corect": "Tratamentul cu anticoagulante sau tulburări de coagulare", "gresite": ["Tensiune musculară ușoară", "Prima utilizare a mingii de tenis", "Pauze scurte între sesiuni"], "explicatie": "Anticoagulantele cresc riscul de hematoame după presiune intensă."}, {"q": "Cum se compară acupresura cu masajul în privința dovezilor?", "corect": "Ambele par să aibă efecte modeste asupra tensiunii și durerii cronice musculoscheletale", "gresite": ["Acupresura este dovedit superioară masajului", "Masajul nu are niciun efect măsurat", "Acupresura vindecă cauzele durerii cronice"], "explicatie": "Studiile arată efecte modeste pentru ambele; nu există dovezi că una o depășește clar pe cealaltă."}]}]}, {"id": "L5", "titlu": "Variante conexe", "descriere": "O privire critică asupra terapiilor înrudite cu acupunctura: moxibustia, ventuzele, masajele tradiționale, microsistemele și tehnologiile moderne. Pentru fiecare vezi ce susține tradiția și ce arată cercetarea.", "lectii": [{"id": "L5-1", "titlu": "Moxibustia, ventuzele și gua sha", "minute": 9, "text": ["Aceste trei practici folosesc căldura, aspirația sau răzuirea pe piele, nu ace. Sunt printre cele mai vechi tehnici ale medicinei tradiționale chineze și au echivalente în alte culturi. Fiecare are riscuri proprii de care trebuie să știi înainte de orice încercare.", "Moxibustia folosește frunze de Artemisia (pelin) arse aproape de puncte. Tradițional, se spune că „încălzește meridianele” și alungă „frigul”. Tipuri: moxa directă (un con mic pe piele, care poate lăsa cicatrice și se practică rar), moxa indirectă (cu strat de ghimbir, usturoi sau sare între con și piele), țigara de moxă ținută deasupra pielii și moxa în cutie. Riscul principal este arsura, apoi fumul, care poate irita căile respiratorii; spațiul trebuie aerisit. Se evită în caz de febră, pe piele lezată, pe față, în sarcină (zona abdomenului) și la persoane cu sensibilitate redusă. Dovezi: există studii pentru unele situații, cum ar fi întoarcerea fătului din prezentație pelviană, dar calitatea este variabilă și nu înlocuiește îngrijirea obstetricală.", "Ventuzele (cupping) creează vid, care ridică ușor pielea și țesuturile. Se disting ventuzele uscate (statice, glisante) și cele umede (hijama), unde se fac mici incizii superficiale și se extrage puțin sânge. Marcile circulare nu sunt vânătăi traumatice, dar pot dura zile. Ventuzele umede implică risc de infecție, inclusiv transmiterea virusurilor din sânge, dacă instrumentele nu sunt sterile, deci doar la profesioniști cu igienă strictă. Dovezile pentru durere sunt de calitate scăzută și afectate de lipsa unui control sham credibil.", "Gua sha este răzuirea pielii lubrifiate cu un obiect neted, până apar pete roșii (petechii). Tradițional se spune că „eliberează stagnarea”; modern se discută o creștere temporară a circulației locale. Evită-l pe piele lezată, cu erupții sau varice, în caz de anticoagulante, tulburări de coagulare sau boli de piele, și nu răzui deasupra zonei cu inflamații.", "Pentru cele trei, mesajul comun este: efectele pot fi reale la nivel de senzație de relaxare și ameliorare a durerii musculare, dar sunt greu de separat de expectativă și de contextul terapeutic, iar riscurile sunt reale. Alege practicieni formați și cere igiena instrumentelor."], "cheie": ["Moxa: tipuri directă, indirectă, țigară de moxă; riscul principal este arsura și fumul.", "Ventuzele umede (hijama) implică risc de infecție, deci doar în condiții sterile.", "Gua sha produce petechii; contraindicat la anticoagulante și piele lezată.", "Tradiția vorbește despre „frig”, „stagnare” și „Qi”; cercetarea modernă vorbește despre circulație locală și percepția durerii.", "Dovezile sunt în general de calitate scăzută, cu studii greu de legat de un control sham."], "practica": "Aplicație sigură fără foc sau aspirație: încălzește-ți mâinile și așază-le 2 minute peste zona lombară (peste haine), cu respirație lentă. Nu folosi moxă, ventuze sau gua sha acasă fără instruire și fără a verifica contraindicațiile cu un specialist.", "puncte": ["CV6", "ST36", "BL23", "GB21"], "variante": ["moxa-d", "moxa-i", "moxa-s", "vent-u", "hijama", "gua"], "intrebari": [{"q": "Care este riscul principal al moxibustiei?", "corect": "Arsurile și iritația cauzată de fum", "gresite": ["Hemoragia internă", "Pierderea permanentă a sensibilității", "Scăderea bruscă a tensiunii"], "explicatie": "Moxa implică ardere aproape de piele; arsurile și fumul sunt riscurile cele mai frecvente."}, {"q": "De ce este hijama (ventuzele umede) mai riscantă decât ventuzele uscate?", "corect": "Implică incizii superficiale, cu risc de infecție dacă igiena nu este strictă", "gresite": ["Folosește temperaturi foarte mari", "Aplică substanțe toxice pe piele", "Produce întotdeauna cicatrici adânci"], "explicatie": "Ruperea pielii și contactul cu sângele impun instrumente sterile și igienă strictă."}, {"q": "Ce descrie corect gua sha?", "corect": "Răzuirea pielii lubrifiate cu un obiect neted, care produce petechii", "gresite": ["Înțeparea pielii cu ace foarte fine", "Aplicarea de plante arse pe piele", "Aspirarea pielii cu o pompă de vid"], "explicatie": "Gua sha este o tehnică de răzuire; petechiile apar la presiune și pot dura câteva zile."}]}, {"id": "L5-2", "titlu": "Tuina, shiatsu, Nuad Thai și Marma", "minute": 9, "text": ["Multe culturi au dezvoltat sisteme de masaj terapeutic cu presiune pe puncte sau pe linii. Ele seamănă în mod evident cu acupresura, dar diferă prin istorie, teorie și stil. Vom compara patru: Tuina (China), Shiatsu (Japonia), Nuad Thai (Thailanda) și Marma (India, Ayurveda).", "Tuina („a împinge și a apuca”) face parte din MTC și folosește manevre variate: împingere, frământare, rulare, apăsare și mobilizări articulare. Se practică în spitale și clinici chineze, adesea pentru durere musculoscheletală și dureri cervicale. Teoria urmează meridianele, punctele și diagnosticul MTC.", "Shiatsu („presiune cu degetul”) s-a dezvoltat în Japonia în secolul XX, pornind din Anma, un masaj japonez mai vechi, cu influențe occidentale. Se lucrează de obicei îmbrăcat, pe saltea, cu presiune de palmă, degete mari și coate. Stilul Namikoshi pune accent pe anatomia occidentală, iar Zen Shiatsu (Masunaga) pe meridianele extinse și pe diagnostic prin palpare abdominală.", "Nuad Thai (masaj thailandez) combină presiuni lungi pe linii numite „Sen”, întinderi asistate și poziții asemănătoare yoga. Rădăcinile sunt atribuite tradiției budiste și ayurvedice; teoria folosește linii energetice (Sen), nu meridianele MTC. Este mai dinamic și solicită corpul prin întinderi.", "Marma provine din Ayurveda; marmele sunt puncte vitale, asociate cu structuri anatomice (articulații, vase, nervi), considerate în tradiție puncte unde „Prana” se acumulează. Terapia Marma folosește presiuni blânde, uneori cu uleiuri. Tradiția vorbește de 107 marme; apar aici asemănări cu acupunctura, dar teoria este diferită. Ce au în comun: toate lucrează cu presiune, au o teorie energetică și sunt, în practică, forme de masaj terapeutic. Ce diferă: concepția despre corp, stilul fizic și formarea practicienilor. Cercetarea asupra lor este limitată și de calitate variabilă; există dovezi modeste pentru reducerea durerii și a tensiunii cu masaj și manipulare moale, dar nu pentru teoria energetică. Tratează-le ca îngrijire de confort, cu aceleași precauții ca la acupresură."], "cheie": ["Tuina: sistem MTC cu manevre diverse, practicat în clinici chineze.", "Shiatsu: Japonia, presiune cu degetul mare/palma, stiluri Namikoshi și Zen Shiatsu.", "Nuad Thai: presiuni pe linii Sen plus întinderi asistate.", "Marma: puncte vitale ayurvedice, presiune blândă, teorie diferită de MTC.", "Teoriile energetice diferă; dovezile existente susțin mai ales beneficiile generale ale masajului."], "practica": "Alege o linie de pe antebraț, de la încheietură spre cot, și apasă ușor din 2 în 2 cm cu degetul mare, 5 secunde fiecare, în stil „presiune pe linie”. Respiră lent și oprește-te dacă apare durere. Nu efectua manevre de întindere forțată fără instruire.", "puncte": ["PC6", "LI10", "LI11", "TE5"], "variante": ["tuina", "shiatsu", "thai", "marma", "anma"], "intrebari": [{"q": "Care sistem folosește „linii Sen” și întinderi asistate?", "corect": "Nuad Thai", "gresite": ["Tuina", "Shiatsu", "Marma"], "explicatie": "Nuad Thai combină presiuni pe linii Sen cu întinderi și mobilizări."}, {"q": "Care este originea shiatsu?", "corect": "A pornit din Anma, un masaj japonez, și s-a dezvoltat în secolul XX", "gresite": ["Provine direct din Ayurveda", "Este varianta thailandeză a Tuina", "Este o tehnică modernă fără legătură cu tradițiile asiatice"], "explicatie": "Shiatsu s-a dezvoltat în Japonia pornind din Anma, cu influențe occidentale."}, {"q": "Ce arată cercetarea despre aceste masaje tradiționale?", "corect": "Dovezi modeste pentru durere și relaxare, fără sprijin pentru teoria energetică", "gresite": ["Dovezi clare că vindecă boli cronice", "Dovezi că sunt periculoase în orice condiții", "Dovezi că funcționează doar în cultura de origine"], "explicatie": "Studiile sunt puține și de calitate variabilă; beneficiile sunt asociate cu masajul în general, nu cu teoria energetică."}]}, {"id": "L5-3", "titlu": "Microsisteme: auriculoterapie, reflexologie și Dien Chan", "minute": 9, "text": ["Un microsistem este ideea că o parte mică a corpului (urechea, talpa, palma, fața) conține o „hartă” a întregului organism. Stimulând un punct de pe hartă, se spune că influențezi organul corespondent. Ideea este atractivă și simplă, dar trebuie examinată critic.", "Auriculoterapia: în MTC există puncte pe ureche încă din textele vechi. Harta modernă a urechii, ca un fetus cu capul în jos, a fost dezvoltată în anii 1950 de medicul francez Paul Nogier. Se folosesc ace mici, semințe de vaccaria, mici bile sau stimulare electrică. Protocoale cunoscute: NADA (dependențe și stres) și Battlefield Acupuncture (BFA), folosit în medicina militară pentru durere. Există studii care sugerează ameliorarea durerii, dar rezultatele sunt eterogene; pentru dependențe, dovezile din studii controlate sunt neconcludente.", "Reflexologia plantară și palmară pornește de la ideea că zone din talpă sau palmă corespund organelor. Practicanții masează „zonele reflexe”. Istoric, ideea s-a răspândit în Occident în secolul XX (William Fitzgerald, Eunice Ingham). Studiile arată în general că reflexologia poate reduce anxietatea și poate crește confortul, dar nu există dovezi robuste că diagnosticarea unor boli din talpă este posibilă sau că tratează boli ale organelor interne. Studiile de calitate înaltă sunt puține.", "Dien Chan este o metodă vietnameză creată de Bui Quoc Chau în anii 1980, care folosește fața ca hartă reflexă, cu bastoane și rulouri. Tradiția susține corespondențe între puncte faciale și organe, dar acest sistem este recent, nu are rădăcini clasice documentate, iar studiile clinice de calitate sunt, din câte știm, absente sau foarte puține.", "Cum le privim: distinge între ce spune tradiția (harta funcționează, deci ai putea trata un organ prin ureche, talpă sau față), ce arată cercetarea (efecte posibile asupra durerii, relaxării și confortului, dar harta nu este validată) și ce nu se poate afirma (diagnostic prin reflexe, vindecare de boli). Cea mai onestă concluzie: pot fi plăcute și relaxante, dar nu le folosi în locul diagnosticului sau al tratamentului medical."], "cheie": ["Microsistem înseamnă ideea unei „hărți” a corpului pe o parte mică (ureche, talpă, palmă, față).", "Harta urechii moderne datează din anii 1950 (Nogier); NADA și BFA sunt protocoale de auriculoterapie.", "Reflexologia: dovezi pentru relaxare și confort, nu pentru diagnostic sau tratarea organelor.", "Dien Chan este o metodă recentă (anii 1980), fără dovezi clinice solide.", "Distinge întotdeauna afirmația tradițională de rezultatul studiilor."], "practica": "Masează-ți 2 minute talpa cu degetele mari, cu presiune moale, în jurul zonei KI1 (aproximativ unde se unesc treimea anterioară și mijlocie a tălpii), respirând lent. Scopul este relaxarea; nu urmări „corespondențe cu organe”. Evită dacă ai răni, infecții sau tromboză la picior.", "puncte": ["KI1", "GV20", "EX-HN3"], "variante": ["aur", "bfa", "nada", "refl-t", "refl-p", "dien"], "intrebari": [{"q": "Ce susține ideea unui microsistem?", "corect": "O parte mică a corpului ar conține o hartă a întregului organism", "gresite": ["Fiecare organ are un singur punct de acupunctură", "Boala poate fi diagnosticată doar prin ureche", "Presiunea se transmite întotdeauna direct organului"], "explicatie": "Microsistemul este un concept de corespondență; validitatea hărților nu este demonstrată."}, {"q": "Ce arată în general cercetarea despre reflexologie?", "corect": "Posibile efecte de relaxare și confort, fără dovezi robuste pentru tratarea bolilor organelor", "gresite": ["Eficacitate clară în boli de ficat și rinichi", "Eficacitate demonstrată doar în diabet", "Riscuri majore în orice situație"], "explicatie": "Beneficiile raportate sunt legate de relaxare; nu există dovezi robuste pentru afecțiuni ale organelor interne."}, {"q": "Ce se poate spune corect despre Dien Chan?", "corect": "Este o metodă recentă, creată în anii 1980, fără dovezi clinice solide", "gresite": ["Este o tehnică din textele clasice chineze", "A fost validată prin numeroase studii randomizate", "Este varianta oficială a auriculoterapiei"], "explicatie": "Dien Chan a fost creat de Bui Quoc Chau; lipsesc rădăcini clasice și studii clinice de calitate."}]}, {"id": "L5-4", "titlu": "Tehnologii: laser, TENS/TEAS, electroacupunctură, brățări P6", "minute": 9, "text": ["Tehnologia a adus puncte de acupunctură în aparate: laser, curent electric, magneți, brățări. Întrebarea corectă este mereu aceeași: există studii bine controlate care arată ceva dincolo de placebo?", "Electroacupunctura conectează ace la un aparat care trimite impulsuri electrice mici. Este folosită în clinici pentru durere și în cercetare, unde permite standardizarea stimulării. Beneficiile sunt similare cu cele ale acupuncturii clasice în multe studii, cu aceleași limite de dovezi. Se evită la persoane cu stimulator cardiac sau epilepsie necontrolată, fără acordul medicului.", "TENS (stimulare electrică nervoasă transcutanată) folosește electrozi pe piele și curenți mici, pentru durere. TEAS este varianta aplicată pe puncte de acupunctură. Pentru TENS există dovezi mixte: unele studii susțin beneficii în durere, în special în anumite afecțiuni, dar calitatea studiilor este variabilă și efectul poate fi mic. Pentru TEAS, studiile din perioada perioperatorie și din alte contexte sunt promițătoare, dar eterogene. Contraindicații: stimulator cardiac, sarcină (regiuni specifice), piele lezată, zone cu pierdere de sensibilitate.", "Laserpunctura folosește lumină laser de nivel scăzut, fără înțepare. Este atractivă pentru copii. Dovezile sunt amestecate: doze, lungimi de undă și durate variază mult între studii, ceea ce face comparațiile dificile. Unele studii sugerează un beneficiu în durere, dar sinteza concluziilor este prudentă. Aparatele necertificate pot fi ineficiente sau periculoase pentru ochi; nu privi în fascicul.", "Brățările P6: brățările cu un nasture care apasă pe PC6 sau brățările electrice sunt vândute pentru rău de mișcare și greață. Sinteza Cochrane 2015 (Lee și colab.) a evaluat stimularea PC6 prin mai multe metode, inclusiv acupresura, pentru greața postoperatorie, cu dovezi de calitate limitată, iar rezultatele nu pot fi extrapolate automat la orice brățară sau la orice situație. Pentru rău de mișcare, dovezile sunt mai slabe. Riscurile sunt reduse, dar costul și așteptările exagerate pot fi o problemă. Regulă generală: o tehnologie nu devine mai eficientă doar pentru că arată științific. Caută studii randomizate, cu control sham, dimensiune adecvată, rezultate replicate. Dacă apar promisiuni de vindecare, fii sceptic."], "cheie": ["Electroacupunctura: ace plus curent; același nivel de dovezi ca acupunctura, cu precauții la stimulator cardiac.", "TENS/TEAS: dovezi mixte; efectul poate fi mic; contraindicate la stimulator cardiac.", "Laserpunctura: protocoale foarte diferite, dovezi amestecate; protejează ochii.", "Brățările P6: bazate pe PC6, dovezile pentru greață sunt limitate și nu se aplică automat oricărei brățări.", "Aspectul tehnologic nu înseamnă eficacitate; contează studiile controlate."], "practica": "Dacă ai o brățară P6, verifică poziția: butonul trebuie să stea pe PC6, trei lățimi de deget deasupra pliului încheieturii, între tendoane. Poartă-o în confort, fără să oprești circulația; scoate-o dacă apare roșeață. Notează în jurnal dacă observi o diferență, fără a renunța la tratamentul recomandat.", "puncte": ["PC6", "LI4", "ST36"], "variante": ["laser", "teas", "ea", "band"], "intrebari": [{"q": "Ce persoane trebuie să evite electroacupunctura și TENS fără aviz medical?", "corect": "Cele cu stimulator cardiac", "gresite": ["Cele care citesc mult", "Cele cu pielea sănătoasă", "Cele fără alergii"], "explicatie": "Curentul poate interfera cu dispozitivele implantate; avizul medicului este necesar."}, {"q": "Ce limită principală au studiile despre laserpunctură?", "corect": "Dozele, lungimile de undă și duratele diferă mult, ceea ce face comparațiile dificile", "gresite": ["Nu există niciun studiu publicat", "Toate studiile arată vindecare completă", "Laserul nu a fost niciodată testat pe puncte"], "explicatie": "Eterogenitatea protocoalelor face greu de tras concluzii generale."}, {"q": "Ce arată sinteza Cochrane 2015 despre stimularea PC6?", "corect": "Dovezi de calitate limitată în greața postoperatorie, nu pentru orice brățară sau situație", "gresite": ["Dovezi de calitate înaltă pentru orice brățară din comerț", "Dovezi că brățările electrice vindecă rău de mișcare", "Dovezi că PC6 este mai bun decât orice medicament"], "explicatie": "Sinteza a evaluat stimularea PC6 în greața postoperatorie; nu confirmă toate produsele sau indicațiile."}]}]}, {"id": "L6", "titlu": "Dovezi, cercetare și practică responsabilă", "descriere": "Învață să citești critic un studiu, să înțelegi ce spun sintezele și ghidurile, să alegi un practicant calificat și să recunoști pseudoștiința fără a închide mintea.", "lectii": [{"id": "L6-1", "titlu": "Cum citești un studiu clinic", "minute": 9, "text": ["Când auzi „studiile arată că…”, merită să știi ce fel de studiu este și ce poate demonstra. Acupunctura este o provocare specială, pentru că terapeutul știe ce face și pacientul simte ceva, deci „orbirea” este dificilă.", "Randomizarea înseamnă că participanții sunt repartizați la întâmplare în grupuri, pentru ca diferențele dintre grupuri să nu explice rezultatul. Alocarea ascunsă împiedică cercetătorii să influențeze cine ajunge unde. Fără randomizare, un grup poate fi mai tânăr sau mai motivat, iar rezultatul poate fi înșelător.", "Placebo este un tratament fără mecanism activ, care poate totuși ameliora simptomele prin așteptare, atenție și context. În acupunctură se folosește „sham” (simulare): ace care nu pătrund (ace retractabile Streitberger) sau înțepare în puncte „greșite”. Problema: și acupunctura sham poate stimula pielea, deci poate avea un efect propriu. Dacă diferența dintre acupunctura reală și sham este mică, există două interpretări: fie punctul exact nu contează mult, fie contează, dar sham-ul nu e inert. De aceea, mai multe tipuri de comparații sunt utile: acupunctură vs. sham, vs. fără tratament și vs. tratament standard.", "Mărimea efectului arată cât de mare este diferența, nu doar dacă este „semnificativă statistic”. Un efect poate fi sigur (p mic), dar neimportant pentru pacient. Se folosesc diferențe medii pe scale de durere (de exemplu 0–10), diferențe standardizate (unde 0,2 este mic, 0,5 mediu, 0,8 mare) și diferența minimă importantă clinic. În sinteza lui Vickers și colab. (2018, J Pain), pe date individuale din 39 de studii, acupunctura a fost mai bună decât lipsa tratamentului cu o diferență mai mare și decât sham cu o diferență mică, ceea ce arată că o parte din beneficiu ține de context.", "Alte aspecte: mărimea eșantionului, abandonurile, durata urmăririi, conflictele de interese, replicarea. O sinteză sistematică (meta-analiză) reunește studiile, dar rezultatul depinde de calitatea lor. Scala GRADE descrie încrederea în dovezi (înaltă, moderată, scăzută, foarte scăzută). Un rezultat izolat nu este o dovadă."], "cheie": ["Randomizarea și alocarea ascunsă reduc diferențele sistematice dintre grupuri.", "Sham-ul nu este întotdeauna inert, ceea ce complică interpretarea.", "Mărimea efectului contează mai mult decât semnificația statistică singură.", "În durerea cronică, efectul față de sham este mic, iar față de lipsa tratamentului este mai mare (Vickers, 2018).", "Încrederea în dovezi se descrie prin GRADE: înaltă, moderată, scăzută, foarte scăzută."], "practica": "Alege un titlu de știre despre o terapie și răspunde la cinci întrebări: Ce tip de studi
