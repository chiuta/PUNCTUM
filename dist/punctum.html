lombalgie¦Lombalgie cronică¦Durere¦Durere în zona lombară care persistă peste 12 săptămâni, de obicei fără o leziune gravă identificabilă. Este una dintre cele mai frecvente cauze de dizabilitate la adulți.¦BL23,GV4,BL25,BL40,GB30¦Apasă ferm dar confortabil, cu degetele mari sau cu o minge de tenis, 45–90 s pe punct, pe ambele părți unde este cazul. Repetă o dată sau de două ori pe zi; presiunea trebuie să fie de tip „durere bună”, nu ascuțită.¦acupresura,moxa-s,tuina,trigger,tdp¦Mișcare ușoară regulată (mers, înot), evitarea repausului prelungit la pat, pauze de ridicare din scaun la 30–45 minute, căldură locală, somn pe o saltea suficient de fermă.¦Mergi la medic de urgență la: slăbiciune sau amorțeală la picior, amorțeală în zona șezutului/inghinală, pierderea controlului vezicii sau intestinului, febră, durere după un accident, durere nocturnă care nu cedează, pierdere inexplicabilă în greutate, istoric de cancer. În sarcină nu folosi GB30 și BL60 și întreabă medicul.¦m: Pentru lombalgia cronică acupunctura (cu ace) are dovezi de nivel moderat pentru reducerea durerii pe termen scurt, o parte din efect fiind nespecific. Pentru acupresura singură dovezile sunt mai slabe; poate aduce relaxare și confort alături de mișcare și exerciții.
cervicalgie¦Durere cervicală (ceafă)¦Durere¦Durere și rigiditate în zona cefei, adesea legată de postura la birou, stres sau somn într-o poziție incomodă.¦GB20,GB21,SI3,SI11,BL10¦Masează cu degetele mari, 30–60 s pe punct, cu presiune medie și respirație lentă; evită presiunea puternică pe partea laterală și anterioară a gâtului, unde trec arterele. Poți face sesiunea de 1–2 ori pe zi, combinată cu înclinări lente ale capului.¦acupresura,tuina,trigger,vent-u,tdp¦Pauze de mișcare la 30–40 minute, ecranul la nivelul ochilor, perna care menține gâtul în ax, căldură umedă, exerciții de mobilitate cervicală blânde.¦Urgență: durere cervicală după traumatism sau cădere, durere cu febră și gât țeapăn, cefalee bruscă severă, slăbiciune sau furnicături în braț/mână, tulburări de vedere sau vorbire, amețeală severă, durere toracică. Nu forța manevre de „pocnire” a gâtului. În sarcină omite GB21.¦l: Pentru durerea cervicală acupunctura și masajul au dovezi limitate până la moderate pentru ameliorare pe termen scurt; acupresura aduce în principal relaxare musculară și confort.
umar¦Durere de umăr¦Durere¦Durere în zona umărului, adesea legată de suprasolicitarea tendoanelor sau a mușchilor, cu limitarea mișcărilor peste cap.¦LI15,TE14,SI11,LI11¦Apasă ușor-mediu 30–60 s pe fiecare punct, cu mici cercuri, pe umărul afectat. Alternează cu mișcări lente, în limita confortului, de 1–2 ori pe zi.¦acupresura,tuina,trigger,dry,tdp¦Menține mobilitatea prin mișcări pendulare ușoare, evită ridicările repetitive deasupra capului, aplică căldură și fă exerciții de întărire recomandate de kinetoterapeut.¦Urgență: durere de umăr cu durere toracică, dispnee sau transpirații (posibil cardiac), după o căzătură cu deformare, febră, umăr roșu și cald, pierderea bruscă a forței brațului. Mergi la medic și dacă durerea persistă peste câteva săptămâni sau te trezește noaptea.¦l: Pentru durerea de umăr există dovezi limitate că acupunctura ajută pe termen scurt; acupresura rămâne un adjuvant de confort, nu un tratament al leziunii.
epicondilita¦Epicondilită (cot de tenismen)¦Durere¦Durere la nivelul feței externe a cotului, agravată de prinderea obiectelor și de mișcările repetitive ale încheieturii.¦LI11,LI10,TE5,LU5,LI4¦Apasă mediu 30–60 s pe punctele de pe antebraț și în jurul cotului, evitând zona cea mai dureroasă la început. Repetă de 1–2 ori pe zi și combină cu odihna relativă a brațului.¦acupresura,trigger,dry,tuina,tdp¦Reducerea mișcărilor repetitive, exerciții de întindere și de întărire excentrică ghidate de kinetoterapeut, gheață 10 minute după efort, ergonomie la mouse și unelte. În sarcină omite LI4.¦Mergi la medic dacă ai: umflătură marcată, deformare după traumatism, febră, roșeață și căldură la cot, amorțeală sau slăbiciune a mâinii, durere nocturnă intensă sau care nu se ameliorează în câteva săptămâni.¦l: Dovezile pentru acupunctură în durerea de cot sunt limitate și de calitate modestă; acupresura poate oferi confort pe termen scurt, ca adjuvant la exerciții.
tunel-carpian¦Sindrom de tunel carpian (simptome ușoare)¦Durere¦Furnicături, amorțeală sau durere la nivelul degetelor 1–3, mai ales noaptea, prin compresia nervului median la încheietură.¦PC6,PC7,TE5,LI4¦Apasă ușor-mediu 30–60 s pe punctele de la încheietură, fără presiune pe zona amorțită. Pune încheietura în poziție neutră și repetă de 1–2 ori pe zi.¦acupresura,laser,teas,tuina,acu-cl¦Orteză de noapte în poziție neutră, pauze la activitățile repetitive, ergonomie la tastatură, scuturarea ușoară a mâinii, evaluare a cauzelor (diabet, tiroidă, sarcină).¦Mergi la medic dacă ai: slăbiciune sau pierderea forței de prindere, atrofia mușchilor de la baza degetului mare, amorțeală permanentă, simptome după traumatism, simptome bilaterale cu umflături sau alte semne generale. Netratat mult timp, nervul poate fi lezat durabil. În sarcină omite LI4.¦l: Pentru simptome ușoare până la moderate, acupunctura și laserpunctura au dovezi limitate privind ameliorarea durerii; acupresura singură nu are dovezi solide, dar poate fi un adjuvant la orteză.
gonalgie¦Durere de genunchi (gonartroză)¦Durere¦Durere de genunchi legată de uzura articulară (artroză), cu rigiditate matinală scurtă și agravare la efort.¦ST34,ST36,SP9,GB34,EX-LE10¦Apasă mediu 30–60 s pe punctele din jurul genunchiului și de pe gambă, evitând umflăturile sau articulația inflamată. Poți aplica și căldură blândă; repetă zilnic.¦acupresura,moxa-s,tdp,tuina,acu-cl¦Mers regulat, exerciții de întărire a cvadricepsului, scădere în greutate dacă este cazul, încălțăminte potrivită, căldură pentru rigiditate, evitarea genuflexiunilor profunde.¦Mergi la medic dacă genunchiul este brusc umflat, roșu, fierbinte, dacă ai febră, dacă nu poți călca pe picior sau după o lovitură/torsiune cu instabilitate. Durerea de gambă cu umflătură poate indica tromboză: urgență. Nu apăsa peste vene varicoase severe.¦m: Pentru artroza de genunchi, acupunctura (cu ace) are dovezi moderate de ameliorare a durerii pe termen scurt, o parte din efect fiind nespecific. Pentru acupresură dovezile sunt limitate.
sciatalgie¦Sciatalgie (durere pe traiectul sciaticului)¦Durere¦Durere care coboară din zona lombară sau a șezutului pe partea posterioară a coapsei și gambei, uneori cu furnicături.¦BL25,GB30,BL40,GB34,BL57¦Apasă mediu 30–60 s la nivelul fesei și pe spatele piciorului, fără a presa direct pe zonele foarte sensibile sau amorțite. Repetă o dată sau de două ori pe zi.¦acupresura,moxa-s,tuina,trigger,tdp¦Mers ușor, evită stat prelungit pe scaun, întinderi blânde ale spatelui și coapsei, schimbarea frecventă a poziției, căldură locală, ridicarea corectă a greutăților.¦Urgență: slăbiciune a piciorului, amorțeală în zona șezutului sau inghinală, pierderea controlului vezicii/intestinului, durere după traumatism, febră, durere nocturnă constantă. Mergi la medic și dacă durerea durează peste 6 săptămâni. În sarcină omite GB30.¦l: Studiile despre acupunctură în sciatalgie sunt de calitate variabilă, cu dovezi limitate privind ameliorarea durerii; acupresura este un adjuvant de confort.
fasciita-plantara¦Durere de călcâi (fasciită plantară)¦Durere¦Durere la baza călcâiului, mai intensă la primii pași dimineața, prin suprasolicitarea fasciei plantare.¦BL57,BL60,KI3,GB34¦Apasă mediu 30–60 s pe punctele de pe gambă și de lângă glezne; poți masa tălpa cu o minge mică rulată sub picior. Repetă zilnic, seara și după efort.¦acupresura,mats,refl-t,trigger,tdp¦Încălțăminte cu amortizare și sprijin, întinderi ale gambei și fasciei, scăderea în greutate, evitarea mersului desculț pe suprafețe dure, rularea tălpii pe o sticlă cu apă rece. În sarcină omite BL60.¦Mergi la medic dacă ai durere severă după o lovitură, nu poți călca pe picior, ai umflătură marcată, roșeață și căldură sau febră, ori durerea persistă peste câteva luni în ciuda măsurilor.¦l: Dovezile pentru acupunctură în fasciita plantară sunt limitate; acupresura și masajul tălpii pot ameliora confortul, ca adjuvant la întinderi.
fibromialgie¦Fibromialgie (confort)¦Durere¦Durere difuză cronică, însoțită de oboseală și somn neodihnitor. Diagnosticul și tratamentul aparțin medicului.¦GV20,LR3,LI4,GB34,ST36,HT7¦Presiune blândă 30–60 s pe punct, cu respirație lentă, într-un loc liniștit; evită presiunea puternică, care poate accentua durerea. Poți face sesiuni scurte, de 5–10 minute, o dată pe zi.¦acupresura,doin,qigong,tuina,tdp¦Mișcare aerobă blândă (mers, înot, tai-chi), program regulat de somn, gestionarea stresului, încălzire înainte de efort, ritm gradat al activităților.¦Diagnosticul trebuie confirmat de medic. Mergi la medic dacă apar: febră, pierdere în greutate, slăbiciune musculară reală, articulații umflate, durere toracică, gânduri de a-ți face rău. În sarcină omite LI4.¦m: Pentru fibromialgie acupunctura și mișcarea blândă (tai-chi, qigong) au dovezi de nivel redus până la moderat privind durerea și somnul; acupresura este în principal un adjuvant de relaxare.
atm¦Durere de maxilar (ATM)¦Durere¦Durere sau trosnituri la articulația temporo-mandibulară, adesea legată de strângerea dinților, bruxism sau stres.¦ST6,ST7,SI19,TE17,LI4¦Masează cu degetele cercuri mici în fața urechii și pe mușchiul maseter, 30–60 s, cu presiune ușoară-medie și maxilarul relaxat. Repetă seara și dimineața.¦acupresura,tuina,trigger,dry,tdp¦Evită mestecatul de gumă și alimentele foarte tari, comprese calde, relaxarea maxilarului în timpul zilei, discută cu stomatologul despre gutieră de noapte, tehnici de reducere a stresului. În sarcină omite LI4.¦Mergi la medic/stomatolog dacă maxilarul se blochează, nu poți deschide gura, durerea apare după lovitură, ai febră, umflătură, durere toracică sau durere care iradiază în braț/gât (poate fi cardiacă).¦l: Pentru durerea ATM acupunctura are dovezi limitate; masajul și relaxarea pot ajuta, dar tratamentul stomatologic rămâne de bază.
greata¦Greață (generală) și rău după mese¦Digestiv¦Senzație de rău în stomac, cu sau fără vărsături, de cauze variate (infecții ușoare, mese grele, stres, tratamente).¦PC6,ST36,CV12¦Apasă ferm dar confortabil PC6 pe fiecare încheietură, 60–90 s, cu respirație lentă; apoi CV12 și ST36 30–60 s. Poți folosi și brățări de acupresură; repetă la nevoie.¦acupresura,band,compresa,moxa-s¦Mese mici și dese, evită mirosurile puternice și alimentele grase, hidratare cu înghițituri mici, ghimbir, aer curat.¦Mergi la medic de urgență la: vărsături cu sânge sau culoare „zaț de cafea”, durere abdominală intensă, febră mare, semne de deshidratare, vărsături persistente peste 24 ore (peste 12 ore la copii), cefalee severă sau gât țeapăn, durere toracică, sarcină cu vărsături repetate.¦m: PC6 este punctul cu cele mai bune dovezi: revizuirile Cochrane arată un efect modest asupra greței postoperatorii și a celei induse de chimioterapie, comparativ cu placebo. Pentru alte cauze dovezile sunt limitate.
dispepsie¦Dispepsie (stomac greu, arsuri ușoare)¦Digestiv¦Disconfort în partea superioară a abdomenului: sațietate rapidă, balonare, senzație de greutate după mese.¦CV12,ST36,PC6,SP4,LR3¦Masează ușor CV12 cu cercuri mici, 60 s, apoi ST36, PC6 și celelalte puncte, 30–60 s, cu respirație lentă. Fă-o la 1–2 ore după masă, nu imediat.¦acupresura,moxa-s,compresa,tuina,shiatsu¦Mese mai mici și mai rare, mestecat lent, evită alcoolul, fumatul și mesele târzii, plimbare ușoară după masă, reducerea stresului.¦Mergi la medic dacă ai: dificultăți la înghițire, vărsături repetate, scaune negre sau sânge în vărsături, pierdere în greutate neexplicată, anemie, durere care te trezește noaptea, vârsta peste 50 de ani cu simptome noi, durere toracică.¦l: Există dovezi limitate pentru acupunctură/acupresură în dispepsia funcțională; efectul aparent este mic. Rămâne un adjuvant de confort alături de modificările alimentare.
constipatie¦Constipație funcțională¦Digestiv¦Scaune rare sau dificile, de obicei legate de dietă săracă în fibre, hidratare insuficientă sau sedentarism.¦ST25,LI4,LI11,ST36,SP6¦Masează cu mișcări circulare, în sensul acelor de ceasornic, în jurul ombilicului (ST25) 60–90 s, apoi apasă ușor LI4, LI11 și ST36 30–60 s. Fă-o dimineața, la 20–30 min după masă.¦acupresura,tuina,shiatsu,refl-t,compresa¦Fibre (legume, fructe, cereale integrale), 1,5–2 litri de lichide pe zi, mers zilnic, rutină regulată la toaletă, nu amâna nevoia de scaun. În sarcină omite LI4 și SP6.¦Mergi la medic dacă ai: sânge în scaun, scaune negre, pierdere în greutate neexplicată, durere abdominală intensă cu balonare și lipsa gazelor (posibil ileus), vârsta peste 50 de ani cu schimbare recentă a tranzitului, constipație nouă și persistentă.¦l: Dovezile pentru acupunctură/acupresură în constipația cronică sunt limitate și heterogene; automasajul abdominal poate ajuta la confort, alături de fibre și hidratare.
diaree¦Diaree ușoară și disconfort intestinal¦Digestiv¦Scaune moi frecvente de scurtă durată, de obicei după o infecție ușoară sau o greșeală alimentară.¦ST25,ST36,CV6,SP9¦Masează ușor în jurul ombilicului și apasă blând ST36 și SP9, 30–60 s, o dată sau de două ori. Căldura blândă pe abdomen poate ajuta; presiunea nu trebuie să fie dureroasă.¦acupresura,moxa-s,compresa,tdp¦Prioritar: hidratare cu soluții de rehidratare orală, alimentație ușoară (orez, banane, supă), evită alcoolul și lactatele grele, igiena mâinilor.¦Mergi la medic dacă diareea persistă peste 2 zile la adulți (peste 24 de ore la copii mici și vârstnici), ai sânge sau mucus în scaun, febră mare, semne de deshidratare (sete, urină puțină, amețeală), durere abdominală severă, revenire dintr-o călătorie în zone tropicale.¦x: Nu există dovezi că acupresura tratează diareea infecțioasă; hidratarea este esențială. Masajul și căldura pot oferi doar confort.
colon-iritabil¦Sindromul colonului iritabil (confort)¦Digestiv¦Dureri abdominale recurente asociate cu balonare și modificări ale tranzitului, fără o leziune organică identificată.¦ST25,ST36,CV12,LR3,SP4¦Masaj abdominal blând în sens orar, 60–90 s, apoi presiune ușoară-medie pe ST36, LR3 și SP4, 30–60 s. Practică zilnic, seara, în stare de relaxare.¦acupresura,moxa-s,shiatsu,tuina,compresa¦Jurnal alimentar pentru identificarea declanșatorilor, mese regulate, dietă adaptată (ex. FODMAP, cu sprijin medical), mișcare, tehnici de relaxare, somn suficient.¦Mergi la medic dacă ai: sânge în scaun, pierdere în greutate, febră, anemie, durere nocturnă, diaree severă, simptome noi după 50 de ani, istoric familial de cancer colorectal sau boli inflamatorii intestinale.¦l: Dovezile pentru acupunctură în colonul iritabil sunt limitate și inconsistente; acupresura și relaxarea pot reduce stresul asociat simptomelor, ca adjuvant.
reflux¦Reflux gastro-esofagian (arsuri)¦Digestiv¦Senzație de arsură retrosternală sau gust acid, mai ales după mese sau noaptea, la întins.¦CV12,PC6,ST36,LR3¦Masează ușor CV12 și apasă PC6, ST36 și LR3 30–60 s, la distanță de masă (nu imediat după). Presiunea trebuie să fie blândă, nu pe stomacul plin.¦acupresura,band,shiatsu,compresa¦Mese mici, nu te întinde 2–3 ore după masă, ridică capul patului, evită alcoolul, cafeaua, mesele grase și fumatul, slăbește dacă este cazul.¦Durerea toracică nu trebuie atribuită automat refluxului: sună la 112 pentru durere toracică cu transpirații, dispnee, durere în braț/maxilar. Mergi la medic dacă ai: dificultăți la înghițire, vărsături cu sânge, scaune negre, pierdere în greutate, simptome peste 3 săptămâni sau care nu cedează la tratament.¦w: Dovezile pentru acupunctură/acupresură în reflux sunt slabe; măsurile de stil de viață și tratamentul medical rămân de bază.
balonare¦Balonare și gaze¦Digestiv¦Senzație de abdomen umflat și plin, cu gaze, de cauze alimentare sau legate de stres.¦ST25,CV12,ST36,SP4¦Masaj circular blând în sensul acelor de ceasornic în jurul ombilicului, 60–90 s, apoi apasă ST36 și SP4 30–60 s. Nu presa puternic pe abdomen plin.¦acupresura,shiatsu,tuina,compresa,moxa-s¦Mestecat lent, evită băuturile acidulate și mâncatul în grabă, plimbare scurtă după masă, ceaiuri de mentă sau fenicul, observarea alimentelor care te deranjează.¦Mergi la medic dacă balonarea este persistentă și nouă, ai durere abdominală severă, vărsături, lipsa gazelor și a scaunului, sânge în scaun, pierdere în greutate, febră sau abdomen foarte rigid sau dureros.¦l: Nu există studii solide specifice; automasajul abdominal poate aduce confort și relaxare, dar nu corectează cauza balonării.
sughit¦Sughiț persistent minor¦Digestiv¦Spasme ale diafragmei, de obicei trecătoare, după mese rapide, băuturi acidulate sau emoții.¦PC6,CV22,BL17,GV26¦Apasă ferm PC6 pe încheietură 60 s, cu respirație lentă; apoi apasă ușor CV22 (la baza gâtului, fără presiune pe gât) și masează BL17 30–60 s. Oprește dacă apare disconfort.¦acupresura,band,eft¦Respirație lentă, înghițituri mici de apă, ținerea scurtă a respirației, evită băuturile acidulate și mesele în grabă.¦Mergi la medic dacă sughițul durează peste 48 de ore, te împiedică să mănânci sau să dormi, apare cu durere toracică, dificultăți de vorbire, slăbiciune sau după un accident vascular.¦x: Nu există dovezi solide; sughițul trecător dispare de obicei singur, iar acupresura poate fi o metodă de distragere și respirație.
raceala¦Răceală și nas înfundat¦Respirator¦Infecție virală ușoară a căilor respiratorii superioare, cu nas înfundat, strănut și gât iritat.¦LI20,EX-HN3,LU7,GB20,LI4¦Masează ușor LI20 (lângă nări) și EX-HN3 30–60 s, apoi LU7, GB20 și LI4. Poți face sesiunea de 2–3 ori pe zi cât timp ai simptome.¦acupresura,moxa-s,gua,compresa,tdp¦Odihnă, lichide calde, umidificarea aerului, spălarea nasului cu ser fiziologic, igiena mâinilor. În sarcină omite LI4.¦Mergi la medic dacă ai: febră peste 39 °C sau mai mult de 3 zile, dificultăți de respirație, durere toracică, durere de gât severă cu dificultăți la înghițire, simptome care se agravează după 7–10 zile, la sugari sub 3 luni orice febră.¦l: Nu există dovezi solide că acupresura scurtează răceala; poate ameliora senzația de congestie nazală și confortul.
rinita-alergica¦Rinită alergică (sezonieră)¦Respirator¦Strănut, nas înfundat sau curgător, mâncărimi la nas și ochi, de obicei legate de polen, praf sau animale.¦LI20,LI4,EX-HN3,GB20,LU7¦Apasă ușor LI20 și EX-HN3, apoi LI4 și GB20 30–60 s. Poți face sesiunea de 1–2 ori pe zi în sezonul de polen.¦acupresura,acu-cl,moxa-s,gua¦Evită alergenul, spală nasul cu ser, închide geamurile în perioadele cu polen, spală hainele și părul după expunere, discută cu medicul despre tratament.¦Urgență: dificultăți de respirație, umflarea buzelor/limbii/gâtului, respirație șuierătoare, amețeală severă după expunere (posibilă anafilaxie). Mergi la medic dacă simptomele nu se controlează sau apar crize de astm. În sarcină omite LI4.¦m: Pentru rinita alergică, acupunctura (cu ace) are dovezi moderate de ameliorare a simptomelor în studii mici; pentru acupresură dovezile sunt limitate.
sinuzita¦Congestie sinusală (sinuzită ușoară)¦Respirator¦Presiune și durere în zona frunții și obrajilor, cu nas înfundat, de obicei după o răceală sau alergie.¦LI20,EX-HN3,EX-HN5,GB20,LI4¦Presiune ușoară 30–60 s în jurul nasului și între sprâncene, apoi pe tâmple și la baza craniului. Se poate combina cu o compresă caldă pe față.¦acupresura,compresa,gua,tdp,moxa-s¦Spălături nazale cu ser fiziologic, inhalații de abur cu prudență, hidratare, odihnă, umidificarea aerului. În sarcină omite LI4.¦Mergi la medic dacă ai: febră mare, durere sau umflătură în jurul ochiului, tulburări de vedere, cefalee severă sau gât țeapăn, simptome peste 10 zile fără ameliorare, secreții purulente persistente.¦l: Dovezile pentru acupunctură în sinuzita cronică sunt limitate; acupresura poate ameliora senzația de presiune, fără a trata infecția.
tuse¦Tuse iritativă¦Respirator¦Tuse uscată sau iritativă, după o infecție respiratorie sau din cauza iritanților, fără semne severe.¦LU7,LU9,BL13,CV17,EX-B1¦Masează ușor CV17 (mijlocul pieptului) 30–60 s, apoi apasă LU7, LU9 și BL13/EX-B1 (pe spate, dacă ajunge cineva). Presiune blândă, o dată sau de două ori pe zi.¦acupresura,gua,vent-u,moxa-s,compresa¦Hidratare, miere (la persoane peste 1 an), umidificarea aerului, evitarea fumului și a iritanților, odihnă vocală.¦Mergi la medic dacă ai: tuse peste 3 săptămâni, sânge în spută, dificultăți de respirație, febră mare, durere toracică, respirație șuierătoare, tuse la sugar sau copil mic cu respirație rapidă, pierdere în greutate.¦w: Nu există dovezi solide că acupresura ameliorează tusea; poate fi folosită ca măsură de relaxare. Cauza persistentă trebuie investigată.
astm¦Astm bronșic (doar ca adjuvant)¦Respirator¦Boală cronică a căilor respiratorii cu episoade de tuse, șuierat și dificultăți de respirație. Se tratează medical.¦LU9,BL13,EX-B1,CV17,ST36¦Poate fi folosită doar ca relaxare, între crize, cu presiune blândă 30–60 s pe punctele de la spate (cu ajutor) și pe piept. Nu amâna și nu înlocui tratamentul prescris sau medicația de criză.¦acupresura,qigong,doin,acuyoga¦Respectă planul de tratament, evită declanșatorii (fum, alergeni), exerciții de respirație, vaccinările recomandate.¦Urgență 112: dificultate severă de respirație, imposibilitatea de a vorbi în propoziții, buze albăstrui, lipsa răspunsului la medicația de criză, confuzie sau epuizare. Nu folosi acupresura în timpul unei crize.¦w: Dovezile pentru acupunctură în astm sunt slabe și inconsistente; ghidurile nu o recomandă ca tratament. Poate fi cel mult un adjuvant de relaxare.
insomnie¦Insomnie¦Somn și minte¦Dificultate de a adormi, treziri nocturne sau somn neodihnitor, cu efect asupra zilei.¦HT7,EX,EX-HN3,KI1,PC6¦Cu 30–60 min înainte de somn, apasă blând-mediu HT7, EX-HN3 și EX, apoi masează tălpile (KI1), 60–90 s pe punct, cu respirație lentă. Fă-o în lumină scăzută, fără ecrane.¦acupresura,aur,refl-t,teas,doin¦Igiena somnului: ore regulate, fără ecrane și cafea seara, dormitor întunecat și răcoros, mișcare în timpul zilei, tehnici de relaxare; terapia cognitiv-comportamentală pentru insomnie (CBT-I) este prima linie.¦Mergi la medic dacă insomnia durează peste 3 luni, apar sforăit puternic cu pauze respiratorii, somnolență periculoasă în timpul zilei, dispoziție foarte scăzută, gânduri de a-ți face rău, sau dacă folosești alcool/pastile pentru somn.¦m: Pentru insomnie, acupunctura are dovezi de nivel redus până la moderat privind calitatea somnului; pentru acupresură studii mici arată ameliorări modeste, cu risc de bias. CBT-I rămâne tratamentul de primă linie.
stres-anxietate¦Stres și anxietate ușoară¦Somn și minte¦Tensiune psihică, neliniște și agitație trăite în perioadele solicitante, fără o tulburare severă.¦GV20,EX-HN3,PC6,HT7,LR3¦Apasă blând-mediu 60–90 s pe fiecare punct, cu respirație lentă (4 s inspir, 6 s expir). O poți face de 1–3 ori pe zi, mai ales în momentele de tensiune.¦acupresura,aur,eft,doin,qigong¦Mișcare regulată, somn suficient, reducerea cofeinei, pauze, respirație diafragmatică, discuții cu persoane de încredere, consiliere psihologică la nevoie.¦Mergi la medic/psiholog dacă anxietatea îți afectează munca și relațiile, ai atacuri de panică repetate, palpitații cu durere toracică, gânduri de a-ți face rău (apelează 112 sau o linie de criză). Nu înlocui tratamentul prescris.¦l: Studiile mici sugerează că acupresura poate reduce anxietatea pe termen scurt (de exemplu în contexte preoperatorii), dar calitatea dovezilor este limitată. Este în principal o tehnică de relaxare.
dispozitie-scazuta¦Dispoziție scăzută (adjuvant)¦Somn și minte¦Stare de apatie sau tristețe pasageră. Depresia clinică necesită evaluare și tratament medical.¦GV20,EX-HN3,PC6,LR3,HT7¦Presiune blândă 60 s pe fiecare punct, în combinație cu respirații lente, în timpul zilei. Poate fi un moment scurt de pauză, nu un tratament.¦acupresura,aur,doin,qigong,eft¦Lumină naturală, mișcare zilnică, contact social, rutină de somn, limitarea alcoolului, activități plăcute; discută cu medicul sau psihologul dacă starea persistă.¦Caută ajutor urgent (112 sau linie de criză) dacă ai gânduri de suicid sau de a-ți face rău. Mergi la medic dacă dispoziția scăzută durează peste 2 săptămâni, îți afectează funcționarea, ai pierdere de apetit sau somn, sentiment de lipsă de speranță.¦w: Acupunctura are dovezi limitate pentru depresie; acupresura singură nu are dovezi solide. Nu înlocuiește psihoterapia sau tratamentul medical.
trac-examen¦Trac și emoții înainte de examen¦Somn și minte¦Nervozitate de scurtă durată înaintea unui examen sau a unei prezentări, cu palpitații ușoare și mâini reci.¦HT7,PC6,EX-HN3,GV20¦Cu 10–15 min înainte, apasă 60 s fiecare punct cu respirație lentă; nu apăsa tare. Poți repeta discret, pe mâini, între probe.¦acupresura,eft,doin¦Pregătire din timp, somn suficient, masă ușoară, hidratare, respirație lentă, evitarea excesului de cafea.¦Mergi la medic dacă apar: palpitații puternice cu durere toracică, leșin, atacuri de panică repetate, anxietate care te împiedică să funcționezi.¦l: Studii mici arată reduceri modeste ale anxietății de moment după acupresură, mai ales prin relaxare și atenție; dovezile sunt limitate.
atac-panica¦Atacuri de panică (între episoade)¦Somn și minte¦Episoade scurte de frică intensă cu palpitații, transpirații, tremur. Evaluarea medicală este necesară.¦PC6,HT7,EX-HN3,GV20¦Doar ca tehnică de calmare, între episoade sau în timpul unei crize ușoare deja diagnosticate: presiune blândă 60 s pe PC6 și HT7, cu respirație lentă. Nu înlocuiește tratamentul.¦acupresura,eft,doin,qigong¦Respirație lentă (expir mai lung), exerciții regulate, reducerea cofeinei și alcoolului, psihoterapie (CBT), identificarea declanșatorilor.¦La prima criză sau dacă durerea toracică, lipsa de aer, amorțeala unui braț sau leșinul apar: sună 112, deoarece nu se pot deosebi acasă de o urgență cardiacă. Mergi la medic dacă crizele se repetă.¦w: Dovezile pentru acupunctură/acupresură în tulburarea de panică sunt slabe; tratamentele de bază sunt psihoterapia și, la nevoie, medicația.
burnout¦Epuizare și suprasolicitare¦Somn și minte¦Oboseală mentală și fizică prelungită legată de suprasolicitare, cu iritabilitate și dificultăți de concentrare.¦GV20,ST36,SP6,HT7,KI3¦Sesiune de 10–15 minute seara, cu presiune medie 60–90 s pe fiecare punct și respirație lentă. Poți adăuga automasaj al cefei.¦acupresura,doin,qigong,acuyoga,refl-t¦Limite clare la muncă, pauze reale, somn, mișcare, timp în natură, vacanțe, discuție cu angajatorul sau consilier; terapie psihologică dacă simptomele persistă. În sarcină omite SP6.¦Mergi la medic/psiholog dacă ai epuizare persistentă, simptome depresive, gânduri de a-ți face rău (112), consum crescut de alcool sau sedative, simptome fizice persistente (palpitații, durere toracică).¦w: Nu există studii solide specifice burnout-ului; acupresura poate ajuta ca pauză de relaxare, nu ca soluție pentru cauzele suprasolicitării.
somn-intrerupt¦Treziri nocturne frecvente¦Somn și minte¦Treziri repetate în timpul nopții, cu dificultate de a readormi, adesea legate de stres, alcool, cafea sau vârstă.¦HT7,PC6,EX,KI1¦Dacă te trezești, presează blând HT7 și PC6 cu respirație lentă, 60 s, apoi masează tălpile ușor (KI1). Fără lumină puternică sau ecrane.¦acupresura,refl-t,aur,doin¦Ore regulate, evită alcoolul și mesele grele seara, camera răcoroasă și întunecată, evită ecranele la trezire, lichide puține seara, relaxare musculară progresivă.¦Mergi la medic dacă ai: sforăit puternic cu pauze respiratorii, treziri cu lipsă de aer, urinare nocturnă frecventă, dureri nocturne, somnolență diurnă periculoasă, simptome depresive.¦l: Dovezile pentru acupresura în somnul întrerupt provin din studii mici; efectul probabil este de relaxare. Igiena somnului și evaluarea cauzelor sunt esențiale.
dismenoree¦Dureri menstruale (dismenoree primară)¦Ginecologic¦Crampe în abdomenul inferior în zilele ciclului, fără o boală pelvină identificată.¦SP6,LR3,CV4,ST36,BL23¦Apasă mediu 60–90 s pe SP6, LR3 și ST36, apoi masează blând abdomenul inferior (CV4) și zona lombară (BL23). Începe cu 1–2 zile înainte de menstruație și repetă de 1–2 ori pe zi. NU folosi SP6 dacă ești gravidă sau încerci o sarcină nouă.¦acupresura,moxa-s,tdp,teas,compresa¦Căldură pe abdomen, mișcare ușoară, hidratare, odihnă, exerciții de stretching; analgezicele recomandate de medic rămân eficiente.¦Mergi la medic dacă: durerea este severă sau nouă după 25 de ani, sângerare foarte abundentă (schimbi tamponul mai des de 1–2 ore), febră, secreții anormale, durere în afara ciclului, întârzierea menstruației cu durere intensă (posibilă sarcină ectopică: urgență), amețeală sau leșin.¦m: Pentru dismenoreea primară, acupresura la SP6 și acupunctura au dovezi de nivel moderat din meta-analize (calitate variabilă) privind reducerea durerii; rezultatele trebuie interpretate cu prudență.
spm¦Sindrom premenstrual (SPM)¦Ginecologic¦Simptome fizice și emoționale în a doua jumătate a ciclului: tensiune la sâni, balonare, iritabilitate, oboseală.¦LR3,PC6,HT7,ST36,CV6¦Apasă blând-mediu 60 s pe fiecare punct, cu respirație lentă, în ultimele 7–10 zile ale ciclului. Masează ușor abdomenul inferior (CV6); nu presa dureros.¦acupresura,moxa-s,aur,doin,tdp¦Mișcare regulată, somn, reducerea sării, cofeinei și alcoolului înainte de menstruație, mese regulate, tehnici de relaxare, jurnal al simptomelor.¦Mergi la medic dacă simptomele afectează munca și relațiile, ai dispoziție foarte scăzută sau gânduri de a-ți face rău (112), sângerări neobișnuite, durere pelvină nouă, sau simptome care continuă după menstruație.¦l: Dovezile pentru acupunctură/acupresură în SPM sunt limitate, din studii mici; poate ameliora unele simptome de confort, dar nu este un tratament dovedit.
menopauza¦Bufeuri și simptome de menopauză¦Ginecologic¦Valuri de căldură, transpirații nocturne, tulburări de somn și dispoziție în perioada menopauzei.¦LR3,KI3,SP6,HT7,PC6¦Presiune medie 60 s pe fiecare punct, cu respirație lentă, o dată pe zi, mai ales seara. Evită apăsarea dureroasă.¦acupresura,acu-cl,aur,doin,qigong¦Straturi de îmbrăcăminte, cameră răcoroasă, evitarea alcoolului și condimentelor, mișcare regulată, somn, discută cu medicul despre opțiunile de tratament.¦Mergi la medic dacă ai sângerări vaginale după menopauză (obligatoriu), durere toracică, palpitații puternice, dispoziție foarte scăzută, bufeuri severe care afectează funcționarea, scădere în greutate neexplicată.¦l: Pentru bufeuri, acupunctura are dovezi limitate și inconsistente; unele studii arată ameliorări mici față de lipsa tratamentului, dar mai puțin față de acupunctura placebo. Acupresura este un adjuvant de confort.
greata-sarcina¦Greață în sarcină (doar PC6)¦Ginecologic¦Greață și vărsături frecvente în primul trimestru de sarcină („greață matinală”).¦PC6,CV12,EX-HN3¦Doar acupresură blândă: PC6 pe încheieturi 60 s (sau brățară de acupresură), cu presiune ușoară-medie; CV12 și EX-HN3 pot fi masate foarte ușor. NU folosi LI4, SP6, BL60, GB21 sau alte puncte contraindicate în sarcină; discută oricând cu medicul.¦acupresura,band¦Mese mici și dese, biscuiți uscați înainte de ridicare, ghimbir, hidratare, evitarea mirosurilor puternice, odihnă; discută cu medicul despre soluții sigure.¦Mergi la medic dacă: vărsături repetate care nu permit hidratare, scădere în greutate, urină puțină și închisă la culoare, amețeală, durere abdominală, sângerare, febră. Hiperemesis gravidică necesită tratament medical.¦m: Pentru greața din sarcină, revizuirile Cochrane arată dovezi de nivel redus până la moderat că stimularea PC6 poate ajuta unele femei; rezultatele sunt inconsistente și efectul este modest.
menstruatie-neregulata¦Cicluri menstruale neregulate (confort)¦Ginecologic¦Menstruații care apar la intervale variabile, absente sau cu flux modificat; cauzele trebuie evaluate medical.¦CV4,CV6,ST36,LR3,KI3¦Masaj blând al abdomenului inferior și presiune medie 30–60 s pe celelalte puncte, în a doua jumătate a zilei, ca tehnică de relaxare. Nu folosi pentru a „induce” menstruația.¦acupresura,moxa-s,tdp¦Somn regulat, greutate echilibrată, evitarea restricțiilor alimentare extreme, gestionarea stresului, evaluare ginecologică și hormonală.¦Fă un test de sarcină dacă menstruația întârzie. Mergi la medic dacă ciclurile sunt neregulate peste 3 luni, lipsesc, ai sângerare abundentă, durere pelvină severă, semne de exces de androgeni, secreție de lapte în afara sarcinii, sau sarcină posibilă cu durere (urgență). Nu aplica puncte dacă ești gravidă.¦w: Dovezile pentru acupunctură în ciclurile neregulate (de exemplu sindromul ovarelor polichistice) sunt slabe și de calitate scăzută; acupresura este un adjuvant de relaxare.
cefalee-tensiune¦Cefalee de tensiune¦Cap și senzoriale¦Durere de cap de intensitate ușoară–moderată, ca o bandă strânsă în jurul capului, legată de stres, postură sau oboseală.¦GB20,LI4,EX-HN5,EX-HN3,LR3¦Masează încet baza craniului (GB20) cu degetele mari, apoi tâmplele și locul dintre sprâncene, 30–60 s pe punct. Repetă la nevoie, de până la 3 ori pe zi.¦acupresura,tuina,trigger,gua,tdp¦Hidratare, pauze de la ecran, somn regulat, mișcare, relaxare a cefei, limitarea analgezicelor la ≤2–3 zile pe săptămână (risc de cefalee de rebound). În sarcină omite LI4.¦Urgență 112: cefalee bruscă și severă („cea mai gravă din viață”), cu febră și gât țeapăn, după traumatism, cu confuzie, vedere dublă, slăbiciune, tulburări de vorbire sau convulsii. Mergi la medic dacă cefaleea este nouă după 50 de ani, progresivă, trezește din somn sau schimbă tiparul obișnuit.¦m: Pentru cefaleea de tensiune episodică și cronică, revizuirile Cochrane indică dovezi de nivel moderat că acupunctura poate reduce frecvența; pentru acupresura singură dovezile sunt limitate, în principal efect de relaxare.
migrena¦Migrenă (prevenție și confort)¦Cap și senzoriale¦Durere de cap pulsatilă, adesea unilaterală, cu sensibilitate la lumină/zgomot și greață, în episoade recurente.¦GB20,LI4,LR3,EX-HN5,PC6¦Între crize sau la debut ușor: presiune medie 30–60 s pe GB20, LR3, EX-HN5 și PC6 (și pentru greață). Evită stimularea intensă în timpul unei crize puternice.¦acupresura,acu-cl,aur,band,tdp¦Jurnal al declanșatorilor, somn regulat, mese la ore fixe, hidratare, evitarea alcoolului, cameră întunecată și liniștită în criză, tratament prescris de medic. În sarcină omite LI4.¦Urgență 112: cea mai gravă cefalee din viață sau cu debut brusc, aură nouă sau prelungită, slăbiciune sau amorțeală pe o parte, tulburări de vorbire, febră cu gât țeapăn, după traumatism, convulsii. Mergi la medic dacă tiparul migrenei se schimbă sau apare după 50 de ani.¦m: Pentru profilaxia migrenei, acupunctura are dovezi de nivel moderat (revizuiri Cochrane) pentru reducerea frecvenței crizelor, comparabile în unele studii cu medicația preventivă; pentru acupresură dovezile sunt limitate.
ameteala¦Amețeală ușoară (non-urgentă)¦Cap și senzoriale¦Senzație de cap ușor sau de dezechilibru, de obicei trecătoare, după ridicare bruscă, oboseală sau deshidratare.¦PC6,GB20,GV20,LR3¦Doar în repaus, așezat: presiune blândă 30–60 s pe PC6 și GB20, respirație lentă. Nu te ridica brusc după sesiune.¦acupresura,band,aur¦Hidratare, mese regulate, ridicare lentă din pat, evitarea alcoolului, somn suficient, verificarea medicamentelor cu medicul.¦Urgență 112: amețeală cu durere toracică, slăbiciune a feței sau a unui membru, tulburări de vorbire sau vedere, cefalee severă, leșin, dificultăți de mers brusc instalate. Mergi la medic dacă amețeala e repetitivă, cu vertij sau auz scăzut.¦w: Dovezile pentru acupresura în amețeală sunt slabe; cauza trebuie evaluată medical înainte de orice măsură de confort.
tinitus¦Tinitus (zgomote în urechi)¦Cap și senzoriale¦Percepția unui sunet (țiuit, șuierat) fără sursă externă, cu intensitate variabilă.¦TE17,TE21,SI19,GB20,TE3¦Presiune ușoară-medie 30–60 s pe punctele din jurul urechii, fără a introduce degete în ureche. Poate fi combinată cu relaxare și sunet de fond.¦acupresura,aur,tuina,qigong¦Evită zgomotul puternic, folosește sunet de fond, reduce cofeina, relaxare, somn, verificare audiologică, gestionarea stresului.¦Mergi urgent la medic ORL la: tinitus brusc cu scădere a auzului pe o ureche (urgență în primele 24–72 ore), tinitus pulsatil, amețeală severă, slăbiciune facială, după traumatism sonor sau cranian, tinitus unilateral nou.¦w: Pentru tinitus, acupunctura are dovezi slabe și inconsistente; ghidurile nu o recomandă de rutină. Acupresura poate ajuta eventual prin relaxare.
oboseala-oculara¦Oboseală oculară și ochi uscați¦Cap și senzoriale¦Disconfort, arsură sau vedere încețoșată după muncă prelungită la ecran.¦BL1,BL2,EX-HN5,GB20,LI4¦Presiune foarte ușoară, 20–30 s, pe BL2 și în jurul orbitei (nu pe globul ocular), apoi GB20 și LI4 30–60 s. Spală-ți mâinile înainte; nu masa dacă porți lentile sau ai o infecție oculară.¦acupresura,tuina,acufacial,compresa¦Regula 20-20-20 (la 20 min privește 20 secunde la 6 metri), clipit conștient, iluminat bun, picături lubrifiante la recomandarea medicului, examen oftalmologic periodic. În sarcină omite LI4.¦Mergi urgent la medic dacă apar: scădere bruscă a vederii, durere oculară severă, halouri în jurul luminilor, ochi roșu dureros, traumatism, vedere dublă, pete plutitoare noi sau „perdea” în câmpul vizual.¦l: Studiile mici de acupresură pentru oboseala vizuală arată ameliorări subiective de scurtă durată; dovezile sunt limitate și apăsarea nu corectează problemele de refracție.
durere-dentara¦Durere dentară (până la consultul stomatologic)¦Cap și senzoriale¦Durere în dinți sau gingii, de obicei din cauza cariilor, inflamației sau sensibilității.¦LI4,ST44,ST6,ST7¦Doar ca măsură de confort temporară: presiune medie 30–60 s pe LI4 și ST44, ușoară pe ST6/ST7; nu înlocuiește consultul stomatologic.¦acupresura,acu-cl,aur¦Clătire cu apă călduță sărată, evitarea alimentelor foarte reci/fierbinți, igienă blândă, analgezic recomandat de medic sau stomatolog; programează un consult stomatologic. În sarcină omite LI4.¦Mergi urgent la stomatolog/medic dacă ai: umflătură a feței sau gâtului, febră, dificultate la înghițire sau deschiderea gurii, abces, durere care iradiază în braț/maxilar cu transpirații (poate fi cardiacă), durere după traumatism.¦l: Pentru durerea dentară postoperatorie acupunctura are dovezi limitate; acupresura poate oferi doar un efect temporar de confort, nu tratează cauza.
rau-de-miscare¦Rău de mișcare (călătorie)¦Cap și senzoriale¦Greață, amețeală și transpirații în mașină, avion sau vapor, prin conflict între vedere și echilibru.¦PC6,ST36,GV20¦Cu 10–15 min înainte și în timpul călătoriei, apasă PC6 60 s pe fiecare încheietură; poți folosi brățări de acupresură. Privește un punct fix la orizont.¦acupresura,band,aur¦Ocupă un loc stabil (față, mijloc), aer curat, evită citirea, mese ușoare înainte de călătorie, ghimbir, pauze.¦Mergi la medic dacă simptomele persistă după coborâre, apar cu durere toracică, amețeală cu vorbire neclară sau slăbiciune, vărsături persistente, sau dacă sunt severe și frecvente.¦l: PC6 și brățările de acupresură au dovezi limitate până la moderate pentru greață (postoperatorie, chimioterapie); pentru rău de mișcare dovezile sunt mai slabe și inconsistente.
oboseala-zilnica¦Oboseală zilnică (fără boală identificată)¦Oboseală și imunitate¦Lipsă de energie, somnolență în timpul zilei, fără o cauză medicală cunoscută.¦ST36,SP6,CV6,GV20,KI3¦Sesiune de 5–10 minute dimineața, cu presiune medie 45–60 s pe fiecare punct și respirații profunde. Evită seara târziu, deoarece poate stimula.¦acupresura,doin,qigong,refl-t,moxa-s¦Somn regulat de 7–9 ore, mișcare zilnică, hidratare, mese echilibrate, lumină naturală, limitarea alcoolului, verificarea analizelor la medic (anemie, tiroidă). În sarcină omite SP6.¦Mergi la medic dacă oboseala persistă peste 2–4 săptămâni, apare cu pierdere în greutate, febră, sângerări, dificultăți de respirație, palpitații, dispoziție foarte scăzută, somnolență periculoasă la volan.¦l: Pentru oboseala nespecifică dovezile sunt limitate; unele studii arată ameliorări de scurtă durată cu acupresura (de exemplu la bolnavi cronici), dar calitatea este modestă.
imunitate¦Răceli frecvente și imunitate¦Oboseală și imunitate¦Persoane care răcesc des; susținerea generală a stării de bine prin stil de viață. Nu există puncte care „întăresc imunitatea” în sens medical.¦ST36,LI4,LU9,CV6,GV14¦Presiune medie 30–60 s pe aceste puncte, de 3–5 ori pe săptămână, ca rutină de relaxare. Nu înlocuiește vaccinările sau recomandările medicale. În sarcină omite LI4.¦acupresura,moxa-s,doin,qigong,tdp¦Somn suficient, activitate fizică regulată, alimentație variată, vitamina D la recomandarea medicului, igiena mâinilor, vaccinările recomandate, gestionarea stresului.¦Mergi la medic dacă ai infecții foarte frecvente sau severe, febră recurentă, pierdere în greutate neexplicată, transpirații nocturne, ganglioni măriți, infecții neobișnuite sau vindecare întârziată.¦w: Dovezile că acupunctura sau acupresura cresc imunitatea sau previn răcelile sunt slabe; unele studii despre moxibustie sau tai-chi sunt promițătoare dar insuficiente.
convalescenta¦Recuperare după o boală ușoară¦Oboseală și imunitate¦Slăbiciune și oboseală după o infecție banală sau un episod gripal, când febra a trecut.¦ST36,CV6,SP6,KI3,GV20¦Sesiune blândă de 5–10 minute, o dată pe zi, doar după dispariția febrei; presiune ușoară-medie 30–60 s pe punct, cu respirație lentă. Oprește dacă oboseala crește.¦acupresura,moxa-s,doin,qigong¦Odihnă progresivă, hidratare, alimentație bogată în proteine și legume, plimbări scurte care se măresc treptat, somn, revenire graduală la program. În sarcină omite SP6.¦Mergi la medic dacă febra reapare, tusea sau dificultatea de respirație se agravează, oboseala persistă peste 4 săptămâni, apar palpitații sau durere toracică, edeme, sau pierdere în greutate.¦x: Nu există dovezi că acupresura accelerează vindecarea unei infecții; poate fi doar o rutină de relaxare în perioada de recuperare.
extremitati-reci¦Mâini și picioare reci¦Oboseală și imunitate¦Senzație de frig la degete, adesea legată de circulație periferică, stres sau temperatură; poate fi fiziologică.¦LI4,PC8,KI1,ST36,LR3¦Masaj blând al mâinilor și tălpilor, apoi presiune medie 30–60 s pe punctele indicate. Poți combina cu un duș cald sau comprese calde. În sarcină omite LI4.¦acupresura,refl-t,moxa-s,tdp,compresa¦Haine calde, mișcare pentru circulație, renunțarea la fumat, limitarea cofeinei, mese regulate, evitarea frigului prelungit.¦Mergi la medic dacă degetele devin alb–albăstrui–roșii (Raynaud), apar ulcerații, durere intensă, piele neagră sau fără sensibilitate, afecțiuni cunoscute de circulație sau diabet, sau dacă frigul este nou și însoțit de oboseală, creștere în greutate sau amețeală.¦w: Dovezile pentru acupresura în extremitățile reci sunt slabe; masajul poate crește temporar senzația de căldură prin circulație locală.
acnee¦Acnee ușoară (adjuvant)¦Piele¦Apariția de coșuri, puncte negre sau pustule, frecvent pe față, legată de hormoni, glande sebacee și inflamație.¦LI4,LI11,ST44,SP10¦Presiune medie 30–60 s pe punctele de la mână, braț și picior; evită apăsarea sau stoarcerea leziunilor și nu masa pe piele iritată. Poate fi făcută de 1–2 ori pe zi.¦acupresura,aur,gua,acufacial¦Curățare blândă a feței, evită stoarcerea coșurilor, protecție solară, dietă echilibrată, igienă a obiectelor care ating fața, consultă dermatologul pentru formele moderate sau severe. În sarcină omite LI4 și SP10.¦Mergi la dermatolog dacă acneea este severă, apar chisturi dureroase sau cicatrici, afectează stima de sine, apare brusc la vârsta adultă cu alte simptome (hirsutism, cicluri neregulate) sau după medicamente noi.¦w: Dovezile pentru acupunctură în acnee sunt slabe; acupresura singură nu are dovezi, iar tratamentul dermatologic rămâne de bază.
eczema¦Mâncărime și piele uscată (eczemă ușoară)¦Piele¦Piele uscată, roșie, cu mâncărime, în episoade; tratamentul de bază este hidratarea și medicația recomandată de medic.¦LI11,SP10,SP6,ST36,LI4¦Doar pe piele intactă, în afara leziunilor: presiune medie 30–60 s pe LI11, SP10, SP6 și ST36. Nu masa pe piele inflamată, crăpată sau infectată. În sarcină omite LI4, SP6 și SP10.¦acupresura,aur,eft¦Emolient zilnic, duș scurt cu apă călduță, evitarea iritanților, unghii scurte, haine din bumbac, identificarea declanșatorilor, urmarea planului dermatologic.¦Mergi la medic dacă pielea este infectată (puroi, crustă galbenă, febră), eczema se extinde rapid, somnul este afectat, apare la sugar, nu răspunde la tratament, sau apar vezicule dureroase.¦w: Studiile despre acupunctură/acupresură în eczemă au dovezi slabe; pot ameliora percepția mâncărimii, dar nu înlocuiesc emolientele și medicația.
urticarie¦Urticarie cronică (adjuvant)¦Piele¦Pete roșii, ridicate, cu mâncărime, care apar și dispar, uneori timp de săptămâni.¦LI11,SP10,SP6,ST36,LI4¦Presiune medie 30–60 s pe punctele de pe braț și picior, doar pe piele intactă și în afara plăcilor. Oprește dacă mâncărimea se agravează. În sarcină omite LI4, SP6 și SP10.¦acupresura,acu-cl,aur¦Evită declanșatorii cunoscuți (căldură, frecare, alimente), haine largi, duș călduț, antihistaminice la recomandarea medicului, jurnal al episoadelor.¦Urgență 112: umflarea buzelor, limbii sau gâtului, dificultăți de respirație, amețeală sau leșin, durere abdominală cu urticarie (posibilă anafilaxie). Mergi la medic dacă urticaria durează peste 6 săptămâni sau reapare des.¦l: Pentru urticaria cronică, acupunctura are dovezi limitate din studii mici; acupresura nu are dovezi solide și nu înlocuiește antihistaminicele.
hiperhidroza¦Transpirații excesive (hiperhidroză)¦Piele¦Transpirație abundentă, mai ales la mâini, tălpi sau axile, fără alte cauze evidente.¦HT7,PC8,KI1,LI4¦Presiune medie 30–60 s pe punctele de la palmă, încheietură și talpă, seara, cu respirație lentă. Evită apăsarea dacă pielea este iritată. În sarcină omite LI4.¦acupresura,aur,eft¦Antiperspirante cu săruri de aluminiu, haine din bumbac, încălțăminte aerisită, gestionarea stresului, reducerea cofeinei și a condimentelor, discuție cu medicul despre opțiuni.¦Mergi la medic dacă transpirațiile sunt nocturne și abundente, apar cu febră, pierdere în greutate, palpitații, durere toracică, sau apar brusc la vârsta adultă, ori sunt asociate cu medicamente noi.¦w: Dovezile pentru acupunctură sau acupresură în hiperhidroza primară sunt slabe; efectul, dacă există, este probabil de relaxare.
cistita-recurenta¦Cistită recurentă (prevenție, confort)¦Urinar¦Infecții urinare repetate cu usturime la urinare și urinare frecventă. Infecția activă se tratează medical.¦SP6,CV4,BL23,KI3,ST36¦Doar între episoade, ca relaxare: presiune ușoară-medie 30–60 s pe punctele indicate. NU folosi în timpul unei infecții active în loc de tratament. În sarcină omite SP6.¦acupresura,moxa-s,tdp,compresa¦Hidratare, urinare după contact sexual, igienă, evitarea reținerii urinii, discuție cu medicul despre profilaxie.¦Mergi urgent la medic dacă ai: febră, frisoane, durere lombară sau în flanc (posibilă infecție renală), sânge în urină, vărsături, sarcină cu simptome urinare, simptome la bărbați sau copii. Infecția urinară netratată se poate extinde la rinichi.¦l: Dovezile pentru acupunctură în prevenirea cistitei recurente sunt limitate, din studii mici; nu înlocuiește profilaxia și tratamentul medical.
vezica-hiperactiva¦Vezică hiperactivă (urgențe urinare)¦Urinar¦Nevoie urgentă și frecventă de urinare, uneori cu scurgeri, fără o infecție activă.¦SP6,CV4,KI3,BL23,ST36¦Presiune medie 30–60 s pe punctele de pe picior și zona lombară, de 1–2 ori pe zi, ca adjuvant la antrenamentul vezical. În sarcină omite SP6.¦acupresura,teas,acu-cl,tdp¦Antrenament vezical, exerciții ale planșeului pelvin, reducerea cofeinei și alcoolului, lichide distribuite pe parcursul zilei, scădere în greutate dacă e cazul.¦Mergi la medic dacă ai: sânge în urină, durere, febră, incapacitate de a urina, scurgeri noi, simptome neurologice, urinare frecventă cu sete mare (posibil diabet).¦m: Pentru vezica hiperactivă, stimularea tibială (TENS/acupunctură) are dovezi de nivel moderat pentru reducerea urgențelor; pentru acupresura singură dovezile sunt limitate.
nicturie¦Treziri nocturne pentru urinare (nicturie)¦Urinar¦Trezirea o dată sau de mai multe ori pe noapte pentru a urina; cauzele sunt multiple (vârstă, lichide, prostată, inimă).¦KI3,CV4,BL23,SP6¦Presiune blândă-medie 30–60 s pe punctele de la picior și zona lombară, seara, ca relaxare. Nu înlocuiește evaluarea medicală. În sarcină omite SP6.¦acupresura,moxa-s,tdp¦Redu lichidele și cafeaua seara, ridică picioarele în timpul zilei dacă ai edeme, evită alcoolul, discută cu medicul despre medicație și apnee în somn.¦Mergi la medic dacă nicturia este nouă sau frecventă (>2 pe noapte), cu sete mare (diabet), umflături la picioare, dificultăți de respirație, jet slab (prostată), sânge în urină, febră sau durere.¦w: Dovezile pentru acupresura în nicturie sunt slabe; investigarea cauzei este esențială.
colici-sugar¦Colici la sugar (măsuri blânde)¦Copii¦Plâns intens și repetat la un sugar sănătos, mai ales seara, în primele luni. Diagnosticul îl pune medicul pediatru.¦CV12,ST25,ST36¦Doar masaj abdominal foarte blând, cu vârful degetelor, 10–20 s, în sens orar, la un bebeluș calm și neflămând, nu imediat după masă. Fără presiune pe puncte; oprește dacă plânge mai tare.¦acupresura,shiatsu¦Poziții de ținut în brațe, eructație, sunet monoton, înfășat, evitarea supra-stimulării, verificarea tehnicii de alimentare, consult pediatric.¦Mergi urgent la medic/112 dacă sugarul are: febră (peste 38 °C sub 3 luni), vărsături verzui sau cu sânge, abdomen umflat și dur, scaun cu sânge, letargie, refuzul alimentării, plâns inconsolabil neobișnuit, respirație dificilă, fontanela bombată.¦w: Studiile despre acupunctură/acupresură în colici sunt de calitate scăzută și rezultatele sunt inconsistente; nu se recomandă ace la sugar. Masajul blând poate liniști, dar nu este un tratament dovedit.
dentitie¦Disconfort la erupția dinților¦Copii¦Iritabilitate, salivație și gingii sensibile când erup primii dinți la sugar.¦LI4,ST6,ST7¦Doar masaj foarte ușor al gingiei cu degetul curat sau o jucărie rece pentru dentiție; fără acupresură pe puncte la sugar. Dacă un adult face LI4 pe mâna copilului: doar frecare ușoară 10 s.¦acupresura,shiatsu¦Jucărie de dentiție rece (nu înghețată), degetul curat pe gingie, hidratare, consolare, evitarea gelurilor cu benzocaină, discuție cu medicul pediatru despre analgezice potrivite vârstei.¦Mergi la medic dacă sugarul are: febră peste 38 °C, diaree severă, vărsături, erupții pe corp, refuz al alimentării, letargie, plâns inconsolabil. Aceste simptome nu se pun automat pe seama dinților.¦x: Nu există dovezi pentru acupresura în disconfortul dentiției; măsurile de bază sunt cele de confort descrise la auto-îngrijire.
constipatie-copil¦Constipație la copil (măsuri blânde)¦Copii¦Scaune rare sau dure la copil, adesea legate de dietă, hidratare sau amânarea mersului la toaletă.¦ST25,ST36,CV12¦Masaj abdominal foarte blând în sens orar, 20–30 s, ca joc relaxant, cu mâna caldă; fără presiune pe puncte la copiii mici. Oprește dacă plânge sau simte durere.¦acupresura,shiatsu,tuina¦Fibre, fructe, apă, mișcare, rutină regulată la toaletă după masă, evitarea reținerii, laxative doar la recomandarea medicului.¦Mergi la medic dacă copilul are: durere abdominală severă, vărsături, sânge în scaun, abdomen umflat, febră, scădere în greutate, constipație de la naștere, constipație care durează peste 2 săptămâni sau murdărirea hainelor.¦x: Nu există dovezi că acupresura tratează constipația la copil; masajul abdominal blând poate fi doar o rutină de relaxare lângă măsurile alimentare.
enurezis¦Enurezis nocturn (măsuri de susținere)¦Copii¦Urinare involuntară în somn la copii peste 5–6 ani; este frecventă și nu e „vina” copilului.¦SP6,CV4,KI3¦Opțional și doar blând: masaj ușor al abdomenului inferior, 20–30 s, seara, ca rutină liniștitoare. Fără presiune puternică și fără presiune pe copil. Nu pedepsi și nu folosi ca „tratament”.¦acupresura,tuina¦Rutină de culcare, toaletă înainte de somn, lichide mai multe dimineața și mai puține seara, jurnal al nopților uscate, recompense pozitive, alarmă de enurezis la recomandarea pediatrului.¦Mergi la medic dacă enurezisul apare brusc după o perioadă uscată, e însoțit de usturime, sete mare, scădere în greutate, urinare și ziua, constipație severă, sforăit sau dureri; sau persistă peste 7 ani.¦w: Dovezile pentru acupunctură/acupresură în enurezis sunt slabe; abordările comportamentale și alarma de enurezis au dovezi mai bune.
somn-copil¦Agitație și somn dificil la copil¦Copii¦Dificultăți de adormire sau agitație seara la copilul mic sau de vârstă școlară.¦HT7,EX-HN3,KI1¦Masaj foarte ușor al palmelor, tălpilor și frunții, 20–30 s, într-un ritual de seară; nu apăsa puncte. Adaugă căldură și voce calmă.¦acupresura,shiatsu¦Rutină fixă de culcare, camera întunecată și liniștită, fără ecrane cu 1–2 ore înainte, poveste, evitarea cofeinei (cola, ciocolată), activitate fizică în timpul zilei.¦Mergi la medic dacă copilul sforăie puternic cu pauze respiratorii, are coșmaruri sau teroare nocturnă frecventă, somnolență în timpul zilei, dificultăți de învățare/comportament, sau dacă insomnia durează peste 4 săptămâni.¦x: Nu există dovezi solide pentru acupresura în somnul copiilor; ritualul de masaj blând este în principal o rutină de relaxare și atașament.
nas-infundat-copil¦Nas înfundat la copil (măsuri blânde)¦Copii¦Nas înfundat la copilul mic în timpul răcelilor, cu dificultăți la supt sau somn agitat.¦LI20,EX-HN3,LI4¦Doar masaj foarte ușor, 10–20 s, lângă nări și între sprâncene, cu degetul curat; fără presiune. Nu înlocuiește curățarea nasului cu ser.¦acupresura,compresa¦Ser fiziologic și aspirator nazal, hidratare, aer umed, capul ușor ridicat, aer curat, evitarea fumului, supraveghere atentă.¦Mergi urgent la medic/112 dacă copilul are: respirație rapidă sau cu efort, tiraj, buze albăstrui, febră (orice febră sub 3 luni), refuz al alimentării, somnolență excesivă, deshidratare. Sugarii respiră în principal pe nas: nasul înfundat poate fi grav.¦x: Nu există dovezi pentru acupresura la copiii cu nas înfundat; prioritățile sunt curățarea nasului și supravegherea. Masajul blând este doar confort.
dureri-crestere¦Dureri de creștere (picioare)¦Copii¦Dureri difuze, bilaterale la picioare, mai ales seara sau noaptea, la copii de 3–12 ani, fără leziune.¦ST36,SP6,GB34¦Masaj blând al gambelor și coapselor, 20–30 s, cu mâna caldă, ca moment de apropiere; fără presiune pe puncte. Oprește dacă există durere la atingere.¦acupresura,shiatsu,compresa¦Masaj și căldură, întinderi ușoare, încălțăminte potrivită, mișcare în timpul zilei, hidratare, paracetamol/ibuprofen doar la recomandarea medicului.¦Mergi la medic dacă durerea este unilaterală, constantă, apare ziua, cu șchiopătat, umflătură, roșeață, febră, scădere în greutate, oboseală marcată, durere de oase sau articulații, sau trezește copilul des.¦x: Nu există dovezi că acupresura tratează durerile de creștere; masajul blând poate liniști copilul, dar exclude cauzele serioase la medic.`;

function CNU(k){const a=CONDUI[S.lang],e=CONDUI.en,r=CONDUI.ro;return (a&&a[k]!==undefined)?a[k]:(e[k]!==undefined?e[k]:r[k])}
function CNUg(g){const o=CNU('g');return (o&&o[g])||(CONDUI.en.g[g])||g}
const cnN=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const CNF={q:'',g:'',noN:false,open:''};
const CRT={id:null,name:'',pts:[],sec:60,msg:'',io:''};
const CSEC=[30,45,60,90,120];
const CPREG=/Contraindicat în sarcină|Evită în sarcină|Doar sub îndrumare/;
function cRoutines(){if(!Array.isArray(S.routines))S.routines=[];return S.routines}
function cSave(){try{save()}catch(e){}}
function cPt(c){return PT.find(x=>x.c===c)}
function cPtTag(c){const p=cPt(c);return p?`<span class="tag" title="${esc(p.l)}">${ptLink(c)} ${esc(p.p)}</span>`:''}

/* ---- sesiune ghidată pe puncte proprii ---- */
function startCustom(title,codes,sec){
  const pts=(codes||[]).map(c=>PT.find(x=>x.c===c)).filter(Boolean);
  if(!pts.length)return;
  if(sec&&CSEC.includes(+sec))SES.sec=+sec;
  SES.title=title;SES.pts=pts;SES.i=0;SES.left=SES.sec;SES.on=true;SES.paused=false;
  clearInterval(SES.timer);SES.timer=setInterval(tick,1000);beep(880);drawSes();
}
function cndStart(id){const c=COND.find(x=>x.id===id);if(c)startCustom(c.n,c.pts,c.g==='Copii'?30:0)}

/* ---- index ---- */
function cndFilter(){
  const tk=cnN(CNF.q).split(/[\s,;]+/).filter(t=>t.length>1&&!['de','la','si','in','cu','pe','al','a'].includes(t)).map(t=>t.length>5?t.slice(0,-2):t);
  return COND.filter(c=>{
    if(CNF.g&&c.g!==CNF.g)return false;
    if(!tk.length)return true;
    const h=cnN([c.n,c.d,c.g,CNUg(c.g),c.id,c.pts.join(' '),c.pr,c.sc].join(' '));
    return tk.every(t=>h.includes(t));
  });
}
function cndVarLink(id){
  const v=VAR.find(x=>x.id===id);if(!v)return '';
  if(CNF.noN&&v.inv>=2)return '';
  return `<a class="tag" href="#tech" onclick="TF.q='${esc(v.n).replace(/'/g,'')}';TF.cat='';TF.open='${esc(v.id)}';$('#q').value='';render();return false">${esc(v.n.split(' (')[0])}</a>`;
}
function cndCard(c){
  const pts=c.pts.map(cPt).filter(Boolean);
  const preg=pts.filter(p=>CPREG.test(p.w||'')).map(p=>p.c);
  const vl=c.vr.map(cndVarLink).filter(Boolean).join(' ');
  return `<details id="c-${esc(c.id)}" ${CNF.open===c.id?'open':''}><summary>${esc(c.n)} <span class="badge" style="background:${EVC[c.ev]||EVC.x}">${esc(CNU('evL')[c.ev]||'')}</span><span class="tag">${esc(CNUg(c.g))}</span></summary>
   <p>${esc(c.d)}</p>
   <div class="warn cnd-alarm" style="border-width:2px"><b>⚠ ${esc(CNU('alarm'))}</b><br>${esc(c.al)}</div>
   ${preg.length?`<p class="w" style="color:var(--acc2)">⚠ ${esc(CNU('pregN'))}${preg.join(', ')}.</p>`:''}
   ${c.g==='Copii'?`<div class="warn">👶 ${esc(CNU('kidsN'))}</div>`:''}
   <h3>${esc(CNU('points'))}</h3><p>${pts.map(p=>`<span class="tag" title="${esc(p.l)}">${ptLink(p.c)} ${esc(p.p)}</span>`).join('')}</p>
   <h3>${esc(CNU('protocol'))}</h3><p>${esc(c.pr)}</p>
   <div class="bar"><button class="b" onclick="cndStart('${esc(c.id)}')">${esc(CNU('startS'))}</button><button class="b alt" onclick="cndAddAll('${esc(c.id)}')">${esc(CNU('addR'))}</button></div>
   ${vl?`<h3>${esc(CNU('variants'))}</h3><p>${vl}</p>`:''}
   <h3>${esc(CNU('selfcare'))}</h3><p>${esc(c.sc)}</p>
   <h3>${esc(CNU('evid'))}</h3><p><span class="badge" style="background:${EVC[c.ev]||EVC.x}">${esc(CNU('evL')[c.ev]||'')}</span> ${esc(c.evt)}</p>
  </details>`;
}
function cndRenderList(){
  const L=cndFilter(),box=$('#cnd-list');if(!box)return;
  const cn=$('#cnd-count');if(cn)cn.textContent=L.length+' / '+COND.length+' '+CNU('count');
  box.innerHTML=L.length?L.map(cndCard).join(''):`<p class="mut">${esc(CNU('noRes'))}</p>`;
  if(CNF.open){const e=document.getElementById('c-'+CNF.open);if(e)e.scrollIntoView({block:'start'});CNF.open=''}
}
function cndChips(){
  const gs=[...new Set(COND.map(c=>c.g))];
  return `<button class="b ${CNF.g?'alt':''}" onclick="CNF.g='';cndChipsDraw();cndRenderList()">${esc(CNU('all'))} (${COND.length})</button>`+
   gs.map(g=>`<button class="b ${CNF.g===g?'':'alt'}" data-g="${esc(g)}" onclick="CNF.g=this.dataset.g;cndChipsDraw();cndRenderList()">${esc(CNUg(g))} (${COND.filter(c=>c.g===g).length})</button>`).join('');
}
function cndChipsDraw(){const b=$('#cnd-chips');if(b)b.innerHTML=cndChips()}

/* ---- rutine proprii ---- */
function rtnDefaultName(){return CNU('rDefault')+' '+(cRoutines().length+1)}
function rtnAdd(code){
  if(!cPt(code)||CRT.pts.length>=60)return;CRT.pts.push(code);CRT.msg='';rtnDraw();const i=$('#rtn-q');if(i)i.focus();
}
function cndAddAll(id){
  const c=COND.find(x=>x.id===id);if(!c)return;
  c.pts.forEach(p=>{if(cPt(p)&&!CRT.pts.includes(p)&&CRT.pts.length<60)CRT.pts.push(p)});
  if(!CRT.name)CRT.name=c.n.slice(0,80);
  CRT.msg=CNU('added');rtnDraw();
  const e=$('#rtn-sec');if(e)e.scrollIntoView({block:'start'});
}
function rtnSug(v){
  const box=$('#rtn-sug');if(!box)return;const q=cnN(v.trim());
  if(!q){box.innerHTML='';return}
  const sc=p=>{const c=cnN(p.c),n=cnN(p.p);return c===q?0:c.startsWith(q)?1:n.startsWith(q)?2:c.includes(q)?3:n.includes(q)?4:cnN(p.u||'').includes(q)?5:9};
  const L=PT.map(p=>({p,s:sc(p)})).filter(x=>x.s<9).sort((a,b)=>a.s-b.s).slice(0,8);
  box.innerHTML=L.map(x=>`<button class="b alt" style="margin:.15rem .2rem .15rem 0;padding:.3rem .6rem;font-size:.85rem" onclick="rtnAdd('${esc(x.p.c)}');$('#rtn-q').value='';$('#rtn-sug').innerHTML=''">+ ${esc(x.p.c)} ${esc(x.p.p)}</button>`).join('')||`<span class="mut">${esc(CNU('noRes'))}</span>`;
}
function rtnKey(e){if(e.key==='Enter'){const b=document.querySelector('#rtn-sug button');if(b){e.preventDefault();b.click()}}}
function rtnMove(i,d){const j=i+d;if(j<0||j>=CRT.pts.length)return;const t=CRT.pts[i];CRT.pts[i]=CRT.pts[j];CRT.pts[j]=t;rtnDraw()}
function rtnDel(i){CRT.pts.splice(i,1);rtnDraw()}
function rtnClear(){CRT.pts=[];CRT.name='';CRT.id=null;CRT.msg='';rtnDraw()}
function rtnSave(){
  if(!CRT.pts.length){CRT.msg=CNU('rNoPts');rtnDraw();return}
  const R=cRoutines(),name=(CRT.name.trim()||rtnDefaultName()).slice(0,80);
  let r=CRT.id&&R.find(x=>x.id===CRT.id);
  if(r){r.name=name;r.pts=CRT.pts.slice();r.sec=CRT.sec}
  else{r={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,pts:CRT.pts.slice(),sec:CRT.sec,fav:false};R.push(r)}
  cSave();CRT.id=r.id;CRT.name=name;CRT.msg=CNU('rSaved');rtnDraw();
}
function rtnStartDraft(){startCustom(CRT.name.trim()||rtnDefaultName(),CRT.pts,CRT.sec)}
function rtnById(id){return cRoutines().find(x=>x.id===id)}
function rtnStart(id){const r=rtnById(id);if(r)startCustom(r.name,r.pts,r.sec)}
function rtnEdit(id){const r=rtnById(id);if(!r)return;CRT.id=r.id;CRT.name=r.name;CRT.pts=r.pts.slice();CRT.sec=r.sec||60;CRT.msg='';rtnDraw();const e=$('#rtn-ed');if(e)e.scrollIntoView({block:'start'})}
function rtnFav(id){const R=cRoutines();const r=rtnById(id);if(!r)return;const v=!r.fav;R.forEach(x=>x.fav=false);r.fav=v;cSave();rtnDraw()}
function rtnDup(id){const r=rtnById(id);if(!r)return;cRoutines().push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:(r.name+' (2)').slice(0,80),pts:r.pts.slice(),sec:r.sec,fav:false});cSave();rtnDraw()}
function rtnRemove(id){
  let ok=true;try{ok=confirm(CNU('rConfirm'))}catch(e){}
  if(!ok)return;
  S.routines=cRoutines().filter(x=>x.id!==id);if(CRT.id===id)CRT.id=null;cSave();rtnDraw();
}
function rtnPrint(id){
  const r=rtnById(id);if(!r)return;
  const rows=r.pts.map(cPt).filter(Boolean).map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.c)}</b> ${esc(p.p)}</td><td>${esc(p.l)}</td><td>${r.sec||60} ${esc(CNU('rSecU'))}</td></tr>`).join('');
  let d=document.getElementById('cprint');if(d)d.remove();
  d=document.createElement('div');d.id='cprint';
  d.innerHTML=`<h1>${esc(r.name)}</h1><p>${esc(CNU('pTitle'))} · PUNCTUM</p><table><tr><th>${esc(CNU('pStep'))}</th><th>${esc(CNU('points'))}</th><th>${esc(CNU('pLoc'))}</th><th>${esc(CNU('pDur'))}</th></tr>${rows}</table><p><i>${esc(CNU('pFoot'))}</i></p>`;
  document.body.appendChild(d);document.body.classList.add('cprinting');
  const done=()=>{document.body.classList.remove('cprinting');const x=document.getElementById('cprint');if(x)x.remove();window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  try{window.print()}catch(e){}
  setTimeout(done,500);
}
function rtnExport(){
  const data=JSON.stringify({punctum:'routines',v:1,routines:cRoutines().map(r=>({name:r.name,pts:r.pts,sec:r.sec,fav:!!r.fav}))},null,1);
  CRT.io=data;
  try{const b=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='punctum-routines.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){}
  CRT.msg=CNU('ioExp');rtnDraw();
}
function rtnImport(){
  const ta=$('#rtn-io');let list=[];
  try{const j=JSON.parse((ta?ta.value:CRT.io)||'');list=Array.isArray(j)?j:(j&&Array.isArray(j.routines)?j.routines:(j&&j.pts?[j]:[]))}catch(e){list=[]}
  const R=cRoutines();let n=0;
  list.slice(0,100).forEach(x=>{
    if(!x||typeof x!=='object'||!Array.isArray(x.pts))return;
    const pts=x.pts.filter(c=>typeof c==='string'&&cPt(c)).slice(0,60);if(!pts.length)return;
    const sec=CSEC.includes(+x.sec)?+x.sec:60;
    R.push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:String(x.name||CNU('rDefault')).slice(0,80),pts,sec,fav:false});n++;
  });
  if(n)cSave();
  CRT.io=ta?ta.value:CRT.io;CRT.msg=n?CNU('ioOk')+n:CNU('ioBad');rtnDraw();
}
function rtnDraw(){
  const box=$('#rtn-box');if(!box)return;
  const R=cRoutines().slice().sort((a,b)=>(b.fav?1:0)-(a.fav?1:0));
  const rows=CRT.pts.map((c,i)=>{const p=cPt(c);return `<tr><td>${i+1}</td><td><span class="badge" style="background:${p&&typeof MCOL!=='undefined'&&MCOL[p.m]||'var(--acc)'}">${esc(c)}</span>${p?esc(p.p):''}</td>
    <td style="white-space:nowrap"><button class="b alt" style="padding:.25rem .55rem" title="${esc(CNU('rUp'))}" aria-label="${esc(CNU('rUp'))}" onclick="rtnMove(${i},-1)" ${i===0?'disabled':''}>▲</button>
    <button class="b alt" style="padding:.25rem .55rem" title="${esc(CNU('rDown'))}" aria-label="${esc(CNU('rDown'))}" onclick="rtnMove(${i},1)" ${i===CRT.pts.length-1?'disabled':''}>▼</button>
    <button class="b alt" style="padding:.25rem .55rem" title="${esc(CNU('rDel'))}" aria-label="${esc(CNU('rDel'))}" onclick="rtnDel(${i})">✕</button></td></tr>`}).join('');
  const pregWarn=CRT.pts.map(cPt).filter(p=>p&&CPREG.test(p.w||'')).map(p=>p.c);
  box.innerHTML=`<div class="card" id="rtn-ed">
   <div class="bar"><input id="rtn-name" maxlength="80" placeholder="${esc(CNU('rNamePh'))}" aria-label="${esc(CNU('rName'))}" value="${esc(CRT.name)}" oninput="CRT.name=this.value">
    <select aria-label="${esc(CNU('rSec'))}" onchange="CRT.sec=+this.value">${CSEC.map(s=>`<option value="${s}" ${CRT.sec===s?'selected':''}>${s} ${esc(CNU('rSecU'))} / ${esc(CNU('perPt'))}</option>`).join('')}</select></div>
   <div class="bar"><input id="rtn-q" type="search" placeholder="${esc(CNU('rAddPh'))}" autocomplete="off" oninput="rtnSug(this.value)" onkeydown="rtnKey(event)"></div>
   <div id="rtn-sug"></div>
   ${CRT.pts.length?`<div class="tw"><table>${rows}</table></div>`:`<p class="mut">${esc(CNU('rEmpty'))}</p>`}
   ${pregWarn.length?`<p class="w" style="color:var(--acc2)">⚠ ${esc(CNU('pregN'))}${pregWarn.join(', ')}.</p>`:''}
   <div class="bar"><button class="b" onclick="rtnSave()">${esc(CNU('rSave'))}</button><button class="b alt" onclick="rtnStartDraft()" ${CRT.pts.length?'':'disabled'}>${esc(CNU('rStartDraft'))}</button><button class="b alt" onclick="rtnClear()">${esc(CNU('rNew'))}</button></div>
   ${CRT.msg?`<p class="mut" role="status">${esc(CRT.msg)}</p>`:''}
  </div>
  ${R.length?R.map(r=>`<details ${r.fav?'open':''}><summary>${r.fav?'★ ':''}${esc(r.name)} <span class="tag">${r.pts.length} · ${r.sec||60} ${esc(CNU('rSecU'))}</span></summary>
    <p>${r.pts.map(cPtTag).join('')}</p>
    <div class="bar"><button class="b" onclick="rtnStart('${esc(r.id)}')">${esc(CNU('rStart'))}</button><button class="b alt" onclick="rtnEdit('${esc(r.id)}')">${esc(CNU('rEdit'))}</button>
     <button class="b alt" onclick="rtnFav('${esc(r.id)}')">${r.fav?'★':'☆'} ${esc(CNU('rFav'))}</button><button class="b alt" onclick="rtnPrint('${esc(r.id)}')">🖨 ${esc(CNU('rPrint'))}</button>
     <button class="b alt" onclick="rtnDup('${esc(r.id)}')">${esc(CNU('rDup'))}</button><button class="b alt" onclick="rtnRemove('${esc(r.id)}')">${esc(CNU('rDel'))}</button></div></details>`).join(''):`<p class="mut">${esc(CNU('rNone'))}</p>`}
  <details><summary>${esc(CNU('ioT'))}</summary>
   <textarea id="rtn-io" rows="6" style="width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.5rem;font:13px monospace" placeholder="${esc(CNU('ioPh'))}" aria-label="JSON" oninput="CRT.io=this.value">${esc(CRT.io)}</textarea>
   <div class="bar"><button class="b alt" onclick="rtnExport()">${esc(CNU('rExport'))}</button><button class="b" onclick="rtnImport()">${esc(CNU('rImport'))}</button></div></details>`;
}

/* ================= CURS structurat (niveluri → lecții → întrebări) ================= */
const COURSE=[{"id": "L1", "titlu": "Fundamente și istorie", "descriere": "Ce sunt acupunctura, acupresura și variantele conexe, de unde vin și cum le privim critic. Nivelul se încheie cu regulile de siguranță care contează cel mai mult.", "lectii": [{"id": "L1-1", "titlu": "Ce sunt acupunctura, acupresura și variantele conexe", "minute": 8, "text": ["Acupunctura este o tehnică în care ace foarte fine, sterile, sunt introduse în puncte alese ale corpului, de obicei pentru 15–30 de minute. Numele vine din latinescul „acus” (ac) și „pungere” (a înțepa). În tradiția medicinei chineze (MTC), punctele sunt considerate locuri în care se poate influența circulația Qi-ului. Cercetarea modernă vorbește mai prudent: stimularea țesuturilor superficiale și profunde poate modifica semnalele nervoase ale durerii și unele reacții vegetative.", "Acupresura folosește aceleași puncte, dar fără ace: se aplică presiune cu degetul, cu articulația degetului sau cu un obiect rotunjit. Este varianta cea mai accesibilă pentru autoîngrijire, deoarece nu pătrunde în piele și riscurile sunt mult mai mici. Rămâne totuși o intervenție reală asupra corpului, cu limite și precauții, pe care le vom discuta în lecția 4.", "În jurul acestor două metode există o familie largă de variante. Unele păstrează acul, dar schimbă stimulul: electroacupunctura trece un curent slab prin ace, iar acupunctura auriculară lucrează pe urechea externă. Altele folosesc căldură (moxibustia, cu pelin ars), vacuum (ventuzele), frecare sau presiune (gua sha, masajul tuina, shiatsu) ori dispozitive moderne (laser de joasă intensitate, stimulare electrică cutanată). Există și practici de mișcare și respirație, precum qigong, care aparțin aceleiași culturi medicale, dar nu mai sunt „tehnici de puncte”.", "În aplicație vei vedea mereu aceeași distincție: ce spune tradiția și ce susțin studiile. Dovezile moderne sunt moderate pentru unele dureri cronice (lombară, de genunchi, cefalee) și pentru greața postoperatorie sau cea din chimioterapie. Pentru multe alte afecțiuni dovezile sunt slabe sau contradictorii. Studiile cu „acupunctură simulată” (sham) arată adesea diferențe mici față de acupunctura reală, ceea ce sugerează că o parte din beneficiu vine din context: atenția, ritualul, așteptarea și relaxarea. Acest efect este real pentru persoana care îl trăiește, dar nu trebuie confundat cu un mecanism specific al punctelor."], "cheie": ["Acupunctura folosește ace; acupresura folosește doar presiune, fără pătrundere în piele.", "Variantele conexe schimbă stimulul (căldură, curent, vacuum, laser) sau zona (ureche, mână, scalp).", "MTC explică prin Qi; cercetarea modernă vorbește despre modularea nervoasă a durerii.", "Dovezile sunt moderate pentru unele dureri cronice și greață, slabe sau mixte pentru multe alte afecțiuni.", "O parte din efect este contextual (așteptare, atenție, relaxare), nu doar specific punctului."], "practica": "Ia o foaie și împarte-o în trei coloane: „cu ace”, „fără ace”, „cu căldură/vacuum/altele”. Pune sub fiecare coloană cel puțin două metode din lecție, apoi marchează cu un asterisc pe cele pe care le-ai întâlnit deja în viața reală. Nu aplica nicio tehnică acum; scopul este orientarea.", "puncte": [], "variante": ["acu-cl", "acupresura", "moxa-d", "ea"], "intrebari": [{"q": "Care este diferența principală dintre acupunctură și acupresură?", "corect": "Acupresura stimulează punctele prin presiune, fără ace care pătrund în piele.", "gresite": ["Acupresura folosește alte puncte decât acupunctura.", "Acupresura se face doar cu căldură.", "Acupunctura nu a fost niciodată studiată științific."], "explicatie": "Punctele pot fi aceleași; diferă stimulul. Acupresura nu străpunge pielea, de aceea riscurile sunt mai mici."}, {"q": "Ce înseamnă faptul că studiile sham găsesc adesea diferențe mici față de acupunctura reală?", "corect": "O parte din beneficiu poate proveni din context și așteptare, nu doar din punctul ales.", "gresite": ["Acupunctura nu produce niciodată vreun efect resimțit.", "Punctele alese nu contează deloc, în nicio situație.", "Studiile sunt întotdeauna greșite."], "explicatie": "Efectul contextual este real ca experiență, dar nu dovedește un mecanism specific al punctelor. Concluzia corectă este nuanțată, nu categorică."}, {"q": "Care dintre următoarele este o variantă conexă care folosește căldură?", "corect": "Moxibustia", "gresite": ["Ventuzele cu vacuum", "Electroacupunctura", "Acupunctura auriculară"], "explicatie": "Moxibustia arde pelin (Artemisia) lângă puncte. Ventuzele folosesc vacuum, electroacupunctura curent slab, iar cea auriculară lucrează pe ureche."}]}, {"id": "L1-2", "titlu": "Istorie pe scurt: de la Huangdi Neijing la UNESCO", "minute": 9, "text": ["Cea mai veche sursă clasică a medicinei chineze este Huangdi Neijing („Canonul intern al Împăratului Galben”), o colecție de texte alcătuită în perioada Han, aproximativ între secolele al II-lea și I î.Hr., deși unele părți par mai vechi. Are două mari secțiuni, Suwen („Întrebări simple”) și Lingshu („Pivotul spiritual”), prezentate ca dialoguri între împărat și medicii săi. Lingshu descrie ace, meridiane și tehnici de înțepare. Textul nu este opera unui singur autor, iar atribuirea către un împărat mitic este o convenție literară.", "Un pas important a fost Zhenjiu Jiayijing („Marele compendiu al acupuncturii și moxibustiei”), compilat de Huangfu Mi în jurul anului 282 d.Hr. Autorul a reorganizat materialul mai vechi într-o structură sistematică de puncte, localizări și indicații. A devenit o referință pentru secole, iar localizările din el au influențat decisiv tradiția ulterioară.", "Din China, practica a călătorit spre est. Pe cale budistă și diplomatică a ajuns în Coreea și Japonia în primele secole d.Hr., iar acolo a căpătat forme proprii, de exemplu stilul japonez, mai blând, cu ace foarte subțiri. În Europa, informații au sosit prin misionari iezuiți în secolul al XVII-lea, iar medicul olandez Willem ten Rhijne a scris despre acupunctură în 1683. În secolul XX, diplomatul francez Georges Soulié de Morant a popularizat-o în Franța. Interesul occidental a crescut mult după 1971–1972, când vizita președintelui american în China și un reportaj din presă despre o intervenție chirurgicală au atras atenția publicului.", "După 1950, în China s-a produs o standardizare: manuale unificate, școli de stat, integrare în spitale. Organizația Mondială a Sănătății a publicat ulterior nomenclatura standard a punctelor, cea pe care o folosim în aplicație (de exemplu LI4, ST36). În 2010, UNESCO a înscris „Acupunctura și moxibustia din medicina tradițională chineză” pe Lista reprezentativă a patrimoniului cultural imaterial al umanității.", "Atenție la o capcană frecventă: prestigiul istoric sau recunoașterea culturală nu demonstrează eficacitatea clinică. Înscrierea UNESCO, de pildă, protejează o tradiție culturală, nu certifică un tratament. Eficacitatea se evaluează prin studii clinice, iar vechimea unei practici este doar un context, nu o dovadă."], "cheie": ["Huangdi Neijing (Suwen și Lingshu) datează din perioada Han, cam secolele II–I î.Hr., și este o compilație, nu opera unui singur autor.", "Zhenjiu Jiayijing (Huangfu Mi, cca 282 d.Hr.) a sistematizat punctele și localizările.", "Practica s-a răspândit în Coreea și Japonia, apoi în Europa prin misionari și, în secolul XX, prin pionieri ca Soulié de Morant.", "UNESCO (2010) a recunoscut acupunctura și moxibustia ca patrimoniu cultural imaterial.", "Vechimea și recunoașterea culturală nu dovedesc eficacitatea clinică."], "practica": "Fă o axă a timpului pe o foaie, cu cinci repere: Huangdi Neijing, Zhenjiu Jiayijing, Japonia/Coreea, Europa (1683 și secolul XX), UNESCO 2010. Pentru fiecare reper scrie o propoziție în cuvintele tale. Apoi adaugă sub axă o întrebare: „Ce demonstrează și ce nu demonstrează acest fapt despre eficacitate?”", "puncte": [], "variante": ["acu-cl", "jap", "mtc"], "intrebari": [{"q": "Cine a compilat Zhenjiu Jiayijing, în jurul anului 282 d.Hr.?", "corect": "Huangfu Mi", "gresite": ["Împăratul Galben", "Georges Soulié de Morant", "Willem ten Rhijne"], "explicatie": "Huangfu Mi a sistematizat materialul mai vechi. Împăratul Galben este figura literară din Huangdi Neijing, iar ceilalți doi sunt autori europeni ulteriori."}, {"q": "Ce a recunoscut UNESCO în 2010?", "corect": "Acupunctura și moxibustia ca patrimoniu cultural imaterial", "gresite": ["Eficacitatea clinică a acupuncturii pentru toate bolile", "Meridianele ca structuri anatomice demonstrate", "Acupunctura ca tratament oficial al tuturor sistemelor de sănătate"], "explicatie": "Înscrierea protejează o tradiție culturală. Ea nu validează clinic tratamentul și nu dovedește existența anatomică a meridianelor."}, {"q": "De ce este vechimea unei practici un argument slab pentru eficacitate?", "corect": "Pentru că eficacitatea se stabilește prin studii clinice, iar multe practici vechi s-au dovedit ineficiente.", "gresite": ["Pentru că practicile vechi sunt întotdeauna periculoase.", "Pentru că istoria nu are nicio legătură cu medicina.", "Pentru că numai practicile noi pot fi studiate."], "explicatie": "Istoria explică de unde vine o practică, nu dacă funcționează. Verificarea se face prin cercetare, cu atenție la efectul placebo și contextual."}]}, {"id": "L1-3", "titlu": "Qi, Yin–Yang și substanțele fundamentale: cadru tradițional și explicații moderne", "minute": 9, "text": ["În MTC, Qi (se citește aproximativ „ci”) este ideea centrală. Se descrie ca o activitate vitală care mișcă, încălzește, apără și transformă. Nu este o substanță măsurabilă în sens fizic, ci un concept explicativ: o schemă prin care medicii tradiționali ordonau observațiile despre energie, digestie, respirație sau rezistență la boli. Când spunem „în tradiția MTC, Qi-ul este blocat”, descriem un model, nu o structură pe care am fi văzut-o la microscop.", "Yin și Yang sunt o pereche de opuse complementare. Yang se asociază cu activitatea, căldura, exteriorul, partea superioară ș
