*{box-sizing:border-box}
html{scroll-behavior:smooth}

.top{display:flex;gap:.6rem;align-items:center;padding:.55rem .9rem;max-width:1100px;margin:auto;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.12em;color:var(--acc);font-size:1.15rem;white-space:nowrap;cursor:pointer}

.top input[type=search]{flex:1;min-width:150px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.95rem}
select,button.ib{padding:.45rem .55rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.9rem}
nav{display:flex;overflow-x:auto;gap:.25rem;padding:0 .7rem .5rem;max-width:1100px;margin:auto;scrollbar-width:thin}
nav a{white-space:nowrap;text-decoration:none;color:var(--mut);padding:.4rem .8rem;border-radius:999px;font-size:.9rem;border:1px solid transparent}

main{max-width:1100px;margin:auto;padding:1rem .9rem 2rem}

.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.hero{background:linear-gradient(135deg,var(--acc),#1f5a4e);color:#fff;border-radius:18px;padding:1.4rem 1.2rem}

.mut{color:var(--mut);font-size:.9rem}

button.b{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.55rem .95rem;font-size:.95rem;cursor:pointer}

details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.1rem .9rem;margin:.5rem 0}
details summary{cursor:pointer;padding:.65rem 0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin:.5rem 0}th,td{border-bottom:1px solid var(--line);padding:.45rem .5rem;text-align:left;vertical-align:top}th{color:var(--acc)}
.tw{overflow-x:auto}
ul{padding-left:1.2rem}li{margin:.2rem 0}
.clock{display:flex;flex-wrap:wrap;gap:.35rem}.clock span{padding:.3rem .55rem;border-radius:8px;border:1px solid var(--line);font-size:.82rem;background:var(--card)}.clock span.now{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:.35rem 0;padding:.65rem .8rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:.98rem;cursor:pointer}
.opt.ok{background:#2f7d6d;color:#fff;border-color:#2f7d6d}.opt.no{background:#b5573a;color:#fff;border-color:#b5573a}
.modal{position:fixed;inset:0;background:rgba(10,18,16,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal .box{background:var(--card);border-radius:20px;max-width:520px;width:100%;padding:1.3rem;text-align:center;max-height:96vh;overflow:auto}
.breath{width:130px;height:130px;margin:.8rem auto;border-radius:50%;background:radial-gradient(circle,var(--acc),#1f5a4e);animation:br 8s ease-in-out infinite;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:700}
@keyframes br{0%,100%{transform:scale(.7);opacity:.7}50%{transform:scale(1.05);opacity:1}}
@media(prefers-reduced-motion:reduce){.breath{animation:none}html{scroll-behavior:auto}}
footer{max-width:1100px;margin:0 auto;padding:1.2rem .9rem 2.2rem;border-top:1px solid var(--line);color:var(--mut);font-size:.85rem;text-align:center}
footer a{display:inline-block;margin:.4rem .3rem 0;padding:.4rem .9rem;border-radius:999px;background:var(--gold);color:#201a05;text-decoration:none;font-weight:700}
svg text{font-family:inherit}
.elp{cursor:pointer}

moxa-i¦Moxibustie indirectă (ghimbir, usturoi, sare, cutie)¦cald¦1¦2¦l¦p¦China antică; descrisă în texte clasice¦Între moxă și piele se interpune un strat izolator: felie de ghimbir, usturoi sau sare în ombilic (CV8), sau o cutie/bol cu moxă așezat pe piele. Căldura este mai blândă și mai uniformă.¦Alegerea zonei // Pregătirea feliei (ghimbir 2–3 mm cu găuri mici) sau a stratului de sare // Plasarea conului de moxă pe izolator // Aprinderea // Înlocuirea conului când se consumă (3–7 repetări) // Verificarea pielii // Sau: așezarea cutiei de moxă pe abdomen/spate cu un prosop sub ea¦Ghimbir proaspăt, usturoi, sare, cutie de moxă, prosop¦15–30 min¦CV8 (ombilic), CV4, CV6, ST36, BL23, lombar¦Frig, balonare, dureri abdominale „reci”, dureri lombare, oboseală¦Limitate; unele studii pentru dureri articulare și digestie.¦Risc de arsuri minore; ventilează. Nu se aplică la febră mare, piele lezată, la persoane cu sensibilitate redusă a pielii.¦Practicieni formați sau auto-aplicare cu dispozitive sigure

vent-u¦Ventuze uscate (staționare, glisante, flash)¦vid¦0¦2¦l¦p¦China, Egipt antic, Orient Mijlociu, Europa (sec. XIX)¦Ventuze din sticlă, silicon sau plastic creează vid pe piele, ridicând țesutul și mărind fluxul sanguin local. Tipuri: staționar (5–15 min), glisant (ventuza se mișcă pe uleiul aplicat), flash (aplicare și scoatere repetate).¦Piele curată, fără rănire // Ungere cu ulei (pentru glisat) // Aplicarea ventuzei (pompă, flacără sau silicon) // Staționar 5–15 min sau glisare lentă // Eliberarea vidului apăsând pielea lângă ventuză // Curățarea zonei, hidratare¦Ventuze din sticlă/silicon, pompă, ulei¦5–15 min, 1/săptămână¦Spate (lângă coloană), umăr, coapsă, gambă¦Tensiune musculară, dureri cervicale/lombare¦Limitate; calitatea studiilor este scăzută; unele pentru dureri cervicale și lombare.¦Vânătăi circulare 3–10 zile; arsuri la ventuzele cu flacără; nu pe piele lezată, la coagulopatii, anticoagulante, sarcină (abdomen/lombar).¦Terapeuți formați; auto-aplicare cu ventuze din silicon
hijama¦Ventuze umede (Hijama / Hijamah)¦vid¦2¦3¦w¦n¦Orientul Mijlociu (tradiția islamică și medicina persană), Egipt, China¦Se aplică ventuza uscat, apoi se fac mici incizii superficiale și se reaplică vidul pentru a extrage mici cantități de sânge, în scopul „purificării”.¦Dezinfecție, ventuze aplicate 3–5 min // Scoaterea ventuzelor // Incizii superficiale cu lanțetă sterilă // Reaplicarea ventuzelor 3–5 min // Scoatere, curățare, pansament // Eliminarea materialelor în containere speciale¦Ventuze sterile, lanțete de unică folosință, mănuși, dezinfectante¦1–3 ședințe/an uzual¦Spate, între omoplați, zona C7¦Durere, cefalee, hipertensiune (uz tradițional)¦Slabe; unele studii mici pentru durere, calitate scăzută.¦Risc de infecții și transmiterea patogenilor din sânge dacă materialele nu sunt sterile; anemie; fără coagulopatii/anticoagulante.¦Practicieni autorizați cu igienă strictă
gua¦Gua Sha (răzuire terapeutică)¦vid¦0¦1¦l¦d¦China; echivalente: Cao Gio (Vietnam), Kerokan (Indonezia), coining (Occident)¦Pielea unsă cu ulei se răzuiește cu un instrument neted (jad, corn, oțel, ceramică, monedă) până apar peteșii roșii (sha). Tradițional se consideră că eliberează stagnarea și „căldura” din țesut.¦Ungere cu ulei // Răzuire unidirecțională, cu unghi ~45°, 10–30 mișcări pe zonă // Presiune moderată, 3–5 min/zonă // Apariția peteșiilor roșii (sha), care dispar în 2–7 zile // Curățarea uleiului // Evitarea frigului și a dușului fierbinte imediat după¦Instrument neted (jad, oțel, corn), ulei de masaj¦Ședință 10–20 min, la 5–7 zile¦Gât, umeri, spate (de-a lungul coloanei), picioare¦Tensiune musculară, dureri cervicale, răceli (tradițional)¦Limitate; unele studii pentru durere cervicală.¦Peteșii/echimoze temporare; nu pe piele lezată, cu coagulopatii, anticoagulante, infecții, vene varicoase.¦Terapeuți MTC; auto-aplicare ușoară

laser¦Laserpunctură (acupunctură cu laser de nivel scăzut)¦tehno¦0¦1¦l¦n¦Sec. XX (anii 1970); popular în Europa de Est și Asia¦Un laser de nivel scăzut (650–1064 nm, 5–100 mW) iradiază punctul fără a străpunge pielea. Propune efecte fotochimice și neuromodulatoare. Atractiv pentru copii și pentru cei care se tem de ace.¦Alegerea punctului // Echipament cu protecție pentru ochi // Plasarea sondei perpendicular pe piele // Iradiere 10–60 s/punct // Repetare pe 4–8 puncte // Curățarea sondei între pacienți¦Laser terapeutic cu sondă, ochelari de protecție¦8–15 ședințe, 2–3/săptămână¦Puncte de acupunctură, articulații, zone dureroase¦Durere musculo-scheletică, tendinopatii, copii (fără ace), dureri ale ATM¦Limitate–moderate pentru unele dureri musculo-scheletice; rezultate variabile.¦Protecția ochilor obligatorie; nu pe tumori, pe abdomen în sarcină, pe glanda tiroidă; precauție la fotosensibilizare.¦Clinicieni cu aparat autorizat
teas¦TENS / TEAS (stimulare electrică transcutanată a punctelor)¦tehno¦0¦1¦m¦p¦Anii 1960–70 (TENS), adaptat la acupunctură în China¦Electrozi de suprafață trimit curent slab pe piele, în zonele durerii sau pe puncte de acupunctură (TEAS). Mecanism: poartă de control a durerii și eliberare de endorfine.¦Piele curată, fără răni // Electrozi lipiți pe punct sau pe zonă // Alegerea frecvenței (2–4 Hz sau 80–100 Hz) // Creșterea intensității până la furnicătură confortabilă // 20–30 min // Oprirea aparatului înainte de scoaterea electrozilor¦Aparat TENS, electrozi autoadezivi¦20–30 min, 1–3 ori/zi¦Zonă dureroasă, puncte locale, PC6, ST36, LI4¦Durere cronică, dureri postoperatorii, greață¦Moderate pentru unele dureri și greață; rezultate dependente de parametri.¦Contraindicat cu stimulator cardiac, în sarcină (abdomen), epilepsie; nu pe gât anterior, ochi, piele lezată.¦Fizioterapeuți, medici; aparat de uz personal
band¦Brățări electrice și mecanice pentru greață (P6)¦tehno¦0¦1¦m¦d¦Anii 1980–90¦Stimulează punctul PC6 la încheietură cu un buton care apasă mecanic (Sea-Band) sau cu impulsuri electrice (ReliefBand). Folosit pentru rău de mișcare și greață.¦Găsirea PC6 (2 cun deasupra pliului încheieturii) // Poziționarea butonului pe punct // Verificarea presiunii fără a întrerupe circulația // Purtare cu 15–30 min înainte de călătorie sau tratament // Reglarea intensității (modelele electrice)¦Brățară elastică cu buton sau dispozitiv electric¦Purtare continuă în episod¦PC6 (ambele încheieturi)¦Rău de mișcare, greață postoperatorie, greață de sarcină (cu medic)¦Moderate pentru greață postoperatorie și chimioterapie; mixte pentru sarcină.¦Foarte sigură; nu strânge prea tare; dispozitivele electrice nu se folosesc cu stimulator cardiac.¦Pacientul singur

diap¦Diapazoane și vibrație (acutonics)¦tehno¦0¦1¦w¦p¦Sec. XX; Acutonics (Donna Carey, anii 1990)¦Un diapazon vibrant (de ex. 128 Hz) se aplică pe punctele de acupunctură sau se ține lângă ele pentru stimulare acustică și vibratorie, fără ace.¦Activarea diapazonului lovit // Plasarea piciorului diapazonului pe punct // Menținere 10–30 s // Mutarea pe punctul următor // Respirație calmă¦Diapazoane medicale (128 Hz, 64 Hz etc.)¦10–20 min¦Puncte pe încheieturi, glezne, spate¦Relaxare, durere ușoară, copii¦Foarte limitate.¦Nu pe oase fracturate, implanturi; evită vibrația pe zone inflamate.¦Practicieni formați; auto-aplicare ușoară

aur¦Auriculoterapie (ureche)¦micro¦1¦2¦l¦p¦China antică; sistemul modern: Paul Nogier (Lyon, 1950–57); hartă chineză standardizată după 1980¦Pavilionul urechii este considerat un microsistem care reflectă corpul (silueta unui făt inversat, cu capul la lob). Se stimulează puncte cu ace mici, semințe (Vaccaria), magneți, laser sau electro.¦Inspecția urechii și identificarea zonelor sensibile // Dezinfecția urechii // Alegerea a 3–6 puncte (Shenmen, simpatic, organ, punct Zero etc.) // Aplicarea semințelor cu plasture sau a acelor mici // Pacientul apasă 20–30 s de 3–4 ori pe zi // Scoatere după 3–7 zile sau la iritație¦Semințe Vaccaria, ace mici, pensetă, plasturi, sondă de detecție¦Cure de 5–10 ședințe, aplicare 3–7 zile¦Shenmen, Simpatic, Punctul Zero, Rinichi, Ficat, Plămân, Stomac¦Durere acută, anxietate, insomnie, dependențe (adjuvant)¦Limitate–moderate pentru durere acută; calitatea variază și hărțile diferă între școli.¦Risc de infecții ale cartilajului (pericondrită) la ace; piele iritată; nu în infecții ale urechii.¦Medici și acupuncturiști formați; semințe cu auto-apăsare

nada¦Protocolul NADA (dependențe și stres)¦micro¦2¦2¦w¦n¦SUA, Lincoln Hospital din Bronx (Dr. Michael Smith), anii 1970¦Cinci puncte auriculare standard (Shenmen, simpatic, rinichi, ficat, plămân), ace cu tratament în grup, folosite ca adjuvant în dependențe și stres.¦Grup de pacienți așezați confortabil // Dezinfecție // Ace la cele 5 puncte pe ambele urechi // Relaxare 30–45 min în liniște // Scoaterea acelor // Reflexii scurte¦Ace fine, scaune confortabile, cameră liniștită¦30–45 min, 3–5 ori/săptămână în programe de dezintoxicare¦5 puncte auriculare¦Dependențe (adjuvant), stres, tulburări de somn¦Slabe–limitate; rezultate mixte; efect limitat în fața controlului.¦Ace ca la acupunctura clasică; infecții rare; nu înlocuiește tratamentul.¦Personal instruit NADA
scalp¦Acupunctură a scalpului (Jiao și YNSA)¦micro¦2¦2¦l¦n¦China (Jiao Shunfa, anii 1970) și Japonia (Toshikatsu Yamamoto, YNSA, 1973)¦Se folosesc zone ale scalpului corespunzătoare funcțiilor corticale (motor, senzitiv, vorbire etc.). YNSA descrie puncte pe scalp (Y), gât și față pentru diverse organe.¦Evaluarea neurologică sau a durerii // Alegerea liniei/zonei scalpului // Inserție oblică a acului în planul subgaleal // Rotire rapidă 1–2 min // Retenție 20–30 min cu mobilizarea activă a membrului afectat // Scoatere¦Ace lungi fine, tampoane¦20–30 min, 2–3/săptămână¦Zone motorii, sensibile, de vorbire pe scalp¦Recuperare după AVC (adjuvant), durere, vertij¦Limitate; unele rezultate pozitive în reabilitare, dar calitatea scăzută.¦Aceleași riscuri ca la ace; hematom scalp frecvent; fără scalp infectat.¦Medici și acupuncturiști formați
hand¦Acupunctura mâinii (Koryo Sooji Chim)¦micro¦2¦2¦w¦p¦Coreea, Yoo Tae-woo (1971)¦Mâna este considerată o hartă a corpului (microsistem), cu 14 meridiane „mici” și puncte corespunzătoare organelor; se folosesc ace fine, magneți sau presiune.¦Inspectarea mâinii și identificarea zonei sensibile // Dezinfecție // Presiune sau ac fin în punct // Retenție 10–20 min // Mobilizarea zonei durerii în timpul tratamentului¦Ace fine, sondă de presiune, magneți mici¦10–20 min, 1–2/săptămână¦Puncte pe palmă și dosul mâinii¦Durere musculo-scheletică, cefalee, tulburări funcționale¦Foarte limitate.¦Aceleași riscuri ca la ace; presiunea poate fi făcută singur.¦Practicieni formați

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ptCard(p){
  const fav=S.fav.includes(p.c+'|'+p.p);
  const m=MER.find(x=>x.c===p.m);
  return `<div class="card pt" id="pt-${esc(p.c)}">
   <button class="star" onclick="toggleFav('${p.c}','${p.p}')" aria-label="fav">${fav?'★':'☆'}</button>
   <h3><span class="badge" style="background:${MCOL[p.m]}">${esc(p.c)}</span>${esc(p.p)}</h3>
   <p class="mut">${m?esc(m.n):'Puncte extra'} · ${esc(REG[p.r])}</p>
   ${p.mn?`<p class="mut"><i>${esc(p.mn)}</i></p>`:''}
   ${p.tg?`<p>${p.tg.split(',').filter(Boolean).map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}</p>`:''}
   <p><b>Localizare:</b> ${esc(p.l)}</p>
   <p><b>Indicații tradiționale:</b> ${esc(p.u)}</p>
   ${p.w?`<p class="w">${esc(p.w)}</p>`:''}
  </div>`}
function toggleFav(c,p){const k=c+'|'+p;const i=S.fav.indexOf(k);if(i<0)S.fav.push(k);else S.fav.splice(i,1);save();if(view()==='pts')renderPtsList();else render();}
function goPoint(c){PF.q=c;PF.m='';PF.r='';PF.fav=false;go('pts')}
function ptLink(c){return `<a href="#pts" onclick="goPoint('${c}')">${c}</a>`}
function linkify(s){return esc(s).replace(/\b(LU|LI|ST|SP|HT|SI|BL|KI|PC|TE|GB|LR|CV|GV)(\d{1,2})\b/g,(m,a,b)=>`<a href="#pts" onclick="goPoint('${m}')">${m}</a>`)}
function warnBox(txt){return `<div class="warn">⚠ ${txt}</div>`}
function disc(){return `<div class="warn">ℹ ${esc(T().disc)}</div>`}

const PF={q:'',m:'',r:'',fav:false};
function view(){return (location.hash||'#home').slice(1).split(':')[0]||'home'}
function go(v){if(location.hash==='#'+v)render();else location.hash='#'+v}
window.addEventListener('hashchange',()=>{$('#q').value='';render();window.scrollTo(0,0)});
function navList(){
  const L=T().nav;let arr=NAVK.map((k,i)=>({k,t:L[i]}));
  NAVX.forEach(x=>{const t=(x.l&&(x.l[S.lang]||x.l.en||x.l.ro))||x.k;const e={k:x.k,t};const i=x.after?arr.findIndex(y=>y.k===x.after):-1;if(i>=0){let j=i;while(arr[j+1]&&NAVX.some(z=>z.k===arr[j+1].k&&z.after===x.after))j++;arr.splice(j+1,0,e)}else arr.push(e)});
  return arr;
}
function renderNav(){
  const v=view();
  $('#nav').innerHTML=navList().map(x=>`<a href="#${x.k}" class="${x.k===v?'on':''}">${esc(x.t)}</a>`).join('');
}

const selEl={i:0};
function elSvg(){
  const cx=160,cy=150,R=105;
  const pos=EL.map((e,i)=>{const a=(-90+i*72)*Math.PI/180;return[cx+R*Math.cos(a),cy+R*Math.sin(a)]});
  const sh=(a,b,rr)=>{const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d;return[a[0]+ux*rr,a[1]+uy*rr,b[0]-ux*rr,b[1]-uy*rr]};
  let s='';
  for(let i=0;i<5;i++){const l=sh(pos[i],pos[(i+2)%5],27);s+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ak)"/>`}

  for(let i=0;i<5;i++){const sel=i===selEl.i;s+=`<g class="elp" onclick="selectEl(${i})"><circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="${sel?27:23}" fill="${EL[i].c}" stroke="${sel?'#fff':'none'}" stroke-width="3"/><text x="${pos[i][0]}" y="${pos[i][1]+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${EL[i].n}</text></g>`}
  return s;
}

/* --- sesiune presopunctură --- */
const SES={on:false,pts:[],i:0,sec:60,left:60,paused:false,timer:null,beep:true,title:''};
let AC=null;
function beep(f){if(!SES.beep)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||660;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();setTimeout(()=>o.stop(),180)}catch(e){}}
function startSes(i){
  const pr=PROT[i];SES.title=pr.t;SES.pts=pr.p.map(c=>PT.find(x=>x.c===c)).filter(Boolean);SES.i=0;SES.left=SES.sec;SES.on=true;SES.paused=false;
  clearInterval(SES.timer);SES.timer=setInterval(tick,1000);beep(880);drawSes();
}
function tick(){
  if(SES.paused)return;SES.left--;
  if(SES.left<=0){beep(660);if(SES.i<SES.pts.length-1){SES.i++;SES.left=SES.sec}else{endSes(true);return}}
  drawSes();
}
function endSes(done){clearInterval(SES.timer);SES.on=false;if(done){$('#modal').innerHTML=`<div class="modal"><div class="box"><h2>✔ Sesiune încheiată</h2><p>Stai încă 1–2 minute, respiră lent. Bea apă dacă dorești.</p><button class="b" onclick="$('#modal').innerHTML=''">OK</button></div></div>`;beep(990)}else $('#modal').innerHTML=''}
function sesNext(d){SES.i=Math.max(0,Math.min(SES.pts.length-1,SES.i+d));SES.left=SES.sec;drawSes()}
function sesPause(){SES.paused=!SES.paused;drawSes()}
function sesTime(v){SES.sec=+v;SES.left=SES.sec;drawSes()}
function drawSes(){
  if(!SES.on)return;const p=SES.pts[SES.i];
  $('#modal').innerHTML=`<div class="modal"><div class="box">
   <p class="mut">${esc(SES.title)} · ${SES.i+1}/${SES.pts.length}</p>
   <h2 style="margin:.2rem 0"><span class="badge" style="background:${MCOL[p.m]}">${esc(p.c)}</span>${esc(p.p)}</h2>
   <p style="margin:.3rem 0"><b>Localizare:</b> ${esc(p.l)}</p>
   ${p.w?`<p class="w" style="color:var(--acc2)">${esc(p.w)}</p>`:''}
   <div class="breath">${SES.left}</div>
   <p class="mut">Presiune fermă dar confortabilă · inspiră 4 s · expiră 6 s · ambele părți unde e cazul</p>
   <div class="bar" style="justify-content:center">
    <button class="b alt" onclick="sesNext(-1)" ${SES.i===0?'disabled':''}>◀</button>
    <button class="b" onclick="sesPause()">${SES.paused?'▶':'❚❚'}</button>
    <button class="b alt" onclick="sesNext(1)" ${SES.i===SES.pts.length-1?'disabled':''}>▶</button>
    <button class="b alt" onclick="endSes(false)">✕</button></div>
   <div class="bar" style="justify-content:center"><select onchange="sesTime(this.value)">${[30,45,60,90,120].map(s=>`<option value="${s}" ${SES.sec===s?'selected':''}>${s} s / punct</option>`).join('')}</select>
   <label class="mut" style="align-self:center"><input type="checkbox" ${SES.beep?'checked':''} onchange="SES.beep=this.checked"> sunet</label></div>
  </div></div>`;
}

  <ul><li>Folosește acupunctura și presopunctura ca <b>adjuvante</b>, nu ca înlocuitor al diagnosticului și tratamentului medical.</li>
  <li>Nu întrerupe medicamentele fără acordul medicului.</li>
  <li>Fii atent la promisiuni de „vindecări" miraculoase, cure scumpe sau diagnostice fără examinare.</li>
  <li>Verifică reglementarea practicii în țara ta (în multe țări acupunctura se practică de medici sau de personal înregistrat).</li></ul>
  <h2>Istorie pe scurt</h2>
  <ul><li><b>Sec. II–I î.Hr.:</b> <i>Huangdi Neijing</i> (Canonul Intern al Împăratului Galben) pune bazele teoriei.</li><li><b>Sec. III d.Hr.:</b> Huangfu Mi compilează <i>Zhenjiu Jiayijing</i> (sistematizare a punctelor).</li><li><b>1601:</b> Yang Jizhou, <i>Zhenjiu Dacheng</i>.</li><li><b>1971–1972:</b> Interesul occidental crește după vizita lui Nixon în China și relatările despre acupunctura în chirurgie.</li><li><b>1979–1991:</b> OMS publică liste de afecțiuni și nomenclatura standard a punctelor.</li><li><b>2010:</b> UNESCO — patrimoniu cultural imaterial.</li></ul>`;
}

/* --- QUIZ --- */
const QM=[
 ['Câți cun măsoară distanța dintre mameloane?','8',['6','10','12']],
 ['Care punct este „punctul de comandă" al feței și gurii?','LI4',['ST36','LU7','PC6']],
 ['Care punct este cel mai folosit pentru greață și rău de mișcare?','PC6',['LI4','BL60','GB41']],
 ['În ciclul Sheng, Lemnul generează:','Focul',['Pământul','Metalul','Apa']],
 ['În ciclul Ke, Apa controlează:','Focul',['Lemnul','Pământul','Metalul']],
 ['Elementul asociat toamnei:','Metal',['Lemn','Foc','Apă']],
 ['Tehnica japoneză cu presiune cu degetele:','Shiatsu',['Tuina','Moxa','Gua sha']],
 ['Moxibustia folosește arderea de:','Pelin (Artemisia)',['Salvie','Ghimbir','Cedru']],
 ['Care punct este evitat clasic în sarcină?','SP6',['PC6','HT7','GV20']],
 ['Câte puncte are meridianul vezicii urinare (BL)?','67',['45','54','72']],
 ['GV20 (Baihui) se află:','Pe creștet',['Pe frunte','În ceafă','În palmă']],
 ['Cine a compilat Zhenjiu Jiayijing?','Huangfu Mi',['Yang Jizhou','Sun Simiao','Hua Tuo']],
 ['Harta urechii în auriculoterapie seamănă cu:','Un făt inversat',['O inimă','O tigaie','O floare']],
 ['Gua Sha constă în:','Răzuirea pielii',['Arderea pelinului','Ventuze','Percuție ușoară']],
 ['Punctul-cheie pentru Dai Mai:','GB41',['SP4','TE5','KI6']],
 ['Punctul de influență al vaselor:','LU9',['GB34','BL17','CV17']],
 ['Punctul Yuan (sursă) al Inimii:','HT7',['PC6','LU7','SI3']],
 ['Cum se numește unitatea proporțională de măsurare a corpului?','Cun',['Li','Chi','Sen']],
 ['Care dintre meridiane NU face parte din cele 12 principale?','Ren Mai',['Plămân','Ficat','Rinichi']],
 ['Presopunctura este numită și:','Acupresură',['Acupunctură cu laser','Moxibustie','Auriculoterapie']],
 ['Ce înseamnă Hijama?','Ventuze umede',['Moxibustie','Gua sha','Reflexologie plantară']],
 ['Dien Chan este o formă de reflexologie:','Facială',['Plantară','Palmară','Auriculară']],
 ['Cine a descris hărțile auriculare moderne în Franța?','Paul Nogier',['William Fitzgerald','Tokujiro Namikoshi','Reinhold Voll']],
 ['Masajul tradițional thailandez a intrat pe lista UNESCO în:','2019',['1998','2005','2012']],
 ['Care variantă folosește un ciocănel cu 5–7 ace scurte?','Mei Hua / Qi Xing',['Fire needling','Ryodoraku','Tui Na']],
 ['Care dintre acestea este considerată fără dovezi științifice?','Kinesiologia aplicată (test muscular)',['Acupresura PC6 pentru greață','Acupunctura pentru lombalgie','Gua sha pentru tensiune']],
 ['Zen Shiatsu este asociat cu:','Shizuto Masunaga',['Tokujiro Namikoshi','Paul Nogier','Gary Craig']],
 ['Protocolul NADA folosește:','5 puncte auriculare',['3 puncte pe mână','12 puncte pe spate','1 punct pe creștet']]
];
const QZ={q:[],i:0,sc:0,ans:false};
function sh(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function genQ(){
  const out=[];
  for(const q of sh(QM).slice(0,6))out.push({t:q[0],a:q[1],o:sh([q[1],...q[2]])});
  for(let k=0;k<2;k++){const p=sh(PT.filter(x=>x.p&&x.c!=='EX'))[0];const w=sh(PT.filter(x=>x.p!==p.p)).slice(0,3).map(x=>x.p);out.push({t:`Care este numele pinyin al punctului ${p.c}?`,a:p.p,o:sh([p.p,...w])})}
  for(let k=0;k<1;k++){const m=sh(MER.filter(x=>x.t!=='—'))[0];const w=sh(MER.filter(x=>x.t!=='—'&&x.t!==m.t)).slice(0,3).map(x=>x.t);out.push({t:`În ce interval orar este maximul meridianului ${m.n}?`,a:m.t,o:sh([m.t,...w])})}
  for(let k=0;k<1;k++){const m=sh(MER.filter(x=>x.el!=='Extra'))[0];const w=['Lemn','Foc','Pământ','Metal','Apă'].filter(x=>x!==m.el);out.push({t:`Cărui element aparține meridianul ${m.n}?`,a:m.el,o:sh([m.el,...sh(w).slice(0,3)])})}
  return sh(out);
}
function vQuiz(){
  if(!QZ.q.length){QZ.q=genQ();QZ.i=0;QZ.sc=0;QZ.ans=false}
  if(QZ.i>=QZ.q.length){
    if(QZ.sc>S.best){S.best=QZ.sc;save()}
    return `<h1>Quiz</h1><div class="card"><h2>Rezultat: ${QZ.sc} / ${QZ.q.length}</h2><p>Cel mai bun scor: ${S.best}</p><button class="b" onclick="QZ.q=[];render()">Din nou</button></div>`;
  }
  const q=QZ.q[QZ.i];
  return `<h1>Quiz</h1><p class="mut">Întrebarea ${QZ.i+1} din ${QZ.q.length} · scor ${QZ.sc} · record ${S.best}</p>
  <div class="card"><h3>${esc(q.t)}</h3><div id="opts">${q.o.map((o,i)=>`<button class="opt" onclick="ansQ(${i})">${esc(o)}</button>`).join('')}</div>
  <div id="qres"></div></div>`;
}
function ansQ(i){
  if(QZ.ans)return;QZ.ans=true;const q=QZ.q[QZ.i];const btn=document.querySelectorAll('.opt');
  btn.forEach((b,j)=>{if(q.o[j]===q.a)b.classList.add('ok');else if(j===i)b.classList.add('no')});
  if(q.o[i]===q.a)QZ.sc++;
  $('#qres').innerHTML=`<button class="b" onclick="QZ.i++;QZ.ans=false;render()">${QZ.i<QZ.q.length-1?'Următoarea →':'Rezultat'}</button>`;
}

function vGloss(){
  const g=GLO.slice().sort((a,b)=>cmp(a[0],b[0]));
  return `<h1>Glosar</h1>${disc()}<div class="bar"><input id="gq" placeholder="Caută în glosar…" oninput="gFilter(this.value)"></div><div id="glist">${g.map(x=>`<details class="gl"><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`).join('')}</div>`;
}
function gFilter(v){v=v.toLowerCase();document.querySelectorAll('.gl').forEach(d=>d.style.display=d.textContent.toLowerCase().includes(v)?'':'none')}

/* --- căutare globală --- */
function doSearch(){
  const v=$('#q').value.trim().toLowerCase();
  if(v.length<2){render();return}
  const pts=PT.filter(p=>(p.c+' '+p.p+' '+p.l+' '+p.u+' '+p.tg+' '+p.mn).toLowerCase().includes(v)).slice(0,30);
  const mer=MER.filter(m=>(m.c+' '+m.n+' '+m.zh+' '+m.path+' '+m.key+' '+m.use).toLowerCase().includes(v));
  const glo=GLO.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(v));
  const tech=VAR.filter(t=>(t.n+' '+t.pr+' '+t.zon+' '+t.ind).toLowerCase().includes(v));
  const pro=PROT.filter(p=>(p.t+' '+p.n+' '+p.p.join(' ')).toLowerCase().includes(v));
  const any=pts.length+mer.length+glo.length+tech.length+pro.length;
  $('#main').innerHTML=`<h1>${esc(T().ph.replace('…',''))}: “${esc(v)}”</h1>${any?'':`<p class="mut">${esc(T().noRes)}</p>`}
  ${pts.length?`<h2>Puncte (${pts.length})</h2><div class="grid">${pts.map(ptCard).join('')}</div>`:''}
  ${mer.length?`<h2>Meridiane</h2>${mer.map(m=>`<div class="card" style="margin:.4rem 0"><h3><span class="badge" style="background:${MCOL[m.c]}">${m.c}</span>${esc(m.n)}</h3><p>${esc(m.path)}</p></div>`).join('')}`:''}
  ${pro.length?`<h2>Protocoale</h2>${pro.map(p=>`<div class="card" style="margin:.4rem 0"><h3>${esc(p.t)}</h3><p>${p.p.map(c=>`<span class="tag">${c}</span>`).join('')}</p></div>`).join('')}`:''}
  ${tech.length?`<h2>Variante (${tech.length})</h2>${tech.slice(0,25).map(t=>`<div class="card" style="margin:.4rem 0"><h3>${esc(t.n)}</h3><p>${esc(t.pr)}</p><a href="#tech" onclick="TF.q='${esc(t.n).replace(/'/g,'')}';TF.cat='';TF.open='${esc(t.id)}';$('#q').value='';render();return false">Vezi fișa →</a></div>`).join('')}`:''}
  ${glo.length?`<h2>Glosar</h2>${glo.map(g=>`<details open><summary>${esc(g[0])}</summary><p>${esc(g[1])}</p></details>`).join('')}`:''}`;
}

/* ================= RENDER ================= */
function render(){
  renderNav();const v=view();const m=$('#main');
  const map={home:vHome,theory:vTheory,mer:vMer,pts:vPts,acu:vAcu,tech:vTech,ear:vEar,cun:vCun,safe:vSafe,quiz:vQuiz,gloss:vGloss};
  const reg=VREG[v];
  m.innerHTML=(reg?reg.fn:(map[v]||vHome))();
  if(v==='pts')renderPtsList();
  if(v==='tech')renderVarList();
  if(reg&&reg.post)reg.post();
}
/* init */
load();document.documentElement.lang=S.lang;applyTheme();applyI18n();render();
</script>
