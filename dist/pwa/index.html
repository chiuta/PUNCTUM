*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.top{display:flex;gap:.6rem;align-items:center;padding:.55rem .9rem;max-width:1100px;margin:auto;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.12em;color:var(--acc);font-size:1.15rem;white-space:nowrap;cursor:pointer}
.logo small{display:block;font-weight:400;letter-spacing:0;font-size:.68rem;color:var(--mut)}
.top input[type=search]{flex:1;min-width:150px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.95rem}
select,button.ib{padding:.45rem .55rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.9rem}
nav{display:flex;overflow-x:auto;gap:.25rem;padding:0 .7rem .5rem;max-width:1100px;margin:auto;scrollbar-width:thin}
nav a{white-space:nowrap;text-decoration:none;color:var(--mut);padding:.4rem .8rem;border-radius:999px;font-size:.9rem;border:1px solid transparent}
nav a.on{background:var(--acc);color:#fff}
nav a:hover:not(.on){border-color:var(--line)}
main{max-width:1100px;margin:auto;padding:1rem .9rem 2rem}
h1{font-size:1.7rem;margin:.2rem 0 .6rem}h2{font-size:1.3rem;margin:1.4rem 0 .5rem;color:var(--acc)}h3{font-size:1.05rem;margin:1rem 0 .3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;box-shadow:var(--sh)}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.hero{background:linear-gradient(135deg,var(--acc),#1f5a4e);color:#fff;border-radius:18px;padding:1.4rem 1.2rem}
.hero h1{color:#fff;margin:0 0 .3rem;font-size:1.9rem;letter-spacing:.06em}.hero p{margin:.3rem 0;opacity:.95}
.warn{background:var(--warn);border:1px solid var(--warnb);border-radius:12px;padding:.7rem .9rem;margin:.8rem 0;font-size:.93rem}
.mut{color:var(--mut);font-size:.9rem}
.badge{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.78rem;font-weight:700;color:#fff;margin-right:.35rem}
.tag{display:inline-block;padding:.1rem .5rem;border-radius:8px;font-size:.78rem;background:var(--soft);color:var(--ink);margin:.1rem .15rem .1rem 0}
.pt{position:relative}.pt h3{margin:.1rem 0}.pt .star{position:absolute;right:.6rem;top:.5rem;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--gold)}
.pt p{margin:.25rem 0;font-size:.93rem}.pt .w{color:var(--acc2);font-size:.88rem}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}.bar input{flex:1;min-width:140px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button.b{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.55rem .95rem;font-size:.95rem;cursor:pointer}
button.b.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}button.b:disabled{opacity:.5}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.1rem .9rem;margin:.5rem 0}
details summary{cursor:pointer;padding:.65rem 0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin:.5rem 0}th,td{border-bottom:1px solid var(--line);padding:.45rem .5rem;text-align:left;vertical-align:top}th{color:var(--acc)}
.tw{overflow-x:auto}
ul{padding-left:1.2rem}li{margin:.2rem 0}
.clock{display:flex;flex-wrap:wrap;gap:.35rem}.clock span{padding:.3rem .55rem;border-radius:8px;border:1px solid var(--line);font-size:.82rem;background:var(--card)}.clock span.now{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:.35rem 0;padding:.65rem .8rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:.98rem;cursor:pointer}
.opt.ok{background:#2f7d6d;color:#fff;border-color:#2f7d6d}.opt.no{background:#b5573a;color:#fff;border-color:#b5573a}
.modal{position:fixed;inset:0;background:rgba(10,18,16,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal .box{background:var(--card);border-radius:20px;max-width:520px;width:100%;padding:1.3rem;text-align:center;max-height:96vh;overflow:auto}
.breath{width:130px;height:130px;margin:.8rem auto;border-radius:50%;background:radial-gradient(circle,var(--acc),#1f5a4e);animation:br 8s ease-in-out infinite;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:700}
@keyframes br{0%,100%{transform:scale(.7);opacity:.7}50%{transform:scale(1.05);opacity:1}}
@media(prefers-reduced-motion:reduce){.breath{animation:none}html{scroll-behavior:auto}}
footer{max-width:1100px;margin:0 auto;padding:1.2rem .9rem 2.2rem;border-top:1px solid var(--line);color:var(--mut);font-size:.85rem;text-align:center}
footer a{display:inline-block;margin:.4rem .3rem 0;padding:.4rem .9rem;border-radius:999px;background:var(--gold);color:#201a05;text-decoration:none;font-weight:700}
svg text{font-family:inherit}
.elp{cursor:pointer}

acuto¦Acupotomie (Xiao Zhen Dao — „ac-bisturiu”)¦ace¦2¦3¦w¦n¦China, Zhu Hanzhang (1976)¦Ac cu vârf plat/lamă mică pentru a secționa aderențe de țesut conjunctiv sau a „elibera” zone tensionate, în loc de simpla înțepare.¦Evaluarea clinică și imagistică, alegerea zonei // Dezinfecție, anestezie locală uneori // Inserția acului-bisturiu pe traseul planificat // Mișcări scurte de secționare // Compresie și pansament¦Ac-bisturiu steril, anestezic local¦Câteva ședințe, la 1–2 săptămâni¦Aderențe cervicale, lombare, tendinoase¦Tendinite, durere cronică, periartrită scapulo-humerală¦Slabe–limitate; puține studii independente.¦Procedură invazivă cu risc de lezare nervoasă/vasculară; doar medici instruiți.¦Medici cu pregătire specifică
sang¦Sângerare terapeutică (Dian Ci / puncte Jing-puț)¦ace¦2¦3¦w¦n¦China antică (Neijing); practici similare în multe culturi¦Cu o lanțetă se face o înțepătură superficială într-un punct (adesea la vârful degetelor sau al urechii) pentru a elibera o picătură sau câteva picături de sânge, tradițional pentru „căldură” și febră.¦Dezinfecția zonei // Înțeparea punctului cu lanțeta sterilă // Strângerea ușoară pentru 2–5 picături // Presiune cu tampon steril până la oprirea sângerării // Eliminarea lanțetei în container¦Lanțete sterile, tampoane, mănuși¦1–2 ședințe în episoade acute¦Vârfurile degetelor (EX-UE11), PC9, LU11, vârful urechii¦Febră, faringită, cefalee, intoxicații termice (uz tradițional)¦Slabe; fără studii solide.¦Risc de infecție și transmitere de patogeni prin sânge; doar cu material sterile de unică folosință. Fără coagulopatii/anticoagulante.¦Practicieni autorizați
tung¦Acupunctura Master Tung (Dong)¦ace¦2¦2¦w¦n¦Tung Ching-chang (1916–1975), Taiwan; populară în SUA¦Folosește un sistem propriu de puncte pe mână, braț, picior și față, care nu coincid cu meridianele clasice; punctele sunt alese după „zone” corporale și relații de imagine în oglindă.¦Alegerea zonei corporale „corespondente” // Palparea punctului la distanță de zona dureroasă // Inserție cu ac fin, adesea cu mișcarea simultană a zonei dureroase // Retenție 15–30 min¦Ace fine, tampoane¦1–2 ședințe pe săptămână¦Puncte pe mână (ex. zona Ling Gu/Da Bai), antebraț, picior¦Durere, mai ales musculo-scheletică și neuropatică¦Foarte limitate; în mare parte rapoarte de caz.¦Aceleași riscuri ca la acupunctura clasică.¦Acuponctori formați în sistemul Tung
acupresura¦Acupresură (presopunctură)¦pres¦0¦1¦m¦d¦China, foarte veche; parte din Tuina; popularizată global în sec. XX¦Presiune manuală fermă dar confortabilă pe aceleași puncte ca la acupunctură, fără ace. Efectul propus: stimulare mecanică a nervilor și țesutului conjunctiv, relaxare, modularea durerii.¦Poziție stabilă, relaxată; mâini curate // Localizarea punctului (cun, repere osoase, sensibilitate locală) // Presiune treptată, 3–5 s, cu pulpa degetului mare sau arătătorului // Menținerea presiunii fixe sau cu cercuri mici 30–90 s // Respirație lentă (inspir 4 s, expir 6 s) // Eliberare lentă; repetă pe partea opusă // 1–3 ori pe zi¦Degete, cot, bile de lemn, minge de tenis, capete rotunjite de lemn¦30–90 s/punct, 3–6 puncte/sesiune, 1–3 sesiuni/zi¦PC6, ST36, LI4, GB20, SP6, HT7, GV20 etc.¦Greață (P6), cefalee de tensiune, stres, insomnie, dureri menstruale ușoare, oboseală, dureri musculare¦Moderate pentru greață (P6); limitate–moderate pentru oboseală, anxietate și durere.¦În general sigură. Fără presiune pe răni, vene varicoase severe, tumori, fracturi; punctele ⚠ se evită în sarcină. Oprește la durere ascuțită sau amețeală.¦Oricine, cu instruire de bază; terapeuți de masaj/acupresori
shiatsu¦Shiatsu (Namikoshi și Zen Shiatsu Masunaga)¦pres¦0¦1¦l¦p¦Japonia; Tokujiro Namikoshi (Institutul de Shiatsu, 1940; recunoscut oficial în 1955), Shizuto Masunaga (Zen Shiatsu, anii 1970)¦Presiune cu degetele mari, palme, coate, genunchi pe corp îmbrăcat, plus întinderi. Stilul Namikoshi are bază anatomică și fiziologică; Zen Shiatsu (Masunaga) lucrează cu meridiane extinse și evaluarea abdomenului (hara).¦Interviu scurt și observație a posturii // (Masunaga) evaluarea hara și a pulsului // Poziționare comodă pe saltea (futon) // Presiune perpendiculară, lentă, cu greutatea corpului, 3–10 s pe punct // Mobilizări și întinderi pasive // Încheiere cu relaxare și respirație¦Saltea, haine largi; fără uleiuri¦30–60 min, 1/săptămână sau 2/săptămână, apoi lunar¦Spate, gât, șolduri, abdomen, picioare¦Tensiune musculară, stres, oboseală, dureri cervicale/lombare ușoare¦Limitate; calitatea studiilor este scăzută.¦Nu în febră, tromboză, osteoporoză severă, fracturi recente; atenție în sarcină (zone-cheie).¦Terapeuți shiatsu autorizați/formați
tuina¦Tuina (Tui Na) — masaj terapeutic chinez¦pres¦0¦2¦l¦n¦China, parte a MTC; spital și învățământ universitar¦Un sistem medical de manevre manuale pe meridiane, puncte și articulații. Cele opt manevre de bază: împingere (Tui), apucare (Na), apăsare (An), frecare circulară (Mo), rulare (Gun), frământare (Rou), frecare rapidă (Ca), scuturare (Dou).¦Diagnostic MTC // Alegerea manevrelor după sindrom și zonă // Încălzirea țesuturilor cu manevre ușoare // Manevre specifice (rulare, împingere, apăsare, frământare) // Mobilizarea articulațiilor (tracțiuni, rotații) numai de către practicieni instruiți // Încheiere cu manevre de calmare¦Mâinile practicantului; uneori uleiuri sau unguente cu plante¦20–40 min, 1–3/săptămână¦Gât, umeri, spate, șold, genunchi; mână și brațe la copii¦Cervicalgie, lombalgie, tensiune musculară, dureri de umăr, tulburări funcționale ale copilului (tuina pediatrică)¦Limitate–moderate pentru dureri cervicale și lombare.¦Manevrele articulare sunt riscante fără instruire; atenție la osteoporoză, tromboză, hernii de disc acute.¦Terapeuți de tuina formați (în China, medici)
anma¦Anma (Amma) japonez¦pres¦0¦1¦l¦n¦China → Japonia (sec. VI–VII), forma istorică a masajului japonez¦Masaj tradițional pe linii, cu frământare și presiune blândă; precursor al shiatsului. În Japonia a fost tradițional o profesie a persoanelor nevăzătoare.¦Pacientul stă așezat sau întins, îmbrăcat // Frecări ușoare pentru încălzire // Frământare și presiuni pe mușchi // Stretching ușor // Presiune scurtă pe puncte sensibile¦Mâini; scaun sau pat¦20–45 min¦Umeri, ceafă, spate, picioare¦Relaxare, tensiune musculară¦Foarte limitate.¦Siguranță comparabilă cu masajul clasic.¦Terapeuți de masaj
jsj¦Jin Shin Jyutsu și Jin Shin Do¦pres¦0¦1¦w¦p¦Japonia (Jiro Murai, 1886–1960; Mary Burmeister a răspândit-o în SUA din anii 1950–60) / SUA (Iona Teeguarden, Jin Shin Do, anii 1970)¦Jin Shin Jyutsu: atingere blândă, menținută, pe 26 „încuietori de siguranță a energiei” (Safety Energy Locks), uneori cu respirație. Jin Shin Do: presiune sacadată pe puncte de acupunctură combinată cu lucru emoțional (influență Reich).¦Pacientul stă îmbrăcat, întins // Practicantul ține mâinile pe două puncte simultan (JSJ) // Menține 1–5 min, urmărind „pulsul” local // Jin Shin Do: presiune fermă în pași succesivi, cu respirație și atenție la zonele tensionate // Încheiere cu relaxare¦Mâinile; salteaua sau patul¦45–60 min¦Mâini, umeri, spate, abdomen¦Relaxare, stres, tensiune; auto-aplicare pentru mâini și degete (JSJ)¦Foarte limitate; efecte probabil de relaxare.¦Siguranță bună; nu înlocuiește tratamentul medical.¦Practicieni certificați de școli private
thai¦Nuad Thai (masaj tradițional thailandez)¦pres¦0¦2¦l¦n¦Thailanda, tradiția Nuad Boran; înscris de UNESCO în 2019 pe lista patrimoniului imaterial¦Presiune cu palmele, degetele mari, coatele, genunchii și picioarele pe zece linii energetice (Sen Sib), plus întinderi pasive asemănătoare yoga, pe corp îmbrăcat.¦Salut (wai) și interviu scurt // Presiune pe linii de la picioare spre șolduri, apoi spate, brațe, gât // Stretching și mobilizare pasivă (yoga-like) // Presiune cu palmele pe puncte // Încheiere cu relaxare¦Saltea tare, haine largi, uneori comprese cu plante¦60–120 min¦Picioare, spate, șolduri, umeri¦Durere lombară, rigiditate, stres¦Limitate–moderate pentru durere lombară; studii mici.¦Fără întinderi forțate; atenție în osteoporoză, hernie de disc acută, sarcină, tromboză.¦Terapeuți Nuad Thai formați (în Thailanda, licențiați)
marma¦Marma (Ayurveda)¦pres¦0¦2¦w¦p¦India; Sushruta Samhita (sec. VI î.Hr.–sec. III d.Hr.), Kalaripayattu în Kerala¦107 puncte vitale (marma) unde se întâlnesc mușchi, vase, nervi, oase și articulații; se masează cu ulei de plante prin presiune circulară sau menținută pentru a echilibra cele trei doșa (vata, pitta, kapha).¦Evaluarea constituției (prakriti) // Ungere ușoară cu ulei medicinal // Presiune circulară sau menținută pe marma cu degetul mare // Mișcări lente, uneori cu respirație // Încheiere cu relaxare¦Uleiuri ayurvedice, mâini¦20–40 min¦Marma de pe picior (Kshipra), mână (Talahridaya), cap și gât¦Relaxare, durere musculară, stres (uz tradițional)¦Foarte limitate.¦Unele marma sunt zone vulnerabile (gât, abdomen, cap); presiune blândă; precauție în sarcină.¦Practicieni ayurvedici formați
trigger¦Compresie ischemică a punctelor trigger¦pres¦0¦1¦m¦d¦Medicina occidentală (Janet Travell și David Simons, anii 1950–1990)¦Presiune sustinută și progresivă pe o bandă musculară încordată, cu durere locală sau iradiată, până când sensibilitatea scade. Principiul: opreste spasmul și îmbunătățește circulația locală.¦Localizarea punctului trigger prin palpare // Presiune lentă până la „durere suportabilă” (6–7 din 10) // Menținere 30–90 s sau până când durerea scade cu 50% // Respirație lentă, relaxare musculară // Întindere ușoară a mușchiului după aceea // Repetare 2–3 ori¦Degete, cot, minge de tenis, Theracane, bile de masaj¦30–90 s/punct, 1–2 ori/zi¦Trapez superior, infraspinos, gluteu mijlociu, gambă¦Tensiune cronică, dureri miofasciale, cefalee de tensiune¦Moderate pentru ameliorare pe termen scurt a durerii miofasciale.¦Evită presiunea pe artere, nervi, zone inflamate, tumori; oprește la furnicături sau amorțeală.¦Kinetoterapeuți, terapeuți de masaj; auto-aplicare
acufacial¦Acupresură facială cosmetică și masaj cu jad¦pres¦0¦1¦w¦d¦Tradiții asiatice; Kobido (Japonia) și masaj cu role din jad/cuarț în trend modern¦Presiune ușoară și mișcări pe puncte ale feței (ST2, LI20, GB14, GV24) pentru relaxare musculară și circulație locală; se folosește frecvent cu rolă din jad sau cuarț.¦Fața curată, ulei sau ser // Presiune blândă 5–10 s pe fiecare punct // Mișcări ascendente și spre exterior, fără tragere de piele // Pe frunte, obraji și maxilar // Respirație lentă¦Degete, rolă de jad/cuarț, gua sha facial¦5–10 min/zi¦ST2, ST6, ST7, LI20, GB14, EX-HN5, BL2¦Relaxare facială, tensiune de maxilar, cefalee de tensiune¦Foarte limitate pentru efecte antirid/„lifting”; relaxarea este reală.¦Fără presiune pe acnee inflamată, rozacee, piele iritată; fără presiune pe globul ocular.¦Cosmeticieni instruiți sau auto-aplicare
moxa-d¦Moxibustie directă (con pe piele)¦cald¦1¦3¦l¦n¦China, antică; Japonia (okyu, sec. VI–VII)¦Un con mic de pelin (Artemisia) se arde direct pe punct. În varianta cu cicatrice, arsura este deliberată; în varianta fără cicatrice, conul se scoate înainte de a se arde pielea.¦Alegerea punctului și marcarea // Aplicarea unui strat subțire de pastă sau ulei // Așezarea conului (de mărimea unui bob de orez) // Aprinderea cu bețișor de tămâie // Scoaterea conului când pacientul simte căldură intensă // Repetarea 3–7 conuri // Curățarea zonei, pansament¦Moxă fină (Artemisia argyi), bețișor de tămâie, recipient pentru cenușă¦1–3 ședințe pe săptămână¦ST36, CV4, CV6, GV4, BL23¦Slăbiciune, frig, dureri articulare reci, digestie lentă (tradițional)¦Limitate; calitate scăzută.¦Risc de arsuri, cicatrici, infecții; fum iritant. Nu se aplică în febră mare, pe piele lezată sau pe abdomen în sarcină.¦Practicieni formați
moxa-i¦Moxibustie indirectă (ghimbir, usturoi, sare, cutie)¦cald¦1¦2¦l¦p¦China antică; descrisă în texte clasice¦Între moxă și piele se interpune un strat izolator: felie de ghimbir, usturoi sau sare în ombilic (CV8), sau o cutie/bol cu moxă așezat pe piele. Căldura este mai blândă și mai uniformă.¦Alegerea zonei // Pregătirea feliei (ghimbir 2–3 mm cu găuri mici) sau a stratului de sare // Plasarea conului de moxă pe izolator // Aprinderea // Înlocuirea conului când se consumă (3–7 repetări) // Verificarea pielii // Sau: așezarea cutiei de moxă pe abdomen/spate cu un prosop sub ea¦Ghimbir proaspăt, usturoi, sare, cutie de moxă, prosop¦15–30 min¦CV8 (ombilic), CV4, CV6, ST36, BL23, lombar¦Frig, balonare, dureri abdominale „reci”, dureri lombare, oboseală¦Limitate; unele studii pentru dureri articulare și digestie.¦Risc de arsuri minore; ventilează. Nu se aplică la febră mare, piele lezată, la persoane cu sensibilitate redusă a pielii.¦Practicieni formați sau auto-aplicare cu dispozitive sigure
moxa-s¦Țigară de moxă (moxă ținută deasupra pielii)¦cald¦1¦2¦l¦p¦China și Japonia¦Un baton de pelin presat se aprinde și se ține la 2–3 cm de piele. Se folosesc trei tehnici: ciocănirea de vrabie (mișcări scurte, în sus și în jos), cercul (rotire deasupra zonei) și încălzirea fixă.¦Aprinderea batonului // Menținerea la 2–3 cm de punct // Una dintre tehnici // Verificarea căldurii cu degetul liber // Oprire când pielea devine ușor roșie (5–10 min/punct) // Stingerea batonului în recipient cu nisip sau tub sigilat¦Baton de moxă (fără fum sau clasic), bol cu nisip, recipient de stingere¦5–15 min/punct, zilnic sau la câteva zile¦BL67 (prezentație pelviană — dovezi mixte, sub îndrumare), ST36, CV4, CV6, BL23¦Frig, dureri articulare, slăbiciune; BL67 în sarcină sub îndrumare¦Limitate; pentru prezentația pelviană dovezi mixte.¦Ventilație bună; risc de arsuri; fum iritant la astmatici; fără somn cu baton aprins.¦Practicieni formați sau auto-aplicare atentă
compresa¦Comprese calde cu plante (Luk Pra Kob)¦cald¦0¦1¦l¦p¦Thailanda, medicina tradițională; similar în Ayurveda și China¦Un săculeț cu ierburi (plai, turmeric, lemongrass, camfor) se încălzește la abur și se aplică pe corp, combinând căldura cu uleiurile volatile ale plantelor.¦Încălzirea compresei la abur 5–10 min // Testarea temperaturii pe încheietură // Aplicarea pe zonă cu presiune blândă // Mișcări de ștampilare și rulare // Reîncălzirea la nevoie¦Săculeți cu plante, oală cu abur¦15–30 min¦Spate, umăr, gât, picioare¦Rigiditate, dureri musculare, relaxare¦Foarte limitate.¦Atenție la arsuri; nu pe piele lezată; alergii la plante.¦Terapeuți Nuad Thai sau acasă
vent-u¦Ventuze uscate (staționare, glisante, flash)¦vid¦0¦2¦l¦p¦China, Egipt antic, Orient Mijlociu, Europa (sec. XIX)¦Ventuze din sticlă, silicon sau plastic creează vid pe piele, ridicând țesutul și mărind fluxul sanguin local. Tipuri: staționar (5–15 min), glisant (ventuza se mișcă pe uleiul aplicat), flash (aplicare și scoatere repetate).¦Piele curată, fără rănire // Ungere cu ulei (pentru glisat) // Aplicarea ventuzei (pompă, flacără sau silicon) // Staționar 5–15 min sau glisare lentă // Eliberarea vidului apăsând pielea lângă ventuză // Curățarea zonei, hidratare¦Ventuze din sticlă/silicon, pompă, ulei¦5–15 min, 1/săptămână¦Spate (lângă coloană), umăr, coapsă, gambă¦Tensiune musculară, dureri cervicale/lombare¦Limitate; calitatea studiilor este scăzută; unele pentru dureri cervicale și lombare.¦Vânătăi circulare 3–10 zile; arsuri la ventuzele cu flacără; nu pe piele lezată, la coagulopatii, anticoagulante, sarcină (abdomen/lombar).¦Terapeuți formați; auto-aplicare cu ventuze din silicon
hijama¦Ventuze umede (Hijama / Hijamah)¦vid¦2¦3¦w¦n¦Orientul Mijlociu (tradiția islamică și medicina persană), Egipt, China¦Se aplică ventuza uscat, apoi se fac mici incizii superficiale și se reaplică vidul pentru a extrage mici cantități de sânge, în scopul „purificării”.¦Dezinfecție, ventuze aplicate 3–5 min // Scoaterea ventuzelor // Incizii superficiale cu lanțetă sterilă // Reaplicarea ventuzelor 3–5 min // Scoatere, curățare, pansament // Eliminarea materialelor în containere speciale¦Ventuze sterile, lanțete de unică folosință, mănuși, dezinfectante¦1–3 ședințe/an uzual¦Spate, între omoplați, zona C7¦Durere, cefalee, hipertensiune (uz tradițional)¦Slabe; unele studii mici pentru durere, calitate scăzută.¦Risc de infecții și transmiterea patogenilor din sânge dacă materialele nu sunt sterile; anemie; fără coagulopatii/anticoagulante.¦Practicieni autorizați cu igienă strictă
gua¦Gua Sha (răzuire terapeutică)¦vid¦0¦1¦l¦d¦China; echivalente: Cao Gio (Vietnam), Kerokan (Indonezia), coining (Occident)¦Pielea unsă cu ulei se răzuiește cu un instrument neted (jad, corn, oțel, ceramică, monedă) până apar peteșii roșii (sha). Tradițional se consideră că eliberează stagnarea și „căldura” din țesut.¦Ungere cu ulei // Răzuire unidirecțională, cu unghi ~45°, 10–30 mișcări pe zonă // Presiune moderată, 3–5 min/zonă // Apariția peteșiilor roșii (sha), care dispar în 2–7 zile // Curățarea uleiului // Evitarea frigului și a dușului fierbinte imediat după¦Instrument neted (jad, oțel, corn), ulei de masaj¦Ședință 10–20 min, la 5–7 zile¦Gât, umeri, spate (de-a lungul coloanei), picioare¦Tensiune musculară, dureri cervicale, răceli (tradițional)¦Limitate; unele studii pentru durere cervicală.¦Peteșii/echimoze temporare; nu pe piele lezată, cu coagulopatii, anticoagulante, infecții, vene varicoase.¦Terapeuți MTC; auto-aplicare ușoară

const selEl={i:0};
function elSvg(){
  const cx=160,cy=150,R=105;
  const pos=EL.map((e,i)=>{const a=(-90+i*72)*Math.PI/180;return[cx+R*Math.cos(a),cy+R*Math.sin(a)]});
  const sh=(a,b,rr)=>{const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d;return[a[0]+ux*rr,a[1]+uy*rr,b[0]-ux*rr,b[1]-uy*rr]};
  let s='';
  for(let i=0;i<5;i++){const l=sh(pos[i],pos[(i+2)%5],27);s+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ak)"/>`}
  for(let i=0;i<5;i++){const l=sh(pos[i],pos[(i+1)%5],27);s+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#ah)"/>`}
  for(let i=0;i<5;i++){const sel=i===selEl.i;s+=`<g class="elp" onclick="selectEl(${i})"><circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="${sel?27:23}" fill="${EL[i].c}" stroke="${sel?'#fff':'none'}" stroke-width="3"/><text x="${pos[i][0]}" y="${pos[i][1]+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${EL[i].n}</text></g>`}
  return s;
}

const SES={on:false,pts:[],i:0,sec:60,left:60,paused:false,timer:null,beep:true,title:''};
let AC=null;
function beep(f){if(!SES.beep)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||660;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();setTimeout(()=>o.stop(),180)}catch(e){}}
function startSes(i){
  const pr=PROT[i];SES.title=pr.t;SES.pts=pr.p.map(c=>PT.find(x=>x.c===c)).filter(Boolean);SES.i=0;SES.left=SES.sec;SES.on=true;SES.paused=false;
  clearInterval(SES.timer);SES.timer=setInterval(tick,1000);beep(880);drawSes();
}
function tick(){
  if(SES.paused)return;SES.left--;
  if(SES.left<=0){beep(660);if(SES.i<SES.pts.length-1){SES.i++;SES.left=SES.sec}else{endSes(true);return}}
  drawSes();
}
function endSes(done){clearInterval(SES.timer);SES.on=false;if(done){$('#modal').innerHTML=`<div class="modal"><div class="box"><h2>✔ Sesiune încheiată</h2><p>Stai încă 1–2 minute, respiră lent. Bea apă dacă dorești.</p><button class="b" onclick="$('#modal').innerHTML=''">OK</button></div></div>`;beep(990)}else $('#modal').innerHTML=''}
function sesNext(d){SES.i=Math.max(0,Math.min(SES.pts.length-1,SES.i+d));SES.left=SES.sec;drawSes()}
function sesPause(){SES.paused=!SES.paused;drawSes()}
function sesTime(v){SES.sec=+v;SES.left=SES.sec;drawSes()}
function drawSes(){
  if(!SES.on)return;const p=SES.pts[SES.i];
  $('#modal').innerHTML=`<div class="modal"><div class="box">
   <p class="mut">${esc(SES.title)} · ${SES.i+1}/${SES.pts.length}</p>
   <h2 style="margin:.2rem 0"><span class="badge" style="background:${MCOL[p.m]}">${esc(p.c)}</span>${esc(p.p)}</h2>
   <p style="margin:.3rem 0"><b>Localizare:</b> ${esc(p.l)}</p>
   ${p.w?`<p class="w" style="color:var(--acc2)">${esc(p.w)}</p>`:''}
   <div class="breath">${SES.left}</div>
   <p class="mut">Presiune fermă dar confortabilă · inspiră 4 s · expiră 6 s · ambele părți unde e cazul</p>
   <div class="bar" style="justify-content:center">
    <button class="b alt" onclick="sesNext(-1)" ${SES.i===0?'disabled':''}>◀</button>
    <button class="b" onclick="sesPause()">${SES.paused?'▶':'❚❚'}</button>
    <button class="b alt" onclick="sesNext(1)" ${SES.i===SES.pts.length-1?'disabled':''}>▶</button>
    <button class="b alt" onclick="endSes(false)">✕</button></div>
   <div class="bar" style="justify-content:center"><select onchange="sesTime(this.value)">${[30,45,60,90,120].map(s=>`<option value="${s}" ${SES.sec===s?'selected':''}>${s} s / punct</option>`).join('')}</select>
   <label class="mut" style="align-self:center"><input type="checkbox" ${SES.beep?'checked':''} onchange="SES.beep=this.checked"> sunet</label></div>
  </div></div>`;
}

function genQ(){
  const out=[];
  for(const q of sh(QM).slice(0,6))out.push({t:q[0],a:q[1],o:sh([q[1],...q[2]])});
  for(let k=0;k<2;k++){const p=sh(PT.filter(x=>x.p&&x.c!=='EX'))[0];const w=sh(PT.filter(x=>x.p!==p.p)).slice(0,3).map(x=>x.p);out.push({t:`Care este numele pinyin al punctului ${p.c}?`,a:p.p,o:sh([p.p,...w])})}
  for(let k=0;k<1;k++){const m=sh(MER.filter(x=>x.t!=='—'))[0];const w=sh(MER.filter(x=>x.t!=='—'&&x.t!==m.t)).slice(0,3).map(x=>x.t);out.push({t:`În ce interval orar este maximul meridianului ${m.n}?`,a:m.t,o:sh([m.t,...w])})}

function qGen(n){ // întrebări generate din date (pinyin, ore, elemente)
  const out=[];const sh2=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

  if(k==='loc')return PT.filter(p=>p.l).map(p=>({id:'pl:'+p.c,f:esc(p.l),b:`<b style="font-size:1.4rem">${esc(p.c)}</b> ${esc(p.p)}`}));
  if(k==='mer')return MER.map(m=>({id:'m:'+m.c,f:`<b>${esc(m.n)}</b> (${esc(m.c)})`,b:`${esc(m.el)} · ${esc(m.yy)} · ${m.pts} puncte${m.t!=='—'?' · maxim '+esc(m.t):''}<br>${esc(m.path)}<br><span class="mut">${esc(m.key)}</span>`}));
  if(k==='var')return VAR.map(v=>({id:'v:'+v.id,f:`<b>${esc(v.n)}</b>`,b:`${esc(v.pr)}<br><span class="mut">${esc(v.sig)}</span>`}));
  if(k==='glo')return GLO.map((g,i)=>({id:'g:'+i,f:`<b>${esc(g[0])}</b>`,b:esc(g[1])}));
  return [];
}
function fcState(id){const s=sst().fc[id];return s||null}
function fcBuild(){
  const cards=fcDeck(SQ.deck);const now=Date.now();const st=sst().fc;
  const due=cards.filter(c=>st[c.id]&&st[c.id].d<=now);
  const fresh=cards.filter(c=>!st[c.id]);
  const extra=SQ.fc.extra||0;
  SQ.fc.queue=due.concat(fresh.slice(0,10+extra));
  SQ.fc.flip=false;SQ.fc.stat={due:due.length,fresh:fresh.length,learned:cards.filter(c=>st[c.id]&&st[c.id].b>=3).length,total:cards.length};
}
function fcRate(r){ // 0 din nou, 1 greu, 2 bine, 3 ușor
  const q=SQ.fc.queue;const c=q.shift();if(!c)return;const s=sst().fc;const cur=s[c.id]||{b:0,d:0};
  let b=cur.b;if(r===0)b=1;else if(r===1)b=Math.max(1,b);else if(r===2)b=Math.min(LEIT.length-1,b+1);else b=Math.min(LEIT.length-1,b+2);
  if(b<1)b=1;const days=LEIT[b];s[c.id]={b,d:Date.now()+days*86400000-(r===0?86400000:0)};
  if(r===0)q.push(c); // reia în sesiune
  save();SQ.fc.flip=false;render();
}
function vCards(){
  if(!SQ.fc.queue||SQ.fc.queue===undefined||SQ.fc.built!==SQ.deck){fcBuild();SQ.fc.built=SQ.deck}
  const q=SQ.fc.queue;const st=SQ.fc.stat||{due:0,fresh:0,learned:0,total:0};
  const decks=[['pts','dPts'],['loc','dLoc'],['mer','dMer'],['var','dVar'],['glo','dGlo']];
  return `<div class="bar"><label class="mut">${esc(su('deck'))}: <select onchange="SQ.deck=this.value;SQ.fc.built=null;SQ.fc.extra=0;render()">${decks.map(d=>`<option value="${d[0]}" ${SQ.deck===d[0]?'selected':''}>${esc(su(d[1]))}</option>`).join('')}</select></label></div>
  <p class="mut">${st.due} ${esc(su('due'))} · ${st.fresh} ${esc(su('newc'))} · ${st.learned}/${st.total} ${esc(su('learned'))}</p>
  ${q.length?`<div class="card" style="text-align:center;min-height:160px"><div style="font-size:1.1rem;margin:.4rem 0">${q[0].f}</div>${SQ.fc.flip?`<hr style="border:0;border-top:1px solid var(--line)"><div style="text-align:left">${q[0].b}</div>`:''}</div>
  <div class="bar">${SQ.fc.flip?`<button class="b alt" onclick="fcRate(0)">${esc(su('again2'))}</button><button class="b alt" onclick="fcRate(1)">${esc(su('hard'))}</button><button class="b" onclick="fcRate(2)">${esc(su('good'))}</button><button class="b" onclick="fcRate(3)">${esc(su('easy'))}</button>`:`<button class="b" onclick="SQ.fc.flip=true;render()">${esc(su('flip'))}</button>`}</div><p class="mut">${q.length} ↓</p>`
  :`<div class="card"><p>${esc(su('noDue'))}</p><button class="b" onclick="SQ.fc.extra=(SQ.fc.extra||0)+10;SQ.fc.built=null;render()">${esc(su('moreNew'))}</button></div>`}`;
}
function vProgress(){
  const s=sst();const keys=Object.keys(s.by);
  if(!s.n)return `<p class="mut">${esc(su('noStats'))}</p>`;
  const rows=keys.map(k=>({k,ok:s.by[k][0],n:s.by[k][1],p:Math.round(100*s.by[k][0]/s.by[k][1])})).sort((a,b)=>a.p-b.p);
  return `<div class="card"><b>${s.ok} / ${s.n}</b> ${esc(su('answered'))} · ${esc(su('acc'))} ${Math.round(100*s.ok/s.n)}%</div>
  <h3>${esc(su('weak'))}</h3><div class="tw"><table>${rows.map(r=>`<tr><td>${esc(suc(r.k))}</td><td style="width:50%"><div style="height:8px;border-radius:6px;background:var(--soft);overflow:hidden"><div style="height:100%;width:${r.p}%;background:${r.p<60?'var(--acc2)':'var(--acc)'}"></div></div></td><td>${r.p}% (${r.ok}/${r.n})</td></tr>`).join('')}</table></div>
  <p><button class="b alt" onclick="if(confirm(su('confirmReset'))){S.study={by:{},fc:{},n:0,ok:0};save();SQ.fc.built=null;render()}">${esc(su('resetStats'))}</button></p>`;
}
function vStudy(){
  const tab=SQ.tab;
  const tabs=`<div class="bar"><button class="b ${tab==='quiz'?'':'alt'}" onclick="SQ.tab='quiz';render()">${esc(su('tabQuiz'))}</button><button class="b ${tab==='cards'?'':'alt'}" onclick="SQ.tab='cards';SQ.fc.built=null;render()">${esc(su('tabCards'))}</button><button class="b ${tab==='prog'?'':'alt'}" onclick="SQ.tab='prog';render()">${esc(su('tabProg'))}</button></div>`;
  let body='';
  if(tab==='cards')body=vCards();
  else if(tab==='prog')body=vProgress();
  else if(SQ.run)body=vQuizRun();
  else{
    const cats=[...new Set(qPool().map(x=>x.cat))];
    body=`<p class="mut">${qPool().length} ${esc(su('bank'))}</p>
    <div class="card"><div class="bar">
     <label class="mut">${esc(su('cat'))}: <select onchange="SQ.cat=this.value">${'<option value="">'+esc(su('all'))+'</option>'+cats.map(c=>`<option value="${esc(c)}" ${SQ.cat===c?'selected':''}>${esc(suc(c))}</option>`).join('')}</select></label>
     <label class="mut">${esc(su('lvl'))}: <select onchange="SQ.lvl=+this.value"><option value="0">${esc(su('anyLvl'))}</option>${[1,2,3].map(l=>`<option value="${l}" ${SQ.lvl===l?'selected':''}>${l}</option>`).join('')}</select></label>
     <label class="mut">${esc(su('n'))}: <select onchange="SQ.n=this.value">${[10,20,30,'all'].map(n=>`<option value="${n}" ${String(SQ.n)===String(n)?'selected':''}>${n==='all'?esc(su('all')):n}</option>`).join('')}</select></label>
     <label class="mut">${esc(su('mode'))}: <select onchange="SQ.mode=this.value"><option value="practice" ${SQ.mode==='practice'?'selected':''}>${esc(su('practice'))}</option><option value="exam" ${SQ.mode==='exam'?'selected':''}>${esc(su('exam'))}</option></select></label>
    </div><button class="b" onclick="qBegin()">${esc(su('start'))}</button> <span class="mut">${esc(su('best'))}: ${S.best||0}</span></div>`;
  }
  return `<h1>${esc(su('title'))}</h1>${tabs}${body}`;
}
regView('quiz',vStudy,{},{nonav:true});
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
</body>
